# ╭──────────────────────────────────────────────────────────────────────────╮
# │ PÔLE 1. TEMPLATE MASTER : LOGIQUE SYSTÈME CLIMATISATION COMPLÈTE         │
# ╰──────────────────────────────────────────────────────────────────────────╯
#
# ## 📝 DESCRIPTION :
# Fichier master centralisant toute la logique de calcul thermique : detection du
# mode Ete/Hiver, consignes, temperatures cibles, confort jour et nuit, consignes
# de nuit anti-derive, corrections par piece, ecarts et derives de nuit, et deltas
# ADEME. C'est le cerveau du systeme thermique : toutes les automations clim en
# dependent, et le script p1_master_gestion_clim y lit ses cibles.
#
# ## 🧮 CALCUL & SOURCES :
# - sensor.th_balcon_nord_temperature : T° exterieure (sonde SONOFF balcon).
#   Lue avec un plancher (round(0, 'floor')) dans temperature_confort : un arrondi
#   deplacerait les bornes d un demi-degre, un plancher non. Mesure du 2026-11-11 :
#   18 changements d etat pour la sonde brute, 6 avec le plancher, 1 avec l arrondi
#   qui se trompe de seuil a chaque bascule.
# - sensor.seuil_non_chauffage : 19 °C, seuil de bascule heat/off et consigne d hiver.
# - sensor.seuil_non_clim : 26 °C, seuil de bascule off/cool et consigne d ete.
# - sensor.consigne : lit seuil_non_chauffage en hiver, seuil_non_clim en ete.
# - Deltas : delta_1=1, delta_2=2, delta_3=3, delta_5=5, delta_7=7 (°C).
# - temperature_confort, hiver : consigne + delta_2 sous 8 °C, consigne + delta_1 de 8 a 12
#   et au-dela. La correction du 2026-11-10 qui ajoutait delta_3 sous 8 et delta_2 de 8 a 12
#   a ete annulee au retour arriere du 2026-11-11 : delta_3 n est lu nulle part.
# - temperature_confort, ete : t_ext - delta_7 a 34 °C et plus, t_ext - delta_5 au-dessus
#   de 32, sinon la consigne d ete.
# - temperature_confort_nuit, hiver : consigne + delta_1 plafonnee par seuil_non_chauffage,
#   donc 19. En ete : t_conf plafonnee par seuil_non_clim, donc 26 max, sans retrait de
#   delta_2 (decision Eric du 2026-11-11, 24 °C la nuit etait trop froid).
# - Offsets de nuit (0,3 °C) : largeur de bande morte qui evite qu une piece a 19,05
#   declenche puis 19,0 remonte en boucle.
# - Consignes de nuit : seuil de la saison plus un decalage pris dans
#   input_number.clim_consigne_nuit_* (0 par defaut, -3 a +3).
# - Ecart de nuit : temperature reelle de la piece moins la consigne de nuit, signe.
#   Derive de nuit : booleen qui applique la bonne regle selon la saison, heat si
#   ecart > +offset, cool si ecart < -offset.
#
# ## 🔗 CHAINE DE DEPENDANCES :
#
# | MATERIEL       | CAPTEUR BRUT (source)                    | CE FICHIER (unique_id)                    | AVAL                        |
# |:---------------|:-----------------------------------------|:------------------------------------------|:----------------------------|
# | [calcule]      | valeurs codees en dur                    | temperature_eco_hiver/_ete, seuil_non_chauffage/_clim, delta_1/_2/_3/_5/_7, offset_nuit_* | tout le reste |
# | Sonde balcon   | sensor.th_balcon_nord_temperature        | mode_ete_hiver, consigne, temperature_confort | L1C3, script 5C         |
# | Sonde balcon   | + constantes                             | temperature_confort_jour/_nuit, temperature_eco_*_corrige | script 5C           |
# | input_number   | input_number.clim_consigne_nuit_*        | temperature_consigne_nuit_salon/_bureau/_chambre | script 5C en periode nuit |
# | Sondes pieces  | sensor.th_salon/_bureau/_chambre_temperature | ecart_nuit_*, derive_nuit_*          | automatisations J K L       |
# | [calcule]      | consigne, confort_jour, deltas           | temperature_corrige_salon/_bureau/_chambre | script 5C en periode jour |
# | 6 sondes SONOFF| th_salon/_cellier/_cuisine/_bureau/_sdb/_chambre | temperature_moyenne_interieure | L1C2                   |
# | [calcule]      | moyenne interieure + balcon + confort_jour | temperature_delta_value/_affichage, delta_ademe_recommande | L1C2 |
#
# ## ⚠️ IMPORTANT (PIEGES) :
# - Fichier CRITIQUE : toute modification impacte TOUTES les automations clim.
# - Les capteurs se recalculent en cascade. Un template ne publie un nouvel etat que
#   si sa VALEUR change : last_updated bouge a chaque recalcul, last_changed seulement
#   quand la valeur differe.
# - Comparer l exterieur a un seuil avec un arrondi deplace la borne d un demi-degre.
#   Le plancher est fidele pour < 8, < 12 et >= 34. Pour la borne > 32 de l ete il
#   faudrait ecrire >= 33, sinon la branche canicule est atteinte un demi-degre plus
#   tard qu avec la sonde brute.
# - temperature_confort_nuit ne sert plus a la consigne de nuit, qui lit le seuil de
#   la saison. Elle alimente encore les corriges et delta_ademe_recommande : ne pas la
#   supprimer en croyant qu elle est devenue inutile.
# - Replis : jamais float(0) sur un seuil. Un seuil indisponible a 0 ferait tomber
#   min() a 0 °C et enverrait la consigne de nuit a zero sur les trois clims.
# - delta_2 n est plus lu dans la branche nuit d ete depuis le 2026-11-11, mais il sert
#   toujours a temperature_eco_* et aux corriges.
# - temperature_moyenne_interieure exclut les sondes a 0 (reject '==0') pour eviter de
#   baisser la moyenne sur une sonde hors ligne.
# - delta_ademe_recommande utilise temperature_confort_JOUR, pas temperature_confort.
#
# ## 🖥️ TABLEAU DE BORD (VIGNETTES PRINCIPALES) :
# - L1C3 Commandes Clim (consignes de jour, consignes de nuit, etats modes, derives)
# - L1C2 Temperatures (T° moyenne interieure, delta interieur/exterieur)
#
- sensor:
# ┌──────────────────────────────────────┐
# │ PARAMÈTRES FIXES ET DELTAS DE CALCUL │
# └──────────────────────────────────────┘

# --- temperature_eco_hiver ---
    - name: "Temperature éCO. Hiver"
      unique_id: temperature_eco_hiver
      unit_of_measurement: "°C"
      state: "17"

# --- temperaturle_eco_ete ---
    - name: "Temperature éCO. Eté"
      unique_id: temperature_eco_ete
      unit_of_measurement: "°C"
      state: "28"

# --- seuil_non_chauffage ---
    - name: "Seuil non chauffage"
      unique_id: seuil_non_chauffage
      unit_of_measurement: "°C"
# Repli des templates : 19, valeur de ce state, et jamais 18. Un repli different
# de la constante fabriquerait une panne silencieuse : le capteur tombe, le calcul
# continue avec un autre chiffre, et toute la partie hivernale se decale d un degre
# sans qu on voie rien. Le repli doit rendre le bon chiffre, pas un chiffre plausible.
      state: "17"

# --- seuil_non_clim ---
    - name: "Seuil non clim"
      unique_id: se9uil_non_clim
      unit_of_measurement: "°C"
# Repli des templates : 26, valeur de ce state. Meme raison que pour le seuil de
# chauffage. Le 26 est aussi le plafond de la nuit d ete et la consigne d ete.
      state: "26"

# --- delta_1 ---
    - name: "Delta_1"
      unique_id: delta_1
      state: "1"
      unit_of_measurement: "°C"

# --- delta_2 ---
    - name: "Delta_2"
      unique_id: delta_2
      state: "2"
      unit_of_measurement: "°C"

# --- delta_3 ---
    - name: "Delta_3"
      unique_id: delta_3
      state: "3"
      unit_of_measurement: "°C"

# --- delta_5 ---
    - name: "Delta_5"
      unique_id: delta_5
      state: "5"
      unit_of_measurement: "°C"

# --- delta_7 ---
    - name: "Delta_7"
      unique_id: delta_7
      state: "7"
      unit_of_measurement: "°C"

# ┌───────────────────────────────────────────────────────────┐
# │ OFFSETS DE NUIT : MARGE DE DECLENCHEMENT ANTI-DERIVE      │
# └───────────────────────────────────────────────────────────┘
# La consigne de nuit de chaque piece est un input_number qui vaut
# 19. Quand la temperature reelle depasse cette consigne PLUS cet
# offset, l automatisation de la piece passe la consigne a 18 et
# lance un timer de 10 minutes, qui la ramene a 19.
# Sans cette marge, une piece a 19,05 declencherait, puis 19,0
# ferait remonter, puis 19,05 redéclencherait : oscillation sans fin.
# Ces offsets ne sont pas des temperatures visees, ce sont des
# largeurs de bande morte.

# --- offset_nuit_salon ---
    - name: "Offset nuit Salon"
      unique_id: offset_nuit_salon
      unit_of_measurement: "°C"
      state: "0.3"

# --- offset_nuit_bureau ---
    - name: "Offset nuit Bureau"
      unique_id: offset_nuit_bureau
      unit_of_measurement: "°C"
      state: "0.3"

# --- offset_nuit_chambre ---
    - name: "Offset nuit Chambre"
      unique_id: offset_nuit_chambre
      unit_of_measurement: "°C"
      state: "0.3"

# ┌───────────────────────────────────────────────────┐
# │ DÉTECTION DU MODE GÉNÉRAL MODE ETE/HIVER          │
# └───────────────────────────────────────────────────┘

# --- mode_ete_hiver ---
    - name: "Mode Été/Hiver"
      unique_id: mode_ete_hiver
      state: >
        {% set t_ext = states('sensor.th_balcon_nord_temperature') | float(-999) %}
        {% set temp_no_chauf = states('sensor.seuil_non_chauffage') | float(19) %}
        {% set temp_no_clim = states('sensor.seuil_non_clim') | float(26) %}
        {% if t_ext == -999 %}
          unknown
        {% elif t_ext < temp_no_chauf %}
          heat
        {% elif t_ext < temp_no_clim %}
          off
        {% else %}
          cool
        {% endif %}

# ┌───────────────────────────────────────────────────┐
# │ CONSIGNES                                         │
# └───────────────────────────────────────────────────┘

# --- consigne ---
    - name: "Consigne"
      unique_id: consigne
      unit_of_measurement: "°C"
      state: >
        {% if is_state('sensor.mode_ete_hiver', 'cool') %}
          {{ states('sensor.seuil_non_clim') | float(26) }}
        {% else %}
          {{ states('sensor.seuil_non_chauffage') | float(19) }}
        {% endif %}

# ┌───────────────────────────────────────────────────┐
# │ CONSIGNES CONFORT                                 │
# └───────────────────────────────────────────────────┘

# --- temperature_confort ---
    - name: "Temperature confort"
      unique_id: temperature_confort
      unit_of_measurement: "°C"
      state: >
        {#- Plancher et non arrondi (mesure du 2026-11-11) : un arrondi deplace les
            bornes d un demi-degre, a 7,9 il rend 8 et la comparaison 8 < 8 devient
            fausse. Un plancher rend 7 et la borne reste juste. Sur 20 releves de la
            nuit : 18 changements pour la brute, 6 avec le plancher, 1 avec l arrondi
            qui se trompe de seuil a chaque bascule. -#}
        {% set t_ext = states('sensor.th_balcon_nord_temperature') | float(0) | round(0, 'floor') %}
        {% set consigne = states('sensor.consigne') | float(19) %}
        {% set d1 = states('sensor.delta_1') | float(1) %}
        {% set d2 = states('sensor.delta_2') | float(2) %}
        {% set d5 = states('sensor.delta_5') | float(5) %}
        {% set d7 = states('sensor.delta_7') | float(7) %}
        {% if is_state('sensor.mode_ete_hiver', 'cool') %}
          {% if t_ext >= 34 %}{{ (t_ext - d7) | round(1) }}
          {% elif t_ext > 32 %}{{ (t_ext - d5) | round(1) }}
          {% else %}{{ consigne | round(1) }}{% endif %}
        {% else %}
          {% if t_ext < 8 %}{{ (consigne + d2) | round(1) }}
          {% elif t_ext < 12 %}{{ (consigne + d1) | round(1) }}
          {% else %}{{ consigne + d1| round(1) }}{% endif %}
        {% endif %}

# --- temperature_confort_jour ---
    - name: "Temperature confort Jour"
      unique_id: temperature_confort_jour
      unit_of_measurement: "°C"
      state: >
        {% set t_conf = states('sensor.temperature_confort') | float(0) %}
        {{ t_conf | round(1) }}

# --- temperature_confort_nuit ---
    - name: "Temperature confort nuit"
      unique_id: temperature_confort_nuit
      unit_of_measurement: "°C"
      state: >
        {#- Seuils lus dans les capteurs, plus de 26 en dur (Eric, 2026-11-11).
            Les replis restent 18 et 26 et JAMAIS 0 : si le seuil devient
            indisponible, un repli a 0 ferait tomber min() a 0 C et enverrait
            la consigne de nuit a zero sur les trois clims. -#}
        {% set seuil_chauff = states('sensor.seuil_non_chauffage') | float(19) %}
        {% set seuil_clim = states('sensor.seuil_non_clim') | float(26) %}
        {% set t_conf = states('sensor.temperature_confort') | float(0) %}
        {% set d1 = states('sensor.delta_1') | float(1) %}
        {% set d2 = states('sensor.delta_2') | float(2) %}
        {% if is_state('sensor.mode_ete_hiver', 'cool') %}
          {{ [t_conf, seuil_clim] | min | round(1) }} {# nuit d ete : 26 max, pas de -d2 qui donnait 24 #}
        {% else %}
          {{ [t_conf + d1, seuil_chauff] | min | round(1) }} {# stabilise la nuit l'hiver a 18 ou 19 #}
        {% endif %}

# ┌───────────────────────────────────────────────────────────┐
# │ CONSIGNE DE NUIT PAR PIECE, LUE DANS L INPUT_NUMBER       │
# └───────────────────────────────────────────────────────────┘
# La base vient du seuil de la saison : seuil_non_chauffage (19) en hiver,
# seuil_non_clim (26) en ete. Plus de dependance a temperature_confort_nuit.
# L input_number n est PAS une consigne mais un DECALAGE, a 0 par
# defaut, que les automatisations J, K et L font passer a -1 pendant
# 10 minutes quand la piece depasse, puis remettent a 0.
# Ainsi la consigne suit la saison sans reference figee : 19 - 1 = 18
# en hiver, 26 - 1 = 25 en ete.

# ┌───────────────────────────────────────────────────────────┐
# │ CONSIGNES DE NUIT ET ANTI-DERIVE (2026-11-11)             │
# └───────────────────────────────────────────────────────────┘
# Dispositif distinct de temperature_confort_nuit, qui n est
# plus la consigne envoyee. Ici la consigne part du SEUIL de
# la saison, 19 en hiver et 26 en ete, et l humain la decale
# avec input_number.clim_consigne_nuit_*, de -3 a +3 par pas
# de 0,5. A zero, la consigne de nuit egale le seuil.
#
# Ensuite trois etages, un par piece :
# - temperature_consigne_nuit_* : ce qu on veut la nuit
# - ecart_nuit_* : temperature reelle moins cette consigne
# - derive_nuit_* : on/off, avec le bon sens selon la saison
#
# La derive s inverse en ete. En hiver une piece trop chaude
# demande a baisser, en ete une piece trop froide demande a
# monter. C est pour ca que derive_nuit_* lit mode_ete_hiver
# et pas une seule comparaison.
#
# Les automatisations J K L ne lisent PAS encore derive_nuit_*.
# Elles comparent la temperature brute a consigne + offset :
# juste en hiver, aveugle en ete. Correctif a faire.

# --- temperature_consigne_nuit_salon ---
    - name: "Temperature consigne nuit Salon"
      unique_id: temperature_consigne_nuit_salon
      unit_of_measurement: "°C"
      state: >-
        {% if is_state('sensor.mode_ete_hiver', 'cool') %}
          {{ ((states('sensor.seuil_non_clim') | float(26)) +
          (states('input_number.clim_consigne_nuit_salon') | float(0))) | round(1) }}
        {% else %}
          {{ ((states('sensor.seuil_non_chauffage') | float(19)) +
          (states('input_number.clim_consigne_nuit_salon') | float(0))) | round(1) }}
        {% endif %}

# --- temperature_consigne_nuit_bureau ---
    - name: "Temperature consigne nuit Bureau"
      unique_id: temperature_consigne_nuit_bureau
      unit_of_measurement: "°C"
      state: >-
        {% if is_state('sensor.mode_ete_hiver', 'cool') %}
          {{ ((states('sensor.seuil_non_clim') | float(26)) +
          (states('input_number.clim_consigne_nuit_bureau') | float(0))) | round(1) }}
        {% else %}
          {{ ((states('sensor.seuil_non_chauffage') | float(19)) +
          (states('input_number.clim_consigne_nuit_bureau') | float(0))) | round(1) }}
        {% endif %}

# --- temperature_consigne_nuit_chambre ---
    - name: "Temperature consigne nuit Chambre"
      unique_id: temperature_consigne_nuit_chambre
      unit_of_measurement: "°C"
      state: >-
        {% if is_state('sensor.mode_ete_hiver', 'cool') %}
          {{ ((states('sensor.seuil_non_clim') | float(26)) +
          (states('input_number.clim_consigne_nuit_chambre') | float(0))) | round(1) }}
        {% else %}
          {{ ((states('sensor.seuil_non_chauffage') | float(19)) +
          (states('input_number.clim_consigne_nuit_chambre') | float(0))) | round(1) }}
        {% endif %}


# ┌───────────────────────────────────────────────────────────┐
# │ ECART NUIT SIGNE ET DERIVE, VALABLES DANS LES DEUX SENS    │
# └───────────────────────────────────────────────────────────┘
# ecart = temperature reelle de la piece moins la consigne de nuit.
# Positif quand la piece est trop chaude, negatif quand elle est trop froide.
#
# La DERIVE depend de la saison, et c est tout l interet :
#   en heat, la clim chauffe et depasse          -> derive si ecart > +offset
#   en cool, la clim refroidit et passe dessous  -> derive si ecart < -offset
# Un seul capteur booleen par piece evite d ecrire la branche de saison
# dans chaque automatisation.

# --- ecart_nuit_salon ---
    - name: "Ecart nuit Salon"
      unique_id: ecart_nuit_salon
      unit_of_measurement: "°C"
      state: >-
        {{ ((states('sensor.th_salon_temperature') | float(0)) -
        (states('sensor.temperature_consigne_nuit_salon') | float(19))) | round(1) }}

# --- derive_nuit_salon ---
    - name: "Derive nuit Salon"
      unique_id: derive_nuit_salon
      state: >-
        {% set x = states('sensor.ecart_nuit_salon') | float(0) %}
        {% set o = states('sensor.offset_nuit_salon') | float(0.3) %}
        {% if is_state('sensor.mode_ete_hiver', 'cool') %}
          {{ 'on' if x < (0 - o) else 'off' }}
        {% elif is_state('sensor.mode_ete_hiver', 'heat') %}
          {{ 'on' if x > o else 'off' }}
        {% else %}off{% endif %}
# --- ecart_nuit_bureau ---
    - name: "Ecart nuit Bureau"
      unique_id: ecart_nuit_bureau
      unit_of_measurement: "°C"
      state: >-
        {{ ((states('sensor.th_bureau_temperature') | float(0)) -
        (states('sensor.temperature_consigne_nuit_bureau') | float(19))) | round(1) }}

# --- derive_nuit_bureau ---
    - name: "Derive nuit Bureau"
      unique_id: derive_nuit_bureau
      state: >-
        {% set x = states('sensor.ecart_nuit_bureau') | float(0) %}
        {% set o = states('sensor.offset_nuit_bureau') | float(0.3) %}
        {% if is_state('sensor.mode_ete_hiver', 'cool') %}
          {{ 'on' if x < (0 - o) else 'off' }}
        {% elif is_state('sensor.mode_ete_hiver', 'heat') %}
          {{ 'on' if x > o else 'off' }}
        {% else %}off{% endif %}
# --- ecart_nuit_chambre ---
    - name: "Ecart nuit Chambre"
      unique_id: ecart_nuit_chambre
      unit_of_measurement: "°C"
      state: >-
        {{ ((states('sensor.th_chambre_temperature') | float(0)) -
        (states('sensor.temperature_consigne_nuit_chambre') | float(19))) | round(1) }}

# --- derive_nuit_chambre ---
    - name: "Derive nuit Chambre"
      unique_id: derive_nuit_chambre
      state: >-
        {% set x = states('sensor.ecart_nuit_chambre') | float(0) %}
        {% set o = states('sensor.offset_nuit_chambre') | float(0.3) %}
        {% if is_state('sensor.mode_ete_hiver', 'cool') %}
          {{ 'on' if x < (0 - o) else 'off' }}
        {% elif is_state('sensor.mode_ete_hiver', 'heat') %}
          {{ 'on' if x > o else 'off' }}
        {% else %}off{% endif %}
# ┌─────────────────────────────────┐
# │ CORRECTIONS SPÉCIFIQUES         │
# └─────────────────────────────────┘

# ┌─────────────────────────────────┐
# │ 04. SALON                       │
# └─────────────────────────────────┘
# --- temperature_corrige_salon ---
    - name: "Temperature Corrigé Salon"
      unique_id: temperature_corrige_salon
      unit_of_measurement: "°C"
      device_class: temperature
      state: >
        {% set d1 = states('sensor.delta_1') | float(1) %}
        {% set d3 = states('sensor.delta_3') | float(2) %}
        {% if is_state('sensor.mode_ete_hiver', 'cool') %}
          {% set t_ext = states('sensor.th_balcon_nord_temperature') | float(0) %}
          {{ [t_ext - d1, 26] | min | int }}
        {% else %}
          {% set tccsj_s = states('sensor.temperature_confort_jour') | float(0) %}
          {{ [tccsj_s, 22] | min | round(1) }}
        {% endif %}

# ┌─────────────────────────────────┐
# │ 07. BUREAU                      │
# └─────────────────────────────────┘
# --- temperature_corrige_bureau ---
    - name: "Temperature Corrigé Bureau"
      unique_id: temperature_corrige_bureau
      unit_of_measurement: "°C"
      device_class: temperature
      state: >
        {% set d1 = states('sensor.delta_1') | float(1) %}
        {% set d2 = states('sensor.delta_2') | float(2) %}
        {% if is_state('sensor.mode_ete_hiver', 'cool') %}
          {% set t_ext = states('sensor.th_balcon_nord_temperature') | float(0) %}
          {{ [t_ext , 27] | min | int }}
        {% else %}
          {% set tccsj_b = states('sensor.temperature_confort_jour') | float(0) %}
          {{ [tccsj_b, 19] | min | round(1) }}
        {% endif %}

# ┌─────────────────────────────────┐
# │ 09. CHAMBRE                     │
# └─────────────────────────────────┘
# --- temperature_corrige_chambre ---
    - name: "Temperature Corrigé Chambre"
      unique_id: temperature_corrige_chambre
      unit_of_measurement: "°C"
      device_class: temperature
      state: >
        {% set d1 = states('sensor.delta_1') | float(1) %}
        {% set d2 = states('sensor.delta_2') | float(2) %}
        {% if is_state('sensor.mode_ete_hiver', 'cool') %}
          {% set t_ext = states('sensor.th_balcon_nord_temperature') | float(0) %}
          {{ [t_ext + d1, 27] | min | int }}
        {% else %}
          {% set tccsj_c = states('sensor.temperature_confort_jour') | float(0) %}
          {{ [tccsj_c, 19] | min | int }}
        {% endif %}

# ┌────────────────────────────────────────────────┐
# │ MOTEURS DE CALCUL DYNAMIQUES (éCO été/hiver)   │
# └────────────────────────────────────────────────┘

# --- temperature_eco_hiver_corrige ---
    - name: "Temperature éCO. Hiver Corrigé"
      unique_id: temperature_eco_hiver_corrige
      unit_of_measurement: "°C"
      state: >
        {% set t_ext = states('sensor.th_balcon_nord_temperature') | float(0) %}
        {% set temp_eco = states('sensor.temperature_eco_hiver') | float(17) %}
        {% set d1 = states('sensor.delta_1') | float(1) %}
        {% set d2 = states('sensor.delta_2') | float(2) %}
        {% if t_ext < 8 %} {{ temp_eco + d2 }}
        {% elif t_ext < 12 %} {{ temp_eco + d1 }}
        {% else %} {{ temp_eco }}
        {% endif %}

# --- temperature_eco_ete_corrige ---
    - name: "Temperature éCO. Ete Corrigé"
      unique_id: temperature_eco_ete_corrige
      unit_of_measurement: "°C"
      state: >
        {% set t_ext = states('sensor.th_balcon_nord_temperature') | float(0) %}
        {% set temp_eco = states('sensor.temperature_eco_ete') | float(28) %}
        {% set d1 = states('sensor.delta_1') | float(1) %}
        {% set d2 = states('sensor.delta_2') | float(2) %}
        {% if t_ext >= 28 %}
          {{ temp_eco }}
        {% else %}
          {{ temp_eco - d1 }}
        {% endif %}

# ┌────────────────────────────────────────────────────┐
# │ MOYENNES, DELTAS INTERNES ET RECOMMANDATIONS ADEME │
# └────────────────────────────────────────────────────┘

# --- temperature_moyenne_interieure ---
    - name: "Température moyenne intérieure"
      unique_id: temperature_moyenne_interieure
      unit_of_measurement: "°C"
      icon: "mdi:home-thermometer"
      state: >
        {% set sensors = [
          states('sensor.th_salon_temperature'),
          states('sensor.th_cellier_temperature'),
          states('sensor.th_cuisine_temperature'),
          states('sensor.th_bureau_temperature'),
          states('sensor.th_salle_de_bain_temperature'),
          states('sensor.th_chambre_temperature')
        ] %}
        {% set values = sensors | map('float', 0) | reject('==', 0) | list %}
        {{ (values | sum / values | count) | round(1) if values | count > 0 else 0 }}

# --- temperature_delta_value ---
    - name: "Temperature Delta (valeur)"
      unique_id: temperature_delta_value
      unit_of_measurement: "°C"
      state: >
        {% set t_int = states('sensor.temperature_moyenne_interieure') | float(0) %}
        {% set t_ext = states('sensor.th_balcon_nord_temperature') | float(0) %}
        {{ (t_int - t_ext) | round(1) }}

# --- temperature_delta_affichage ---
    - name: "Température Delta (Affichage)"
      unique_id: temperature_delta_affichage
      state: >
        T̄i {{ states('sensor.temperature_moyenne_interieure') | float(0) | round(1) }}°C
        Te {{ states('sensor.th_balcon_nord_temperature') | float(0) | round(1) }}°C
        ΔT = {{ (states('sensor.temperature_moyenne_interieure') | float(0) - states('sensor.th_balcon_nord_temperature') | float(0)) | round(1) }}°C

# --- delta_ademe_recommande ---
    - name: "Delta ADEME Recommandé"
      unique_id: delta_ademe_recommande
      unit_of_measurement: "°C"
      icon: "mdi:delta"
      state: >
        {{ (states('sensor.temperature_confort_jour') | float(0) -
            states('sensor.th_balcon_nord_temperature') | float(0)) | round(1) }}

