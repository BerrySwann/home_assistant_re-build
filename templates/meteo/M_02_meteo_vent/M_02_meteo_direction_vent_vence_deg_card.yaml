# ╭────────────────────────────────────────────────────────────────────────────╮
# │ METEO. TEMPLATE : VENT VENCE - DIRECTION EN DEGRES                         │
# ╰────────────────────────────────────────────────────────────────────────────╯
#
# DESCRIPTION :
# 1 sensor : direction du vent en degres (0-360) pour windrose-card.
# Remplace 0 par 1 (windrose-card interprete 0 comme absence de donnee).
#
# SOURCE     : weather.vence | attribut wind_bearing (degres)
# unique_id  : direction_vent_vence_deg
# entity_id  : sensor.direction_vent_vence_deg
#
# CHAINE :
# weather.vence (wind_bearing) -> direction_vent_vence_deg -> windrose-card L1C1
#
# PIEGES :
# - 0 remplace par 1 : comportement windrose-card.
# - Si wind_bearing None -> retourne 0 (rose vide).
# - Fichier complementaire : M_02_meteo_vitesse_vent_vence_kmh_card.yaml
#
# TABLEAU DE BORD : L1C1 Meteo (windrose-card bearing)
- sensor:
# ┌───────────────────────────────────────────────────────────┐
# │ windrose-card - LABEL DIRECTION VENT VENCE                │
# └───────────────────────────────────────────────────────────┘
# windrose-card - Direction Vent Vence
# --- direction_vent_vence_deg ---
    - name: "Direction Vent Vence deg"
      unique_id: direction_vent_vence_deg
      state: >
        {% set bearing = state_attr('weather.vence', 'wind_bearing') %}
        {% if bearing is not none %}
          {% set b = bearing | float(0) | round(0) %}
          {% if b == 0 %} 1
          {% else %} {{ b }}
          {% endif %}
        {% else %} 0 {% endif %}
      unit_of_measurement: "°"