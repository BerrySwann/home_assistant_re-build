# ╭──────────────────────────────────────────────────────────────────────────╮
# │ MÉTÉO. TEMPLATE : TENDANCE TEMPÉRATURE BALCON NORD (BALCON NORD TREND)   │
# ╰──────────────────────────────────────────────────────────────────────────╯
#
# ## 📝 DESCRIPTION :
# Sensor template calculant la tendance (increasing / stable / decreasing)
# de la température extérieure sur le balcon Nord. Le résultat alimente
# l'icône de flèche directionnelle (↑ ↓ →) dans la vignette Températures
# et le pop-up #exterieur.
#
# ## 🧮 CALCUL & SOURCES :
# - sensor.th_balcon_nord_temperature : T° actuelle (sonde SONOFF balcon)
# - input_number.th_balcon_nord_temperature_previous : T° précédente stockée
# - Logique : current > previous -> increasing / < -> decreasing / = -> stable
# - L'input_number est mis à jour par une automation externe (périodique).
#
#
# ## 🔗 CHAÎNE DE DÉPENDANCES :
#
# | MATÉRIEL                 | CAPTEUR BRUT (source)                                                                | CE FICHIER (unique_id)            | AVAL                             |
# |:--------------------------|:--------------------------------------------------------------------------------------|:-----------------------------------|:----------------------------------|
# | Sonde SONOFF Balcon Nord | sensor.th_balcon_nord_temperature + input_number.th_balcon_nord_temperature_previous | th_balcon_nord_temperature_trend | L1C2 Températures (flèche ↑↓→) |
#
# ## ⚠️ IMPORTANT (PIÈGES) :
# - La tendance dépend de la fréquence de MàJ de l'input_number_previous.
#   Si l'automation de snapshot est trop fréquente (<5min), la tendance
#   oscillera. Recommandé : snapshot toutes les 30min.
# - La valeur est arrondie à 2 décimales pour éviter les oscillations
#   dues au bruit de mesure (fluctuations de ±0.01°C).
#
# ## 🖥️ TABLEAU DE BORD (VIGNETTES PRINCIPALES) :
# - L1C2 Températures (icône flèche ↑↓→ dans la vignette et pop-up #exterieur)

- sensor:
    # ┌───────────────────────────────────────────────────────────────────┐
    # │ M_04 : LOGIQUE TENDANCE TEMPÉRATURE (BALCON NORD)                 │
    # └───────────────────────────────────────────────────────────────────┘

    # Tendance Température (balcon nord)
    # --- th_balcon_nord_temperature_trend ---
    - name: "th balcon nord temperature trend"
      unique_id: th_balcon_nord_temperature_trend
      state: >
        {% set current = states('sensor.th_balcon_nord_temperature') | float(0) | round(2) %}
        {% set previous = states('input_number.th_balcon_nord_temperature_previous') | float(0) | round(2) %}
        {% if current > previous %}
          increasing
        {% elif current < previous %}
          decreasing
        {% else %}
          stable
        {% endif %}