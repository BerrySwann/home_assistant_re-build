# ╭──────────────────────────────────────────────────────────────────────────╮
# │ MÉTÉO. TEMPLATE : TENDANCE HUMIDITÉ BALCON NORD (BALCON NORD TREND)      │
# ╰──────────────────────────────────────────────────────────────────────────╯
#
# ## 📝 DESCRIPTION :
# Sensor template calculant la tendance (increasing / stable / decreasing)
# de l'humidité extérieure sur le balcon Nord. Le résultat alimente
# l'icône de flèche directionnelle (↑ ↓ →) dans la vignette Températures
# et le pop-up #exterieur.
#
# ## 🧮 CALCUL & SOURCES :
# - sensor.th_balcon_nord_humidity : Humidité actuelle (sonde SONOFF balcon)
# - input_number.th_balcon_nord_humidity_previous : Humidité précédente stockée
# - Logique : current > previous -> increasing / < -> decreasing / = -> stable
# - L'input_number est mis à jour par une automation externe (périodique).
#
#
# ## 🔗 CHAÎNE DE DÉPENDANCES :
#
# | MATÉRIEL                 | CAPTEUR BRUT (source)                                                          | CE FICHIER (unique_id)         | AVAL                             |
# |:--------------------------|:---------------------------------------------------------------------------------|:---------------------------------|:----------------------------------|
# | Sonde SONOFF Balcon Nord | sensor.th_balcon_nord_humidity + input_number.th_balcon_nord_humidity_previous | th_balcon_nord_humidity_trend | L1C2 Températures (flèche ↑↓→) |
#
# ## ⚠️ IMPORTANT (PIÈGES) :
# - La tendance dépend de la fréquence de MàJ de l'input_number_previous.
#   Si l'automation de snapshot est trop fréquente (<5min), la tendance
#   oscillera. Recommandé : snapshot toutes les 30min.
# - Le balcon Nord est exposé à la dépression VMC de la SDB - légère
#   influence possible sur les mesures d'humidité en hiver.
# - La valeur est arrondie à 2 décimales pour éviter les oscillations
#   dues au bruit de mesure (fluctuations de ±0.01%).
#
# ## 🖥️ TABLEAU DE BORD (VIGNETTES PRINCIPALES) :
# - L1C2 Températures (icône flèche ↑↓→ dans la vignette et pop-up #exterieur)

- sensor:
    # ┌───────────────────────────────────────────────────────────────────┐
    # │ M_04 : LOGIQUE TENDANCE HUMIDITÉ (BALCON NORD)                    │ 
    # └───────────────────────────────────────────────────────────────────┘

    # Tendance Humidité (balcon nord)
    # --- th_balcon_nord_humidity_trend ---
    - name: "th balcon nord humidity trend"
      unique_id: th_balcon_nord_humidity_trend
      state: >
        {% set current = states('sensor.th_balcon_nord_humidity') | float(0) | round(2) %}
        {% set previous = states('input_number.th_balcon_nord_humidity_previous') | float(0) | round(2) %}
        {% if current > previous %}
          increasing
        {% elif current < previous %}
          decreasing
        {% else %}
          stable
        {% endif %}