# ╭──────────────────────────────────────────────────────────────────────────╮
# │ MÉTÉO. TEMPLATE : ALERTES MÉTÉO-FRANCE — VENCE 06140 (10 NIVEAUX)        │
# ╰──────────────────────────────────────────────────────────────────────────╯
#
# ## 📝 DESCRIPTION :
# Sensors template créant 10 indicateurs d'alertes météo pour le
# département 06 (Alpes-Maritimes / Vence) : vent violent, inondation,
# orages, pluie-inondation, neige/verglas, grand-froid, canicule,
# avalanches, vagues-submersion, et synthèse globale. États : Vert /
# Jaune / Orange / Rouge.
#
# ## 🧮 CALCUL & SOURCES :
# - Source unique : sensor.06_weather_alert (intégration Météo France)
#   → attributs par type d'alerte (Vent violent, Inondation, etc.)
# - Attribut absent (Canicule l'hiver ; Grand-froid et Avalanches l'été) :
#   state_attr() renvoie None → le capteur retourne 'Vert' (pas d'erreur).
# - Le repli sur binary_sensor.meteoalarm (intégration MeteoAlarm, jamais
#   installée) a été supprimé le 2026-10-15 (alertes Spook entité inconnue).
#
#
# ## 🔗 CHAÎNE DE DÉPENDANCES :
#
# | MATÉRIEL       | CAPTEUR BRUT (source)                              | CE FICHIER (unique_id)                             | AVAL                               |
# |:---------------|:---------------------------------------------------|:---------------------------------------------------|:-----------------------------------|
# | Météo France (intégration) | sensor.06_weather_alert (attributs par type)       | alerte_vent_violent / alerte_inondation / alerte_orages / alerte_pluie_inondation / alerte_neige_verglas / alerte_grand_froid / alerte_canicule / alerte_avalanches / alerte_vagues_submersion | L1C1 Météo (bandeau alertes) |
#
# ## ⚠️ IMPORTANT (PIÈGES) :
# - L'alerte est DÉPARTEMENTALE (06 entier) — pas localisée à Vence.
# - Un attribut absent de sensor.06_weather_alert (hors saison) donne Vert,
#   jamais une erreur : ne pas retirer le else final des capteurs.

# ## 🖥️ TABLEAU DE BORD (VIGNETTES PRINCIPALES) :
# - L1C1 Météo (bandeau alertes coloré en haut de la vignette météo)

- sensor:

# ┌──────────────────────────────────────┐
# │ MÉTÉO — ALERTES (LOGIQUE ET DÉTAILS) │
# └──────────────────────────────────────┘

# --- alerte_vent_violent ---
    - name: 'Alerte Vent violent'
      unique_id: alerte_vent_violent                   # "[L39] modif"
      state: >-
        {% set wa = state_attr('sensor.06_weather_alert', 'Vent violent') %}
        {% if wa is not none and wa in ['Vert', 'Jaune', 'Orange', 'Rouge'] %}
          {% set al = wa %}
        {% else %}
          {% set al = 'Vert' %}
        {% endif %}
        {{ al }}
      icon: mdi:weather-windy

# --- alerte_inondation ---
    - name: 'Alerte Inondation'
