# - [Feat]    2026-07-20 temperature_confort_nuit : palier été dynamique selon vigilance canicule
#             (Vert/indispo=29, Jaune=30, Orange=30, Rouge=31) — source sensor.alerte_canicule (M_01).
# - [Resync]  2026-07-20 (16h07) : modif faite par Eric directement en prod (UI/Studio Code Server) —
#             plafonds été temperature_corrige_eric/_chambre relevés 27→28 ; réintégrés ici.
#             Boîtes ASCII 07.BUREAU/09.CHAMBRE/MOTEURS DE CALCUL restaurées à largeur conforme (37 car.).
# - [Tune]    2026-07-20 (bilan) : temperature_corrige_eric plafond ramené 28→27 (Bureau).
#             temperature_eco_ete_corrige (absent) inchangé — déjà conforme (26/27/28 selon T°ext).
# - [Tune]    2026-07-21 : temperature_corrige_chambre plafond 28→27 confirmé (28° trop chaud).
#             Code déjà à 27 — seule cette note était restée à 28 (incohérence log corrigée).
# - [Revert]  2026-07-20 : temperature_confort_nuit en cool = 26°C FIXE quoi qu'il arrive
#             (sommeil > conso, décision explicite). ANNULE le palier dynamique canicule
#             (Vert/Jaune/Orange/Rouge) ajouté plus tôt aujourd'hui — sensor.alerte_canicule
#             n'est plus consommé par ce fichier. Branches >32/>34/>palier + variables d5/d7
#             supprimées de temperature_confort_nuit (devenues inutiles).
