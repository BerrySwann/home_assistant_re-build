# ╭──────────────────────────────────────────────────────────────────────────╮
# │ MÉTÉO. TEMPLATE : DURÉE DU JOUR (CYCLE SOLAIRE - M_05)                   │
# ╰──────────────────────────────────────────────────────────────────────────╯
#
# ## 📝 DESCRIPTION :
# Durée du jour lever -> coucher, calculée par la formule NOAA (déclinaison en
# série de Fourier + réfraction atmosphérique et demi-diamètre solaire).
#
# ## 🧮 CALCUL & SOURCES :
# - lat = zone.home.latitude.
# - Déclinaison (NOAA, précision ~0,01°) :
#     gamma = 2 * pi * (j - 1) / 365
#     decl  = 0.006918 - 0.399912 cos(g) + 0.070257 sin(g)
#             - 0.006758 cos(2g) + 0.000907 sin(2g)
#             - 0.002697 cos(3g) + 0.001480 sin(3g)
# - Angle horaire avec zénith 90,833° (réfraction 34' + demi-diamètre 16') :
#     cos(ha) = cos(90.833°) / (cos(lat) cos(decl)) - tan(lat) tan(decl)
# - Durée = 2 * ha / 15 en heures.
#
#
# ## 🔗 CHAÎNE DE DÉPENDANCES :
#
# | MATÉRIEL                                | CAPTEUR BRUT (source)                                                       | CE FICHIER (unique_id) | AVAL                           |
# |:------------------------------------------|:-------------------------------------------------------------------------------|:--------------------------|:---------------------------------|
# | [calculé] (zone.home + horloge système) | zone.home.latitude + now() - calcul astronomique, PAS sun.sun (voir PIÈGES) | duree_du_jour            | L1C1 Météo (données solaires) |
#
# ## ⚠️ IMPORTANT (PIÈGES) :
# - La durée du jour est calculée astronomiquement - PAS via sun.sun (next_rising/setting).
#   Elle est donc disponible même si l'intégration Sun est absente ou en erreur.
# - Utilise zone.home.latitude -> vérifier que la zone Home est bien configurée.
# - Les fonctions sin/cos/acos/pi/tan sont disponibles nativement dans Jinja2 HA.
#
# ## 🖥️ TABLEAU DE BORD (VIGNETTES PRINCIPALES) :
# - L1C1 Météo (données solaires complémentaires - durée du jour).

- sensor:
    # ┌───────────────────────────────────┐
    # │ DURÉE DU JOUR                     │
    # └───────────────────────────────────┘
    # --- duree_du_jour ---
    - name: "Durée du Jour"
      unique_id: duree_du_jour
      unit_of_measurement: "h"
      icon: mdi:weather-sunny
      state: >
        {% set lat = state_attr('zone.home', 'latitude') | float(default=43.72) | float %}
        {% set lat_rad = lat * pi / 180 %}

        {# Jour de l'année (1-365) #}
        {% set day = now().timetuple().tm_yday %}

        {# Déclinaison solaire - série de Fourier NOAA #}
        {% set g = 2 * pi * (day - 1) / 365 %}
        {% set decl = 0.006918
                      - 0.399912 * cos(g) + 0.070257 * sin(g)
                      - 0.006758 * cos(2 * g) + 0.000907 * sin(2 * g)
                      - 0.002697 * cos(3 * g) + 0.001480 * sin(3 * g) %}

        {# Angle horaire pour un lever/coucher apparent (zénith 90,833°) #}
        {% set cos_h = cos(90.833 * pi / 180) / (cos(lat_rad) * cos(decl))
                       - tan(lat_rad) * tan(decl) %}

        {# Sécurité pour les limites polaires #}
        {% set cos_h = [ [-1, cos_h] | max, 1 ] | min %}
        {% set hour_angle = acos(cos_h) %}

        {# Résultat en heures #}
        {{ (2 * hour_angle * 180 / pi / 15) | round(2) }}