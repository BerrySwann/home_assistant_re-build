            }

            return `<div style="text-align: left; color: white; font-size: 13px; margin-bottom: 4px;">Vigieau / Vigi-Eau</div>
                    <div><span style="color: ${alertColor}; font-weight: bold;">${alertLevel}</span></div>`;
