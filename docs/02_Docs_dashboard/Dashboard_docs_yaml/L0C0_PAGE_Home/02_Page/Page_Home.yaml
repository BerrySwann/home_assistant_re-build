        let t_z = !bad_states.includes(raw_temp_z) ? raw_temp_z + '°' : '';

        let val_f = parseFloat(raw_temp_f); if (isNaN(val_f)) val_f = -999;
        let val_z = parseFloat(raw_temp_z); if (isNaN(val_z)) val_z = -999;
        let alert_f = (val_f > max_temp_f) && (val_f !== -999);
