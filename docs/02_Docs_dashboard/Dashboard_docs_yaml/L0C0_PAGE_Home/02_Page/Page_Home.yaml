type: grid
cards:
  - type: picture-elements
    image: /local/meteo/empty.png
    elements:
      - type: custom:meteo-card
        weather: weather.vence
        sun_entity: sun.sun
        house_angle: 180
        singleton_id: vence_meteo
        layers:
          - sky
          - background
          - sun
          - moon
          - foreground
        style:
          top: 50%
          left: 50%
          width: 100%
          height: 100%
      - type: custom:html-template-card
        title: ''
        ignore_line_breaks: true
        picture_elements_mode: true
        content: |-
          <div style="position:absolute;top:52%;left:50%;
            transform:translate(-50%,-50%) perspective(180px) rotateX(58deg);
            width:160px;height:160px;opacity:0.85;pointer-events:none;">
            <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
              <defs>
                <filter id="rose-shadow" x="-30%" y="-30%" width="160%" height="160%">
                  <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="rgba(0,0,0,0.75)"/>
                </filter>
              </defs>
              <g filter="url(#rose-shadow)">
                <circle cx="100" cy="100" r="78" fill="none" stroke="rgba(150,170,200,0.5)" stroke-width="1.5"/>
                <polygon points="146,54 108,100 146,146 100,108 54,146 92,100 54,54 100,92"
                  fill="rgba(120,150,190,0.7)"/>
                <polygon points="100,38 106,94 162,100 106,106 100,162 94,106 38,100 94,94"
                  fill="rgba(200,210,225,0.95)"/>
                <circle cx="100" cy="100" r="9" fill="rgba(10,20,40,0.9)" stroke="rgba(200,210,225,0.8)" stroke-width="2"/>
                <text x="100" y="34" text-anchor="middle" font-size="20" font-weight="bold" fill="rgba(220,230,245,1)" font-family="Arial,sans-serif">S</text>
                <text x="100" y="174" text-anchor="middle" font-size="20" font-weight="bold" fill="rgba(150,170,200,0.9)" font-family="Arial,sans-serif">N</text>
                <text x="22" y="106" text-anchor="middle" font-size="20" font-weight="bold" fill="rgba(150,170,200,0.9)" font-family="Arial,sans-serif">E</text>
                <text x="180" y="106" text-anchor="middle" font-size="20" font-weight="bold" fill="rgba(220,230,245,1)" font-family="Arial,sans-serif">W</text>
              </g>
            </svg>
          </div>
        style:
          top: 62%
          left: 50%
          width: 100%
          height: 100%
      - type: custom:html-template-card
        title: ''
        ignore_line_breaks: true
        picture_elements_mode: true
        content: |-
          {% if is_state('sensor.alerte_meteo', 'Jaune') or
                is_state('sensor.alerte_meteo', 'Orange') or
                is_state('sensor.alerte_meteo', 'Rouge') %}
          <style>
            @keyframes alerte-pulse {
              0%,100% { opacity:1; }
              50%      { opacity:0.3; }
            }
          </style>
          <div style="
            position:absolute;top:70%;left:50%;
            transform:translateX(-50%);
            font-size:14px;font-weight:bold;letter-spacing:4px;
            font-variant:small-caps;
            color:{% if is_state('sensor.alerte_meteo','Jaune') %}rgba(255,185,0,1)
                  {% elif is_state('sensor.alerte_meteo','Orange') %}rgb(255,105,49)
                  {% else %}rgba(150,10,10,1){% endif %};
            text-shadow:
              0 0 3px rgba(0,0,0,0.9),
              0 0 6px rgba(0,0,0,0.9),
              0 0 10px rgba(0,0,0,0.7);
            white-space:nowrap;pointer-events:none;
            {% if is_state('sensor.alerte_meteo','Rouge') %}animation:alerte-pulse 0.9s ease-in-out infinite;{% endif %}
          ">
            {% if is_state('sensor.alerte_meteo','Jaune') %}⚠️ Vigilance Jaune ⚠️
            {% elif is_state('sensor.alerte_meteo','Orange') %}⚠️ Vigilance Orange ⚠️
            {% else %}⚠️ Vigilance Rouge ⚠️
            {% endif %}
          </div>
          {% endif %}
        style:
          top: -5%
          left: 50%
          width: 100%
          height: 100%
      - type: custom:html-template-card
        title: ''
        ignore_line_breaks: true
        picture_elements_mode: true
        content: |-
          <div style="
            position:absolute;bottom:8px;left:50%;
            transform:translateX(-50%);
            font-size:16px;font-weight:bold;letter-spacing:4px;
            font-variant:small-caps;color:rgba(255,255,255,0.85);
            text-shadow:0px 1px 6px rgba(0,0,0,0.95);
            white-space:nowrap;pointer-events:none;">
            {{ states('sensor.vence_original_condition') }} — {{ states('sensor.th_balcon_nord_temperature') | float(0) | round(1) }}°C
          </div>
        style:
          top: 47%
          left: 50%
          width: 100%
          height: 100%
      - type: custom:html-template-card
        title: ''
        ignore_line_breaks: true
        picture_elements_mode: true
        content: |-
          <div style="
            position:absolute;top:8px;left:50%;
            transform:translateX(-50%);
            font-size:19px;font-weight:bold;letter-spacing:4px;
            font-variant:small-caps;color:rgba(255,255,255,0.85);
            text-shadow:0px 1px 6px rgba(0,0,0,0.95);
            white-space:nowrap;pointer-events:none;">
            VENCE — {{ now().strftime('%H:%M') }}
          </div>
        style:
          top: 50%
          left: 50%
          width: 100%
          height: 100%
    card_mod:
      style: |
        :host {
          display: block;
          height: 270px !important;
          overflow: hidden;
          border-radius: var(--ha-card-border-radius, 12px);
        }
  - type: custom:meteofrance-weather-card
    entity: weather.vence
    animated_icons: true
    alert_forecast: true
    details: false
    current: false
    one_hour_forecast: true
    forecast: true
    rainChanceEntity: sensor.vence_rain_chance
    uvEntity: sensor.vence_uv
    cloudCoverEntity: sensor.vence_cloud_cover
    freezeChanceEntity: sensor.vence_freeze_chance
    snowChanceEntity: sensor.vence_snow_chance
    alertEntity: sensor.06_weather_alert
    name: Vence
    detailEntity: sensor.temperature_delta_affichage
    daily_forecast: false
    wind_forecast_icons: true
    humidity_forecast: true
    hourly_forecast: false
    rainForecastEntity: sensor.vence_next_rain
    card_mod:
      style: |
        ha-card {
          background: none !important;
          box-shadow: none !important;
          border: none !important;
        }
  - type: conditional
    conditions:
      - condition: numeric_state
        entity: sensor.studio_code_server_pourcentage_du_processeur
        above: 1
    card:
      type: custom:button-card
      entity: sensor.studio_code_server_pourcentage_du_processeur
      name: Visual Server Code
      icon: mdi:microsoft-visual-studio-code
      show_state: true
      show_label: false
      state_display: |
        [[[ 
          return parseFloat(entity.state).toFixed(2) + ' %'; 
        ]]]
      layout: icon_name_state
      tap_action:
        action: call-service
        confirmation:
          text: |-
            ⚠️ VS Code semble bloqué ?

            Voulez-vous forcer le redémarrage de l'Add-on ?
        service: hassio.addon_restart
        service_data:
          addon: a0d7b954_vscode
      styles:
        card:
          - border-radius: 12px
          - height: 50px
          - padding: 0px 15px
          - border: none
          - box-shadow: none
          - background-color: |
              [[[
                return (parseFloat(entity.state) > 20) ? '#f44336' : '#03a9f4';
              ]]]
          - animation: |
              [[[
                return (parseFloat(entity.state) > 20) ? 'blink 1s ease infinite' : 'none';
              ]]]
        grid:
          - grid-template-columns: 35px auto 60px
        icon:
          - width: 24px
          - color: white
        name:
          - color: white
          - font-weight: bold
          - font-size: 14px
          - justify-self: start
        state:
          - color: white
          - font-weight: bold
          - font-size: 14px
          - justify-self: end
      extra_styles: |
        @keyframes blink {
          50% { opacity: 0.5; }
        }
  - type: custom:button-card
    entity: sensor.maison_lightning_counter
    triggers_update:
      - sensor.timer_foudre
      - sensor.maison_lightning_distance
    name: |
      [[[
        const distRaw = states['sensor.maison_lightning_distance'] ? parseFloat(states['sensor.maison_lightning_distance'].state) : 0;
        const localisation = states['sensor.maison_lightning_localisation'];
        const azimuth = states['sensor.maison_lightning_azimuth'] ? parseFloat(states['sensor.maison_lightning_azimuth'].state) : null;
        const impactCount = parseInt(entity.state) || 0;
        const timePhrase = states['sensor.timer_foudre'] ? states['sensor.timer_foudre'].state : '';

        let message = '';
        
        if (distRaw > 0) {
          const distance = distRaw.toFixed(1);
          message = `Impact à <strong>${distance} Km</strong>`;
          
          let city = null;
          if (localisation && localisation.attributes && localisation.attributes.features) {
            const features = localisation.attributes.features;
            if (features[0]?.properties?.geocoding?.city) {
              city = features[0].properties.geocoding.city;
              message += ` à ${city}`;
            }
          }

          if (!city && azimuth !== null) {
            const directions = [
              "au nord", "au nord-nord-est", "au nord-est", "à l'est-nord-est", 
              "à l'est", "à l'est-sud-est", "au sud-est", "au sud-sud-est", 
              "au sud", "au sud-sud-ouest", "au sud-ouest", "à l'ouest-sud-ouest", 
              "à l'ouest", "à l'ouest-nord-ouest", "au nord-ouest", "au nord-nord-ouest"
            ];
            const index = Math.round(azimuth / 22.5) % 16;
            message += ` ${directions[index]}`;
          }
        } else {
          message = "Aucun impact récent détecté";
        }

        const impactLine = impactCount > 0 
          ? `<br><span style="color: #ffeb3b; font-weight: bold; font-size: 17px;">⚡ ${impactCount} impact(s) détecté(s)</span>` 
          : '';

        return `
          <div style="line-height: 1.6;">
            <span style="font-size: 14px;">${message}</span><br>
            <span style="font-size: 13px; opacity: 0.9; font-weight: 500;">${timePhrase}</span>
            ${impactLine}
          </div>
        `;
      ]]]
    show_state: false
    styles:
      card:
        - border-radius: 12px
        - padding: 15px
        - border-style: solid
        - border-width: 2px
        - background: |
            [[[
              const d = parseFloat(states['sensor.maison_lightning_distance']?.state);
              if (d > 0 && d <= 5) return 'rgba(255, 0, 0, 0.2)';
              if (d > 5) return 'rgba(255, 123, 0, 0.1)';
              return 'rgba(0, 255, 0, 0.05)';
            ]]]
        - border-color: |
            [[[
              const d = parseFloat(states['sensor.maison_lightning_distance']?.state);
              if (d > 0 && d <= 5) return 'red';
              if (d > 5) return 'rgba(255, 123, 0, 0.5)';
              return 'rgba(0, 255, 0, 0.4)';
            ]]]
        - animation: |
            [[[
              const d = parseFloat(states['sensor.maison_lightning_distance']?.state);
              return (d > 0 && d <= 5) ? 'blink-danger 1s ease infinite' : 'none';
            ]]]
      name:
        - justify-self: center
        - text-align: center
        - color: white
      icon:
        - width: 45px
        - color: |
            [[[
              const d = parseFloat(states['sensor.maison_lightning_distance']?.state);
              if (d > 0 && d <= 5) return 'red';
              if (d > 5) return 'rgb(255, 123, 0)';
              return 'rgb(0, 255, 0)';
            ]]]
    extra_styles: |
      @keyframes blink-danger {
        50% { background: rgba(255, 0, 0, 0.6); border-color: white; }
      }
    tap_action:
      action: navigate
      navigation_path: meteo/#foudre
    grid_options:
      columns: 12
      rows: 2.5
    visibility:
      - condition: numeric_state
        entity: sensor.maison_lightning_counter
        above: 1
  - type: custom:mushroom-entity-card
    entity: sensor.prise_lave_linge_nous_power
    name: Lave Linge
    icon: mdi:washing-machine
    primary_info: name
    secondary_info: state
    tap_action:
      action: more-info
    icon_color: light-grey
    fill_container: false
    grid_options:
      columns: 12
      rows: 2
    visibility:
      - condition: numeric_state
        above: 2
        entity: sensor.prise_lave_linge_nous_power
    card_mod:
      style:
        .: |
          ha-card {
            /* ======================== */
            /* USER CONFIGURATION       */
            /* ======================== */
            
            /* 1. ENTITIES */
            {% set ent_progress  = 'sensor.lave_linge_etat' %}
            {% set ent_timerem = 'sensor.lave_linge_temps_restant' %}
            {% set max_time = 120 %}
            {% set ent_power   = 'sensor.prise_lave_linge_nous_power' %}

            /* OPTIONAL Progress Percentage Sensor (if exists) */
            {% set ent_percent   = 'sensor.lave_linge_progres' %}

            /* 2. SIZES (Px) */
            --config-icon-size:       65px;
            --config-font-primary:    15px;
            --config-font-secondary:  12px;
            --config-font-badge:      12px;
            /* ======================== */

            /* --- SENSORS & TIME --- */
            {% set status = states(ent_progress) %}
            {% set status_clean = status | replace('-', ' ') | title %}

            /* --- DETECT TIME REMAINING FORAMT --- */
            {% set raw_val = states(ent_timerem) | string %}

            /* Check if Timestamp */
            {% if '-' in raw_val and ':' in raw_val %}
              {% set end_ts = raw_val | as_datetime %}
              {% if end_ts %}
                 {% set time_rem = ((end_ts - now()).total_seconds() / 60) | int %}
              {% else %}
                 {% set time_rem = 0 %}
              {% endif %}
            
            /* Check if (00:00 or 0:00:00) */
            {% elif ':' in raw_val %}
              {% set parts = raw_val.split(':') %}
              {% if parts | length == 3 %}
                 /* Format H:M:S -> Convert to minutes */
                 {% set time_rem = (parts[0]|int * 60) + (parts[1]|int) + (parts[2]|int / 60) %}
              {% elif parts | length == 2 %}
                 /* Format H:M -> Convert to minutes */
                 {% set time_rem = (parts[0]|int * 60) + (parts[1]|int) %}
              {% else %}
                 {% set time_rem = 0 %}
              {% endif %}

            /* Default to Minutes */
            {% else %}
              {% set time_rem = raw_val | float(0) | int %}
            {% endif %}

            /* Prevent negative numbers */
            {% set time_rem = time_rem | int %}
            {% if time_rem < 0 %} 
              {% set time_rem = 0 %} 
            {% endif %}

            {% set raw_percent = states(ent_percent) | float(-1) %}

            /* --- POWER CALCULATION --- */
            {% set raw_power = states(ent_power) %}
            {% if is_number(raw_power) %}
                {% set power_w = raw_power | float(0) | round %}
                {% set power_text = ' • ' ~ power_w ~ 'W' %}
            {% else %}
                {% set power_text = '' %}
            {% endif %}
            
            /* Format Time (min -> Xh Ym) */
            {% set hours = (time_rem / 60) | int %}
            {% set mins = time_rem % 60 %}
            {% set time_formatted = '%dh %02dm' | format(hours, mins) %}

            /* --- PROGRESS CALCULATION --- */
            
            {% if status | lower in ['idle', 'off', 'standby', 'unknown', 'unavailable'] %}
               {% set progress = 0 %}
               {% set badge_text = status_clean ~ power_text %}
            {% else %}
               
               /* LOGIC: Use Sensor if available, otherwise Calculate */
               {% if raw_percent >= 0 %}
                  /* Use the sensor provided percentage */
                  {% set progress = raw_percent | int %}
               {% else %}
                  /* Fallback: Calculate based on max_time */
                  {% set max_cycle_time = max_time %}
                  {% set calc_prog = ((max_cycle_time - time_rem) / max_cycle_time * 100) | int %}
                  {% set progress = [5, [calc_prog, 100] | min] | max %}
               {% endif %}

               {% set badge_text = status_clean ~ ' • ' ~ time_formatted ~ power_text %}
            {% endif %}

            /* --- STATE DEFINITIONS --- */
            {% set s_lower = status | lower %}
            {% set is_running  = s_lower in ['starting', 'running', 'ending', 'rinse', 'clean', 'paused', 'user_paused', 'anti_wrinkle', 'delay_wait'] %}
            {% set is_spinning = s_lower in ['spin', 'spinning'] %}
            {% set is_drying   = s_lower in ['dry', 'drying'] %}
            {% set is_done     = s_lower in ['finished', 'complete', 'end'] %}

            /* --- ASSIGN ANIMATIONS --- */
            {% if is_drying %}
              {% set color = '255, 152, 0' %}   /* Orange */
              {% set anim_type = 'steam-rise 2s ease-in-out infinite' %}
              {% set icon_shake = 'none' %}
              {% set wave_anim = 'wave 4s linear infinite' %}
              {% set overlay_img = 'linear-gradient(0deg, transparent, rgba(255,255,255,0.5), transparent)' %}
            
            {% elif is_spinning %}
              {% set color = '0, 255, 255' %}   /* cyan */
              {% set anim_type = 'none' %}
              {% set icon_shake = 'washer-spin-smooth 0.8s linear infinite' %}
              {% set wave_anim = 'wave 2s linear infinite' %}          /* Fast Wave */
              {% set overlay_img = 'radial-gradient(circle, rgba(255,255,255,0.3) 10%, transparent 60%)' %}

            {% elif is_done %}
              {% set color = '76, 175, 80' %}   /* Green */
              {% set anim_type = 'sparkle 2s infinite' %}
              {% set icon_shake = 'none' %}
              {% set wave_anim = 'wave 4s linear infinite' %}
              {% set overlay_img = 'radial-gradient(circle, rgba(255,255,255,0.8) 10%, transparent 60%)' %}

            {% elif is_running %}
              {% set color = '33, 150, 243' %}   /* Blue */
              {% set anim_type = 'bubbles 1s linear infinite' %}
              {% set icon_shake = 'shake 1.5s ease-in-out infinite' %} /* Slow Shake */
              {% set wave_anim = 'wave 4s linear infinite' %}
              {% set overlay_img = 'radial-gradient(2px 2px at 20% 80%, white, transparent), radial-gradient(2px 2px at 50% 70%, white, transparent)' %}
            
            {% else %}
              {% set color = '158, 158, 158' %}  /* Grey */
              {% set anim_type = 'none' %}
              {% set icon_shake = 'none' %}
              {% set wave_anim = 'none' %}
              {% set overlay_img = 'none' %}
            {% endif %}

            /* --- OUTPUT VARIABLES --- */
            --wm-color: {{ color }};
            --wm-level: {{ progress }}%;
            --wm-anim-overlay: {{ anim_type }};
            --wm-anim-shake: {{ icon_shake }};
            --wm-anim-wave: {{ wave_anim }};
            --wm-overlay-bg: {{ overlay_img }};
            --wm-badge-content: "{{ badge_text }}";
            
            transition: all 0.5s ease;
            overflow: hidden;
          }

          /* BADGE */
          ha-card::before {
            content: var(--wm-badge-content);
            position: absolute;
            top: 10px; right: 10px;
            background: rgba(var(--wm-color), 0.15);
            color: rgb(var(--wm-color));
            border: 1px solid rgba(var(--wm-color), 0.3);
            padding: 2px 10px;
            border-radius: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-size: var(--config-font-badge);
          }

          /* BAR */
          ha-card::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0;
            height: 4px;
            width: var(--wm-level);
            background: rgb(var(--wm-color));
            box-shadow: 0 0 10px rgb(var(--wm-color));
            transition: width 0.5s ease;
          }
          ha-card {
            --ha-card-background: none;
            --ha-card-box-shadow: none;
            --ha-card-border-width: 0;
            background: none !important;
            box-shadow: none !important;
            border: none !important;
            backdrop-filter: none !important;
            clip-path: inset(0 0 0 0 round var(--ha-card-border-radius, 12px));
          }
        mushroom-shape-icon$: |
          .shape {
            --icon-size: var(--config-icon-size) !important;
            background: rgba(255, 255, 255, 0.05) !important;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255,255,255,0.1);
            
            /* Apply the animation determined by the Logic below */
            animation: var(--wm-anim-shake) !important;
            transform-origin: center center; 
          }

          /* Wave Layer */
          .shape::before {
            content: '';
            position: absolute;
            left: -50%;
            width: 200%; height: 200%;
            top: calc(100% - var(--wm-level));
            background: rgba(var(--wm-color), 0.6);
            border-radius: 40%;
            animation: var(--wm-anim-wave);
          }

          /* Overlay Layer (Bubbles/Steam) */
          .shape::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: var(--wm-overlay-bg);
            background-size: 100% 100%;
            animation: var(--wm-anim-overlay);
            z-index: 2;
          }

          /* The Icon Itself */
          ha-icon {
            z-index: 3;
            mix-blend-mode: overlay;
            color: white !important;
          }

          /* --- KEYFRAMES --- */
          @keyframes wave {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
          }
          @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(5deg) translateY(-1px); }
            75% { transform: rotate(-5deg) translateY(1px); }
          }
          @keyframes bubbles {
            0% { transform: translateY(10px); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-20px); opacity: 0; }
          }
          @keyframes steam-rise {
            0% { opacity: 0; transform: translateY(5px); }
            50% { opacity: 0.8; }
            100% { opacity: 0; transform: translateY(-10px); }
          }
          @keyframes sparkle {
            0%, 100% { opacity: 0.3; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.1); }
          }

          @keyframes washer-spin-smooth {
            0% {
              transform: rotate(0deg) translate(0,0);
              box-shadow: inset 0 0 0 2px rgba(var(--wm-color), 0.7);
            }
            25% { transform: rotate(90deg) translate(0.5px, 0.5px); }
            50% { transform: rotate(180deg) translate(0,0); }
            75% { transform: rotate(270deg) translate(-0.5px, -0.5px); }
            100% {
              transform: rotate(360deg) translate(0,0);
              box-shadow: inset 0 0 0 2px rgba(var(--wm-color), 0.7);
            }
          }
        mushroom-state-info$: |-
          .container .primary {
            font-size: var(--config-font-primary) !important;
          }
          .container .secondary {
            font-size: var(--config-font-secondary) !important;
          }
  - type: custom:mushroom-entity-card
    entity: sensor.prise_lave_vaisselle_nous_power
    name: Lave Vaisselle
    icon: mdi:dishwasher
    primary_info: name
    secondary_info: state
    tap_action:
      action: more-info
    icon_color: light-grey
    fill_container: false
    grid_options:
      rows: 2
      columns: 12
    card_mod:
      style:
        .: |
          ha-card {
            /* ======================== */
            /* USER CONFIGURATION       */
            /* ======================== */
            
            /* 1. ENTITIES */
            {% set ent_progress  = 'sensor.lave_vaisselle_etat' %}
            {% set ent_timerem   = 'sensor.lave_vaisselle_temps_restant' %}
            {% set max_time = 120 %}
            {% set ent_power     = 'sensor.prise_lave_vaisselle_nous_power' %} 
            
            /* OPTIONAL Progress Percentage Sensor (if exists) */
            {% set ent_percent   = 'sensor.lave_vaisselle_progres' %}

            /* 2. SIZES (Px) */
            --config-icon-size:       65px;
            --config-font-primary:    15px;
            --config-font-secondary:  12px;
            --config-font-badge:      12px;
            /* ======================== */

            /* --- SENSORS & TIME --- */
            {% set status = states(ent_progress) %}
            {% set status_clean = status | replace('-', ' ') | title %}

            /* --- DETECT TIME REMAINING FORAMT --- */
            {% set raw_val = states(ent_timerem) | string %}

            /* Check if Timestamp */
            {% if '-' in raw_val and ':' in raw_val %}
              {% set end_ts = raw_val | as_datetime %}
              {% if end_ts %}
                 {% set time_rem = ((end_ts - now()).total_seconds() / 60) | int %}
              {% else %}
                 {% set time_rem = 0 %}
              {% endif %}
            
            /* Check if (00:00 or 0:00:00) */
            {% elif ':' in raw_val %}
              {% set parts = raw_val.split(':') %}
              {% if parts | length == 3 %}
                 /* Format H:M:S -> Convert to minutes */
                 {% set time_rem = (parts[0]|int * 60) + (parts[1]|int) + (parts[2]|int / 60) %}
              {% elif parts | length == 2 %}
                 /* Format H:M -> Convert to minutes */
                 {% set time_rem = (parts[0]|int * 60) + (parts[1]|int) %}
              {% else %}
                 {% set time_rem = 0 %}
              {% endif %}

            /* Default to Minutes */
            {% else %}
              {% set time_rem = raw_val | float(0) | int %}
            {% endif %}

            /* Prevent negative */
            {% set time_rem = time_rem | int %}
            {% if time_rem < 0 %} 
              {% set time_rem = 0 %} 
            {% endif %}

            {% set raw_percent = states(ent_percent) | float(-1) %}
            
            /* --- POWER CALCULATION --- */
            {% set raw_power = states(ent_power) %}
            {% if is_number(raw_power) %}
                {% set power_w = raw_power | float(0) | round %}
                {% set power_text = ' • ' ~ power_w ~ 'W' %}
            {% else %}
                {% set power_text = '' %}
            {% endif %}

            /* Format Time (min -> Xh Ym) */
            {% set hours = (time_rem / 60) | int %}
            {% set mins = time_rem % 60 %}
            {% set time_formatted = '%dh %02dm' | format(hours, mins) %}

            /* --- PROGRESS CALCULATION --- */
            {% if status | lower in ['idle', 'off', 'standby', 'unknown', 'unavailable'] %}
               {% set progress = 0 %}
               {% set badge_text = status_clean ~ power_text %}
            {% else %}
               
               /* LOGIC: Use Sensor if available, otherwise Calculate */
               {% if raw_percent >= 0 %}
                  /* Use the sensor provided percentage */
                  {% set progress = raw_percent | int %}
               {% else %}
                  /* Fallback: Calculate based on max_time */
                  {% set max_cycle_time = max_time %}
                  {% set calc_prog = ((max_cycle_time - time_rem) / max_cycle_time * 100) | int %}
                  {% set progress = [5, [calc_prog, 100] | min] | max %}
               {% endif %}

               /* Show Status + Time + Power */
               {% set badge_text = status_clean ~ ' • ' ~ time_formatted ~ power_text %}
            {% endif %}

            /* --- STATE DEFINITIONS --- */
            {% set s_lower = status | lower %}
            {% set is_running = s_lower in ['starting', 'running', 'ending', 'rinse', 'clean', 'paused', 'user_paused', 'anti_wrinkle', 'delay_wait'] %}
            {% set is_drying  = s_lower in ['dry', 'drying'] %}
            {% set is_done    = s_lower in ['finished', 'complete', 'end'] %}

            /* --- ASSIGN ANIMATIONS --- */
            {% if is_drying %}
              {% set color = '255, 152, 0' %}  /* Orange */
              {% set anim_type = 'steam-rise 2s ease-in-out infinite' %}
              {% set icon_shake = 'none' %}
              {% set wave_anim = 'wave 4s linear infinite' %}
              {% set overlay_img = 'linear-gradient(0deg, transparent, rgba(255,255,255,0.5), transparent)' %}
            {% elif is_done %}
              {% set color = '76, 175, 80' %}   /* Green */
              {% set anim_type = 'sparkle 2s infinite' %}
              {% set icon_shake = 'none' %}
              {% set wave_anim = 'wave 4s linear infinite' %}
              {% set overlay_img = 'radial-gradient(circle, rgba(255,255,255,0.8) 10%, transparent 60%)' %}
            {% elif is_running %}
              {% set color = '33, 150, 243' %}  /* Blue */
              {% set anim_type = 'bubbles 1s linear infinite' %}
              {% set icon_shake = 'shake 0.8s ease-in-out infinite' %}
              {% set wave_anim = 'wave 4s linear infinite' %}
              {% set overlay_img = 'radial-gradient(2px 2px at 20% 80%, white, transparent), radial-gradient(2px 2px at 50% 70%, white, transparent)' %}
            {% else %}
              {% set color = '158, 158, 158' %}  /* Grey */
              {% set anim_type = 'none' %}
              {% set icon_shake = 'none' %}
              {% set wave_anim = 'none' %}
              {% set overlay_img = 'none' %}
            {% endif %}

            /* --- OUTPUT VARIABLES --- */
            --dw-color: {{ color }};
            --dw-level: {{ progress }}%;
            --dw-anim-overlay: {{ anim_type }};
            --dw-anim-shake: {{ icon_shake }};
            --dw-anim-wave: {{ wave_anim }};
            --dw-overlay-bg: {{ overlay_img }};
            --dw-badge-content: "{{ badge_text }}";
            
            transition: all 0.5s ease;
            overflow: hidden;
          }

          /* BADGE */
          ha-card::before {
            content: var(--dw-badge-content);
            position: absolute;
            top: 10px; right: 10px;
            background: rgba(var(--dw-color), 0.15);
            color: rgb(var(--dw-color));
            border: 1px solid rgba(var(--dw-color), 0.3);
            padding: 2px 10px;
            border-radius: 12px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
            font-size: var(--config-font-badge);
          }

          /* BAR */
          ha-card::after {
            content: '';
            position: absolute;
            bottom: 0; left: 0;
            height: 4px;
            width: var(--dw-level);
            background: rgb(var(--dw-color));
            box-shadow: 0 0 10px rgb(var(--dw-color));
            transition: width 0.5s ease;
          }
          ha-card {
            --ha-card-background: none;
            --ha-card-box-shadow: none;
            --ha-card-border-width: 0;
            background: none !important;
            box-shadow: none !important;
            border: none !important;
            backdrop-filter: none !important;
            clip-path: inset(0 0 0 0 round var(--ha-card-border-radius, 12px));
          }
        mushroom-shape-icon$: |
          .shape {
            --icon-size: var(--config-icon-size) !important;
            background: rgba(255, 255, 255, 0.05) !important;
            overflow: hidden;
            position: relative;
            border: 1px solid rgba(255,255,255,0.1);
            
            /* Apply the animation determined by the Logic below */
            animation: var(--dw-anim-shake) !important;
            transform-origin: 50% 60%; 
          }

          /* Wave Layer */
          .shape::before {
            content: '';
            position: absolute;
            left: -50%;
            width: 200%; height: 200%;
            top: calc(100% - var(--dw-level));
            background: rgba(var(--dw-color), 0.6);
            border-radius: 40%;
            animation: var(--dw-anim-wave);
          }

          /* Overlay Layer (Bubbles/Steam) */
          .shape::after {
            content: '';
            position: absolute;
            inset: 0;
            background-image: var(--dw-overlay-bg);
            background-size: 100% 100%;
            animation: var(--dw-anim-overlay);
            z-index: 2;
          }

          /* The Icon Itself */
          ha-icon {
            z-index: 3;
            mix-blend-mode: overlay;
            color: white !important;
          }

          /* --- KEYFRAMES --- */
          @keyframes wave {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
          }
          @keyframes shake {
            0%, 100% { transform: rotate(0deg); }
            25% { transform: rotate(5deg) translateY(-1px); }
            75% { transform: rotate(-5deg) translateY(1px); }
          }
          @keyframes bubbles {
            0% { transform: translateY(10px); opacity: 0; }
            50% { opacity: 1; }
            100% { transform: translateY(-20px); opacity: 0; }
          }
          @keyframes steam-rise {
            0% { opacity: 0; transform: translateY(5px); }
            50% { opacity: 0.8; }
            100% { opacity: 0; transform: translateY(-10px); }
          }
          @keyframes sparkle {
            0%, 100% { opacity: 0.3; transform: scale(0.9); }
            50% { opacity: 1; transform: scale(1.1); }
          }
        mushroom-state-info$: |-
          .container .primary {
            font-size: var(--config-font-primary) !important;
          }
          .container .secondary {
            font-size: var(--config-font-secondary) !important;
          }
    visibility:
      - condition: numeric_state
        above: 2
        entity: sensor.prise_lave_vaisselle_nous_power
  - visibility:
      - condition: or
        conditions:
          - condition: numeric_state
            above: -15
            entity: sensor.tongel_temperature
          - condition: state
            entity: binary_sensor.porte_congel_contact
            state: 'on'
    type: custom:button-card
