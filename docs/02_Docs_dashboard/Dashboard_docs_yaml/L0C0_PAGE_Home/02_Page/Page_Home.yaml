              ];
              return sensors.map((s, i) => {
                const isLast = i === sensors.length - 1;
                return `<span style="display: block; text-align: right; line-height: 1.2; ${isLast ? 'color: lightgreen; font-weight: bold;' : ''}">${safeState(s)}</span>`;
