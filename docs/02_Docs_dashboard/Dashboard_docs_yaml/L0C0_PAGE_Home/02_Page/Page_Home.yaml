              };
              function getColorForStatus(powerStatus, mode) {
                if (powerStatus === 'off') {
                  return mode === 'off' ? colorMap['off_off'] : colorMap['off'];
                } else {
                  return colorMap[`on_${mode}`] || colorMap['off'];
                }
              }
