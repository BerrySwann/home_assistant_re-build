p1_master_gestion_clim:
  alias: 'P1 - MASTER : Gestion centralisée climatisation'
  description: Pilotage des 3 clims jour/nuit selon le paramètre periode. Appelé par P1_A_01 et P1_B_01.
  mode: queued
  max: 10
  fields:
    periode:
      name: Période
      description: jour ou nuit
      required: true
      selector:
        select:
          options:
          - jour
          - nuit
    trigger_id:
      name: Trigger ID
      description: ID du trigger ayant déclenché l'appel (passé par l'automation)
      required: false
      default: ''
      selector:
        text: null
    trigger_entity_id:
      name: Trigger Entity ID
      description: Entity ID du trigger (pour message fenêtre)
      required: false
      default: ''
      selector:
        text: null
  sequence:
    # ------------------------------------------------------------
    # 1. INIT : 1. PREFIX SELON PÉRIODE
    # ------------------------------------------------------------
    - alias: 'INIT : 1. PREFIX SELON PÉRIODE'
      variables:
        prefix: |-
          {{ '[AJ]' if periode == 'jour' else '[AN]' }}

    # ------------------------------------------------------------
    # 2. LOGIQUE : 2. DÉLAI DE SÉCURITÉ AU REDÉMARRAGE
    # ------------------------------------------------------------
    - alias: 'LOGIQUE : 2. DÉLAI DE SÉCURITÉ AU REDÉMARRAGE'
      choose:
      - alias: 'CAS : REDÉMARRAGE SYSTÈME DÉTECTÉ'
        conditions:
        - condition: template
          value_template: |-
            {{ trigger_id == 'ha_restart' }}
        sequence:
        - alias: 'ATTENTE : 1 MINUTE POUR STABILISATION'
          delay: 60

    # ------------------------------------------------------------
    # 3. SÉCURITÉ : 3. BOUCLE D ATTENTE DES CAPTEURS
    # ------------------------------------------------------------
    - alias: 'SÉCURITÉ : 3. BOUCLE D ATTENTE DES CAPTEURS'
      repeat:
        until:
        - alias: 'VÉRIFICATION : TOUS LES CAPTEURS SONT PRÊTS OU LIMITE ATTEINTE'
          condition: or
          conditions:
          - alias: 'ÉTAT : TOUS OK'
            condition: template
            value_template: |-
              {% set base_ok =
                states('sensor.mode_ete_hiver') not in ['unknown', 'unavailable'] and
                states('sensor.groupe') not in ['unknown', 'unavailable'] and
                states('sensor.temperature_eco_hiver_corrige') not in ['unknown', 'unavailable', '0'] and
                states('sensor.temperature_eco_ete_corrige') not in ['unknown', 'unavailable', '0'] and
                states('sensor.temperature_corrige_salon') not in ['unknown', 'unavailable', '0'] and
                states('sensor.temperature_corrige_bureau') not in ['unknown', 'unavailable', '0'] and
                states('sensor.temperature_corrige_chambre') not in ['unknown', 'unavailable', '0']
              %}
              {% if periode == 'jour' %}
                {{ base_ok and
                   states('sensor.temperature_confort_jour') not in ['unknown', 'unavailable', '0']
                }}
              {% else %}
                {{ base_ok and
                   states('sensor.temperature_confort_nuit') not in ['unknown', 'unavailable', '0']
                }}
              {% endif %}
          - alias: 'LIMITE : 10 TENTATIVES (5 MIN)'
            condition: template
            value_template: |-
              {{ repeat.index >= 10 }}
        sequence:
        - alias: 'PAUSE : AVANT NOUVEL ESSAI'
          delay: 30

    # ------------------------------------------------------------
    # 4. DIAGNOSTIC : CAPTEURS ENCORE HS APRES LES 10 ESSAIS
    # ------------------------------------------------------------
    - alias: 'DIAGNOSTIC : CAPTEURS ENCORE HS APRES LES 10 ESSAIS'
      variables:
        mode_saison_brut: |-
          {{ states('sensor.mode_ete_hiver') }}
        mode_ete_ok: |-
          {{ 'true' if states('sensor.mode_ete_hiver') not in ['unknown', 'unavailable'] else 'false' }}
        eco_saison_ok: |-
          {% if mode_ete_ok == 'true' and mode_saison_brut == 'heat' %} {{ 'true' if states('sensor.temperature_eco_hiver_corrige') not in ['unknown', 'unavailable', '0'] else 'false' }}
          {% elif mode_ete_ok == 'true' and mode_saison_brut == 'cool' %} {{ 'true' if states('sensor.temperature_eco_ete_corrige') not in ['unknown', 'unavailable', '0'] else 'false' }}
          {% elif mode_ete_ok == 'true' %} true
          {% else %}false
          {% endif %}
        groupe_ok: |-
          {{ 'true' if states('sensor.groupe') not in ['unknown', 'unavailable'] else 'false' }}
        temps_normales_ok: |-
          {% set base =
            states('sensor.temperature_corrige_salon') not in ['unknown', 'unavailable', '0'] and
            states('sensor.temperature_corrige_bureau') not in ['unknown', 'unavailable', '0'] and
            states('sensor.temperature_corrige_chambre') not in ['unknown', 'unavailable', '0']
          %}
          {% if periode == 'jour' %} {{ 'true' if (base and states('sensor.temperature_confort_jour') not in ['unknown', 'unavailable', '0']) else 'false' }}
          {% else %} {{ 'true' if (base and states('sensor.temperature_confort_nuit') not in ['unknown', 'unavailable', '0']) else 'false' }}
          {% endif %}
        hs_list: |-
          {% set ns = namespace(hs=[]) %}
          {% if mode_ete_ok == 'false' %}{% set ns.hs = ns.hs + ['mode_ete_hiver'] %}
          {% endif %}
          {% if groupe_ok == 'false' %}{% set ns.hs = ns.hs + ['groupe'] %}
          {% endif %}
          {% if states('sensor.temperature_eco_hiver_corrige') in ['unknown', 'unavailable', '0'] %}{% set ns.hs = ns.hs + ['eco_hiver_corrige'] %}
          {% endif %}
          {% if states('sensor.temperature_eco_ete_corrige') in ['unknown', 'unavailable', '0'] %}{% set ns.hs = ns.hs + ['eco_ete_corrige'] %}
          {% endif %}
          {% if states('sensor.temperature_corrige_salon') in ['unknown', 'unavailable', '0'] %}{% set ns.hs = ns.hs + ['corrige_salon'] %}
          {% endif %}
          {% if states('sensor.temperature_corrige_bureau') in ['unknown', 'unavailable', '0'] %}{% set ns.hs = ns.hs + ['corrige_bureau'] %}
          {% endif %}
          {% if states('sensor.temperature_corrige_chambre') in ['unknown', 'unavailable', '0'] %}{% set ns.hs = ns.hs + ['corrige_chambre'] %}
          {% endif %}
          {% if periode == 'jour' and states('sensor.temperature_confort_jour') in ['unknown', 'unavailable', '0'] %}{% set ns.hs = ns.hs + ['temperature_confort_jour'] %}
          {% endif %}
          {% if periode == 'nuit' and states('sensor.temperature_confort_nuit') in ['unknown', 'unavailable', '0'] %}{% set ns.hs = ns.hs + ['temperature_confort_nuit'] %}
          {% endif %} {{ ns.hs | join(', ') }}
        besoin_eco: |-
          {{ 'true' if (groupe_ok == 'false' or temps_normales_ok == 'false' or (groupe_ok == 'true' and states('sensor.groupe') == 'groupe_1')) else 'false' }}
        mode_degrade_eco: |-
          {{ 'true' if (mode_ete_ok == 'true' and eco_saison_ok == 'true' and (groupe_ok == 'false' or temps_normales_ok == 'false')) else 'false' }}
        off_securite: |-
          {{ 'true' if (mode_ete_ok == 'false' or (eco_saison_ok == 'false' and besoin_eco == 'true')) else 'false' }}

    # ------------------------------------------------------------
    # 5. DIAGNOSTIC : APPLICATION SORTIE
    # ------------------------------------------------------------
    - alias: 'DIAGNOSTIC : APPLICATION SORTIE'
      choose:
      - alias: 'SORTIE 1 : OFF - CAPTEUR CRITIQUE HS'
        conditions:
        - condition: template
          value_template: |-
            {{ off_securite == 'true' }}
        sequence:
        - alias: 'NOTIF : ARRÊT SÉCURITÉ CAPTEUR HS'
          action: notify.mobile_app_eric
          data:
            title: |-
              {{ prefix }} SÉCURITÉ CLIM
            message: |-
              Capteur(s) HS : {{ hs_list }}. Arrêt sécurité - les climatiseurs sont coupés (mode éco impossible à calculer).
        - alias: 'ACTION : OFF SÉCURITÉ'
          action: climate.set_hvac_mode
          target:
            entity_id:
            - climate.clim_salon_rm4_mini
            - climate.clim_bureau_rm4_mini
            - climate.clim_chambre_rm4_mini
          data:
            hvac_mode: 'off'
        - alias: 'FIN : ARRÊT APRÈS OFF SÉCURITÉ'
          stop: Arrêt sécurité capteur HS
      - alias: 'SORTIE 2 : MODE DÉGRADÉ ÉCO'
        conditions:
        - condition: template
          value_template: |-
            {{ mode_degrade_eco == 'true' }}
        sequence:
        - alias: 'NOTIF : MODE DÉGRADÉ'
          action: notify.mobile_app_eric
          data:
            title: |-
              {{ prefix }} MODE DÉGRADÉ
            message: |-
              Capteur(s) HS : {{ hs_list }}. Mode dégradé - réglage sur {{ 'eco heat' if mode_saison_brut == 'heat' else 'eco cool' }} ({{ 'température éco hiver' if mode_saison_brut == 'heat' else 'température éco été' }}).

    # ------------------------------------------------------------
    # 6. INIT : CALCUL GLOBAL DES VARIABLES
    # ------------------------------------------------------------
    - alias: 'INIT : CALCUL GLOBAL DES VARIABLES'
      variables:
        mode_saison: |-
          {% set m = states('sensor.mode_ete_hiver') %}
          {% if m in ['heat', 'cool', 'off'] %} {{ m | trim }}
          {% else %} off
          {% endif %}
        groupe_presence: |-
          {{ states('sensor.groupe') | default('groupe_1') }}
        fenetres_ouvertes: |-
          {{ expand('binary_sensor.contact_fenetre_salon_sonoff_contact', 'binary_sensor.contact_fenetre_cuisine_sonoff_contact', 'binary_sensor.contact_fenetre_bureau_sonoff_contact', 'binary_sensor.contact_fenetre_chambre_sonoff_contact') | selectattr('state', 'eq', 'on') | list | count > 0 }}
        temp_eco_hc: |-
          {{ states('sensor.temperature_eco_hiver_corrige') | float(states('sensor.temperature_eco_hiver') | float) }}
        temp_eco_ec: |-
          {{ states('sensor.temperature_eco_ete_corrige') | float(states('sensor.temperature_eco_ete') | float) }}
        temp_cible: |-
          {{ states('sensor.temperature_confort_jour') | float(states('sensor.consigne') | float) }}
        tccj_s: |-
          {{ (states('sensor.temperature_corrige_salon') | float(states('sensor.temperature_confort_jour') | float)) - (states('sensor.correction_temperature_salon') | float(0)) }}
        tccj_b: |-
          {{ (states('sensor.temperature_corrige_bureau') | float(states('sensor.temperature_confort_jour') | float)) - (states('sensor.correction_temperature_bureau') | float(0)) }}
        tccj_c: |-
          {{ (states('sensor.temperature_corrige_chambre') | float(states('sensor.temperature_confort_jour') | float)) - (states('sensor.correction_temperature_chambre') | float(0)) }}
        tccn_s: |-
          {{ (states('sensor.temperature_consigne_nuit_salon') | float(states('sensor.seuil_chauffage') | float(19))) - (states('sensor.correction_temperature_salon') | float(0)) }}
        tccn_b: |-
          {{ (states('sensor.temperature_consigne_nuit_bureau') | float(states('sensor.seuil_chauffage') | float(19))) - (states('sensor.correction_temperature_bureau') | float(0)) }}
        tccn_c: |-
          {{ (states('sensor.temperature_consigne_nuit_chambre') | float(states('sensor.seuil_chauffage') | float(19))) - (states('sensor.correction_temperature_chambre') | float(0)) }}

    # ------------------------------------------------------------
    # 7. INIT : 5. CALCUL DES CIBLES PAR PIÈCE (SELON PÉRIODE)
    # ------------------------------------------------------------
    - alias: 'INIT : 5. CALCUL DES CIBLES PAR PIÈCE (SELON PÉRIODE)'
      variables:
        eco_saison_val: |-
          {% if mode_ete_ok == 'true' and mode_saison_brut == 'heat' %} {{ states('sensor.temperature_eco_hiver_corrige') | float }}
          {% elif mode_ete_ok == 'true' and mode_saison_brut == 'cool' %} {{ states('sensor.temperature_eco_ete_corrige') | float }}
          {% else %}{{ states('sensor.temperature_confort_jour') | float }}
          {% endif %}
        eco_hc_salon: |-
          {{ [temp_eco_hc - (states('sensor.correction_temperature_salon') | float(0)), state_attr('climate.clim_salon_rm4_mini', 'min_temp') | float(0)] | max }}
        eco_hc_bureau: |-
          {{ [temp_eco_hc - (states('sensor.correction_temperature_bureau') | float(0)), state_attr('climate.clim_bureau_rm4_mini', 'min_temp') | float(0)] | max }}
        eco_hc_chambre: |-
          {{ [temp_eco_hc - (states('sensor.correction_temperature_chambre') | float(0)), state_attr('climate.clim_chambre_rm4_mini', 'min_temp') | float(0)] | max }}
        t_salon_target: |-
          {% if mode_degrade_eco == 'true' %} {{ eco_saison_val }}
          {% elif 'groupe_1' in groupe_presence %} {{ eco_hc_salon if mode_saison == 'heat' else temp_eco_ec }}
          {% elif periode == 'jour' and 'groupe_3' in groupe_presence %} {{ (tccj_s - (states('sensor.correction_script_salon') | float(0))) if mode_saison == 'heat' else tccj_s }}
          {% elif periode == 'jour' and ('groupe_2' in groupe_presence or 'groupe_4' in groupe_presence) %} {{ tccj_s }}
          {% elif periode == 'jour' %} {{ temp_eco_hc if mode_saison == 'heat' else temp_eco_ec }}
          {% else %} {{ tccn_s }}
          {% endif %}
        t_bureau_target: |-
          {% if mode_degrade_eco == 'true' %} {{ eco_saison_val }}
          {% elif 'groupe_1' in groupe_presence %} {{ eco_hc_bureau if mode_saison == 'heat' else temp_eco_ec }}
          {% elif periode == 'jour' and 'groupe_3' in groupe_presence %} {{ (tccj_b - (states('sensor.correction_script_bureau') | float(0))) if mode_saison == 'heat' else tccj_b }}
          {% elif periode == 'jour' and ('groupe_2' in groupe_presence or 'groupe_4' in groupe_presence) %} {{ (tccj_b - (states('sensor.correction_script_bureau') | float(0))) if mode_saison == 'heat' else tccj_b }}
          {% elif periode == 'jour' %} {{ temp_eco_hc if mode_saison == 'heat' else temp_eco_ec }}
          {% else %} {{ tccn_b }}
          {% endif %}
        t_chambre_target: |-
          {% if mode_degrade_eco == 'true' %} {{ eco_saison_val }}
          {% elif 'groupe_1' in groupe_presence %} {{ eco_hc_chambre if mode_saison == 'heat' else temp_eco_ec }}
          {% elif periode == 'jour' and 'groupe_3' in groupe_presence %} {{ (tccj_c - (states('sensor.correction_script_chambre') | float(0))) if mode_saison == 'heat' else tccj_c }}
          {% elif periode == 'jour' and ('groupe_2' in groupe_presence or 'groupe_4' in groupe_presence) %} {{ (tccj_c - (states('sensor.correction_script_chambre') | float(0))) if mode_saison == 'heat' else tccj_c }}
          {% elif periode == 'jour' %} {{ temp_eco_hc if mode_saison == 'heat' else temp_eco_ec }}
          {% else %} {{ tccn_c }}
          {% endif %}

    # ------------------------------------------------------------
    # 8. LOGIQUE : SÉCURITÉ FENÊTRES VS GESTION STANDARD
    # ------------------------------------------------------------
    - alias: 'LOGIQUE : SÉCURITÉ FENÊTRES VS GESTION STANDARD'
      choose:
      - alias: 'CAS URGENCE : FENÊTRE OUVERTE DÉTECTÉE'
        conditions:
        - condition: template
          value_template: |-
            {{ fenetres_ouvertes }}
        sequence:
        - alias: 'ACTION : ARRÊT FORCÉ DES UNITÉS CLIM'
          action: climate.set_hvac_mode
          target:
            entity_id:
            - climate.clim_salon_rm4_mini
            - climate.clim_bureau_rm4_mini
            - climate.clim_chambre_rm4_mini
          data:
            hvac_mode: 'off'
        - alias: 'NOTIF : ALERTE CIBLÉE SUR DÉCLENCHEUR'
          action: notify.mobile_app_eric
          data:
            title: |-
              {{ prefix }} CLIM {{ periode | upper }} COUPÉE
            message: |-
              {% if trigger_entity_id == 'binary_sensor.contact_fenetre_salon_sonoff_contact'
                 and is_state('binary_sensor.contact_fenetre_salon_sonoff_contact', 'on') %}
              La fenêtre du Salon a été ouverte.
              {% elif trigger_entity_id == 'binary_sensor.contact_fenetre_cuisine_sonoff_contact'
                 and is_state('binary_sensor.contact_fenetre_cuisine_sonoff_contact', 'on') %}
              La fenêtre de la Cuisine a été ouverte.
              {% elif trigger_entity_id == 'binary_sensor.contact_fenetre_bureau_sonoff_contact'
                 and is_state('binary_sensor.contact_fenetre_bureau_sonoff_contact', 'on') %}
              La fenêtre du Bureau a été ouverte.
              {% elif trigger_entity_id == 'binary_sensor.contact_fenetre_chambre_sonoff_contact'
                 and is_state('binary_sensor.contact_fenetre_chambre_sonoff_contact', 'on') %}
              La fenêtre de la Chambre a été ouverte.
              {% else %} Une fenêtre est ouverte (Mise à jour globale).
              {% endif %}
              {% if states('sensor.nombre_de_fenetres_ouvertes') | int == 4 %} Toutes les fenêtres sont ouvertes.
              {% endif %}
        - alias: 'SÉCURITÉ : ARRÊT IMMÉDIAT POUR ÉVITER DOUBLON'
          stop: Coupure fenêtre effectuée
      default:
      - alias: 'ACTION : ENVOI DES COMMANDES AUX PIÈCES EN PARALLÈLE'
        parallel:
        - alias: LOGIQUE SALON
          choose:
          - alias: 'VÉRIFICATION : SÉCURITÉ SALON (PRISE + ARRET)'
            conditions:
            - condition: state
              entity_id: switch.clim_salon_nous
              state: 'on'
            - condition: state
              entity_id: input_boolean.clim_salon_arret_securise_en_cours
              state: 'off'
            sequence:
            - alias: 'COMMANDE : RÉGLAGE TEMPÉRATURE ET MODE SALON'
              action: climate.set_temperature
              target:
                entity_id: climate.clim_salon_rm4_mini
              data:
                hvac_mode: |-
                  {% if trigger_id == 'sensor_update' and is_state('climate.clim_salon_rm4_mini', 'off') %}
                    off
                  {% else %}
                    {{ mode_saison }}
                  {% endif %}
                temperature: |-
                  {{ t_salon_target }}
        - alias: LOGIQUE BUREAU
          choose:
          - alias: 'VÉRIFICATION : SÉCURITÉ BUREAU (PRISE + ARRET)'
            conditions:
            - condition: state
              entity_id: switch.clim_bureau_nous
              state: 'on'
            - condition: state
              entity_id: input_boolean.clim_bureau_arret_securise_en_cours
              state: 'off'
            sequence:
            - alias: 'COMMANDE : RÉGLAGE TEMPÉRATURE ET MODE BUREAU'
              action: climate.set_temperature
              target:
                entity_id: climate.clim_bureau_rm4_mini
              data:
                hvac_mode: |-
                  {% if trigger_id == 'sensor_update' and is_state('climate.clim_bureau_rm4_mini', 'off') %}
                    off
                  {% else %}
                    {{ mode_saison }}
                  {% endif %}
                temperature: |-
                  {{ t_bureau_target }}
        - alias: LOGIQUE CHAMBRE
          choose:
          - alias: 'VÉRIFICATION : SÉCURITÉ CHAMBRE (PRISE + ARRET)'
            conditions:
            - condition: state
              entity_id: switch.clim_chambre_nous
              state: 'on'
            - condition: state
              entity_id: input_boolean.clim_chambre_arret_securise_en_cours
              state: 'off'
            sequence:
            - alias: 'COMMANDE : RÉGLAGE TEMPÉRATURE ET MODE CHAMBRE'
              action: climate.set_temperature
              target:
                entity_id: climate.clim_chambre_rm4_mini
              data:
                hvac_mode: |-
                  {% if trigger_id == 'sensor_update' and is_state('climate.clim_chambre_rm4_mini', 'off') %}
                    off
                  {% else %}
                    {{ mode_saison }}
                  {% endif %}
                temperature: |-
                  {{ t_chambre_target }}
      - alias: 'PAUSE : SÉCURITÉ RÉCEPTION'
        delay: 2
      - alias: 'NOTIF : RÉSUMÉ DE L''ÉTAT DES CLIMATISATIONS'
        action: notify.mobile_app_eric
        data:
          title: |-
            {{ prefix }} {{ states('sensor.presence') }}
          message: |-
            {%- set prise_salon   = is_state('switch.clim_salon_nous', 'on') -%}
            {%- set prise_bureau  = is_state('switch.clim_bureau_nous', 'on') -%}
            {%- set prise_chambre = is_state('switch.clim_chambre_nous', 'on') -%}
            {%- if not (prise_salon or prise_bureau or prise_chambre) -%}
            [UNITS OFF] Aucune clim alimentee.
            {%- else -%}
            {%- if 'groupe_1' in groupe_presence and mode_saison in ['heat', 'cool'] -%}
                {%- set entete = '[ECO HEAT]' if mode_saison == 'heat' else '[ECO COOL]' -%}
                {%- set t_s = (t_salon_target | float(0)) + (states('sensor.correction_temperature_salon') | float(0)) -%}
                {%- set t_b = (t_bureau_target | float(0)) + (states('sensor.correction_temperature_bureau') | float(0)) -%}
                {%- set t_c = (t_chambre_target | float(0)) + (states('sensor.correction_temperature_chambre') | float(0)) -%}
            {%- else -%}
                {%- set entete = 'Mode : ' ~ (mode_saison | upper) ~ (' (NUIT)' if periode == 'nuit' else '') -%}
                {%- set t_s = (t_salon_target | float(0)) + (states('sensor.correction_temperature_salon') | float(0)) -%}
                {%- set t_b = (t_bureau_target | float(0)) + (states('sensor.correction_temperature_bureau') | float(0)) -%}
                {%- set t_c = (t_chambre_target | float(0)) + (states('sensor.correction_temperature_chambre') | float(0)) -%}
            {%- endif -%}
            {{ entete }}
            Salon  : {{ (t_s | round(1) | string ~ '°') if prise_salon else '[OFF]' }}
            Bureau : {{ (t_b | round(1) | string ~ '°') if prise_bureau else '[OFF]' }}
            Chambre: {{ (t_c | round(1) | string ~ '°') if prise_chambre else '[OFF]' }}
            {%- endif -%}

# annotations_log:
# [2026-11-25] Chambre alignee sur salon et bureau : une seule action climate.set_temperature (hvac_mode + temperature) au lieu de set_hvac_mode puis set_temperature (2 commandes infrarouge SmartIR, la premiere avec l'ancienne consigne). Ordre d'Eric.
