type: vertical-stack
cards:
  - type: markdown
    content: |
      **<<< CALCUL DES CONSIGNES CLIM >>>**
      {% set temp_ext = states('sensor.th_balcon_nord_temperature') | float(-999) %}
      {% set mode = states('sensor.mode_ete_hiver') %}
      {% set consigne = states('sensor.consigne') | float(19) %}
      {% set d1 = states('sensor.delta_1') | float(1) %}
      {% set d2 = states('sensor.delta_2') | float(2) %}
      {% set d5 = states('sensor.delta_5') | float(5) %}
      {% set d7 = states('sensor.delta_7') | float(7) %}
      {% set conf = states('sensor.temperature_confort') | float(0) %}
      {% set conf_j = states('sensor.temperature_confort_jour') | float(0) %}
      {% set conf_n = states('sensor.temperature_confort_nuit') | float(0) %}
      {% set eco_h = states('sensor.temperature_eco_hiver_corrige') | float(0) %}
      {% set eco_e = states('sensor.temperature_eco_ete_corrige') | float(0) %}
      {% set tcs = states('sensor.temperature_corrige_salon') | float(0) %}
      {% set tcb = states('sensor.temperature_corrige_bureau') | float(0) %}
      {% set tcc = states('sensor.temperature_corrige_chambre') | float(0) %}
      {% if temp_ext == -999 %}
      **Température extérieure : sonde indisponible - mode : {{ mode | upper }}**
      {% else %}
      **Température extérieure : {{ temp_ext | round(1) }} °C - mode : {{ mode | upper }}**
      {% endif %}
      {% if temp_ext == -999 %}
      - **Sonde extérieure indisponible**, aucun palier ne peut être calculé.
      {% elif mode == 'cool' %}
      {% if temp_ext >= 34 %}
      - **Palier été fort** : {{ temp_ext | round(1) }} °C - {{ d7 | round(0) | int }} °C - {{ d1 | round(0) | int }} °C = **{{ ((temp_ext - d7) - d1) | round(0) | int }} °C**
      {% elif temp_ext > 32 %}
      - **Palier été chaud** : {{ temp_ext | round(1) }} °C - {{ d5 | round(0) | int }} °C - {{ d1 | round(0) | int }} °C = **{{ ((temp_ext - d5) - d1) | round(0) | int }} °C**
      {% else %}
      - **Palier été** : {{ consigne | round(0) | int }} °C - {{ d1 | round(0) | int }} °C = **{{ (consigne - d1) | round(0) | int }} °C**
      {% endif %}
      {% else %}
      {% if temp_ext < 8 %}
      - **Palier hiver froid** (< 8 °C) : {{ consigne | round(0) | int }} °C + {{ d2 | round(0) | int }} °C + {{ d1 | round(0) | int }} °C = **{{ (consigne + d2 + d1) | round(0) | int }} °C**
      {% elif temp_ext < 12 %}
      - **Palier hiver frais** (< 12 °C) : {{ consigne | round(0) | int }} °C + {{ d1 | round(0) | int }} °C + {{ d1 | round(0) | int }} °C = **{{ (consigne + d1 + d1) | round(0) | int }} °C**
      {% else %}
      - **Palier hiver doux** (>= 12 °C) : {{ consigne | round(0) | int }} °C + {{ d1 | round(0) | int }} °C = **{{ (consigne + d1) | round(0) | int }} °C**
      {% endif %}
      {% endif %}

      **Consignes fixes par défaut selon la saison**

      - Mode été/hiver, capteur de saison : **{{ mode | upper }}**
      {% if mode == 'cool' %} - Consigne active (Été) : **{{ consigne | round(0) | int }} °C**
      - Confort par défaut (Été) : **{{ conf | round(0) | int }} °C**
      - Éco été : **{{ states('sensor.temperature_eco_ete') | float(0) | round(0) | int }} °C**
      {% elif mode == 'heat' %} - Consigne active (Hiver) : **{{ consigne | round(0) | int }} °C**
      - Confort par défaut (Hiver) : **{{ conf | round(0) | int }} °C**
      - Éco hiver : **{{ states('sensor.temperature_eco_hiver') | float(0) | round(0) | int }} °C**
      {% else %} - Consigne active (hors saison) : **{{ consigne | round(0) | int }} °C**
      {% endif %}

      **Consignes calculées**

      - Confort de jour, compensé, 7h30 -> 21h00 : **{{ conf_j | round(0) | int }} °C**
      - Confort de nuit, consigne régulée, 21h00 -> 7h30 : **{{ conf_n | round(0) | int }} °C**

      **Pièces**
      - Salon : **{{ tcs | round(0) | int }} °C** ({{ "%+d" | format((tcs - conf_j) | round(0) | int) }} par rapport au confort jour)
      - Bureau : **{{ tcb | round(0) | int }} °C** ({{ "%+d" | format((tcb - conf_j) | round(0) | int) }} par rapport au confort jour)
      - Chambre : **{{ tcc | round(0) | int }} °C** ({{ "%+d" | format((tcc - conf_j) | round(0) | int) }} par rapport au confort jour)

      **Mode éco, si absents**
      {% if mode == 'cool' %}
      - Éco été corrigé, compensé : **{{ eco_e | round(0) | int }} °C**
      {% else %}
      - Éco hiver corrigé, compensé : **{{ eco_h | round(0) | int }} °C**
      {% endif %}
      {% if mode == 'heat' and temp_ext != -999 and temp_ext < 12 %}
      - L'éco s'applique, l'extérieur est sous 12 °C.
      {% endif %}

      **Delta : {{ states('sensor.temperature_delta_affichage') | default('N/A', true) }}**

      **Groupe : {{ states('sensor.groupe') | default('N/A', true) }} - Présence : {{ states('sensor.presence') | default('N/A', true) }}**
