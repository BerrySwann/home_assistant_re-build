type: sections
max_columns: 1
sections:
- type: grid
  cards:
  - type: heading
    icon: mdi:clouds
    heading: METEO
    heading_style: title
    badges:
    - type: entity
      show_state: true
      show_icon: true
      entity: sensor.th_balcon_nord_temperature
      color: green
    tap_action:
      action: navigate
      navigation_path: /dashboard-tablette/0
    layout_options:
      grid_columns: full
      grid_rows: 1
  - type: custom:bubble-card
    card_type: separator
    name: Appartement
    icon: mdi:home-assistant
    rows: 2
    styles: ".bubble-line {\n  background: var(--primary-text-color);\n  opacity: 1;\n}"
    card_layout: normal
  - type: horizontal-stack
    cards:
    - type: markdown
      content: '<center>Température: <ha-icon icon="mdi:home-thermometer"></ha-icon> {{ states("sensor.th_balcon_nord_temperature")}}°C</center>

        '
      text_only: true
      card_mod:
        style: "ha-card {\n  font-size: 17px;\n  background: none !important;\n  box-shadow: none !important;\n  border: none !important;\n}\n"
    - type: markdown
      content: '<center>Humidité: <ha-icon icon="mdi:water-percent"></ha-icon> {{ states("sensor.th_balcon_nord_humidity") | float(0) | round(0) }}%</center>

        '
      text_only: true
      card_mod:
        style: "ha-card {\n  font-size: 17px;\n  background: none !important;\n  box-shadow: none !important;\n  border: none !important;\n}\n"
