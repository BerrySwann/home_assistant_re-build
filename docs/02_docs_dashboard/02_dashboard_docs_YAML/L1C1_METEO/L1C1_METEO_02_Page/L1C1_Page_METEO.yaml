      top_right:
        double_tap_action:
          action: none
      windrose:
        tap_action:
          action: none
      bottom_right:
        tap_action:
          action: none
      bottom_left:
        tap_action:
          action: none
      speed_bar_1:
        tap_action:
          action: none
      speed_bar_2:
        tap_action:
          action: none
