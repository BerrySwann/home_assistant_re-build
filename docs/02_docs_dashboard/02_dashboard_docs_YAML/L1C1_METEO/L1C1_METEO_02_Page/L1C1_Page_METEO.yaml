      - sensor.maison_lightning_distance
      name: "[[[\n  const distRaw = states['sensor.maison_lightning_distance'] ? parseFloat(states['sensor.maison_lightning_distance'].state) : 0;\n  const localisation = states['sensor.blitzortung_lightning_localisation'];\n\
        \  const azimuth = states['sensor.maison_lightning_azimuth'] ? parseFloat(states['sensor.maison_lightning_azimuth'].state) : null;\n  const impactCount = parseInt(entity.state) || 0;\n  const timePhrase\
        \ = states['sensor.timer_foudre'] ? states['sensor.timer_foudre'].state : '';\n  let message = '';\n\n  if (distRaw > 0) {\n    const distance = distRaw.toFixed(1);\n    message = `Impact à <strong>${distance}\
        \ Km</strong>`;\n\n    let city = null;\n    if (localisation && localisation.attributes && localisation.attributes.features) {\n      const features = localisation.attributes.features;\n      if\
        \ (features[0]?.properties?.geocoding?.city) {\n        city = features[0].properties.geocoding.city;\n        message += ` à ${city}`;\n      }\n    }\n    if (!city && azimuth !== null) {\n  \
        \    const directions = [\n        \"au nord\", \"au nord-nord-est\", \"au nord-est\", \"à l'est-nord-est\",\n        \"à l'est\", \"à l'est-sud-est\", \"au sud-est\", \"au sud-sud-est\",\n    \
        \    \"au sud\", \"au sud-sud-ouest\", \"au sud-ouest\", \"à l'ouest-sud-ouest\",\n        \"à l'ouest\", \"à l'ouest-nord-ouest\", \"au nord-ouest\", \"au nord-nord-ouest\"\n      ];\n      const\
        \ index = Math.round(azimuth / 22.5) % 16;\n      message += ` ${directions[index]}`;\n    }\n  } else {\n    message = \"Aucun impact récent détecté\";\n  }\n  const impactLine = impactCount >\
        \ 0\n    ? `<br><span style=\"color: #ffeb3b; font-weight: bold; font-size: 17px;\">⚡ ${impactCount} impact(s) détecté(s)</span>`\n    : '';\n  return `\n    <div style=\"line-height: 1.6;\">\n\
        \      <span style=\"font-size: 14px;\">${message}</span><br>\n      <span style=\"font-size: 13px; opacity: 0.9; font-weight: 500;\">${timePhrase}</span>\n      ${impactLine}\n    </div>\n  `;\n\
        ]]]\n"
      show_state: false
      styles:
        card:
        - border-radius: 12px
        - padding: 15px
        - border-style: solid
        - border-width: 2px
        - background: "[[[\n  const d = parseFloat(states['sensor.maison_lightning_distance']?.state);\n  if (d > 0 && d <= 5) return 'rgba(255, 0, 0, 0.2)';\n  if (d > 5) return 'rgba(255, 123, 0, 0.1)';\n\
            \  return 'rgba(0, 255, 0, 0.05)';\n]]]\n"
        - border-color: "[[[\n  const d = parseFloat(states['sensor.maison_lightning_distance']?.state);\n  if (d > 0 && d <= 5) return 'red';\n  if (d > 5) return 'rgba(255, 123, 0, 0.5)';\n  return 'rgba(0,\
            \ 255, 0, 0.4)';\n]]]\n"
        - animation: "[[[\n  const d = parseFloat(states['sensor.maison_lightning_distance']?.state);\n  return (d > 0 && d <= 5) ? 'blink-danger 1s ease infinite' : 'none';\n]]]\n"
        name:
