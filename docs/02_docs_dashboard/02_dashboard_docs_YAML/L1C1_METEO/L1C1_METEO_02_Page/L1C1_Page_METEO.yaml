    icon: mdi:compass-rose
    heading: Vitesse du Vent - Baromètre - U.V. - Pluie
    heading_style: title
    badges: []
    tap_action:
      action: none
    layout_options:
      grid_columns: full
      grid_rows: 1
  - type: custom:bubble-card
