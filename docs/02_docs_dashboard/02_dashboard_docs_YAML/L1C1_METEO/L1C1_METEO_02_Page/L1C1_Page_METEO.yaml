          card_mod:
            style: "ha-card {\n  filter: invert(0%);\n  background: none !important;\n  box-shadow: none !important;\n  border: none !important;\n  overflow: hidden;\n  pointer-events: none;\n}\n"
        - type: iframe
          url: https://embed.windy.com/embed2.html?lat=43&lon=7&detailLat=43&detailLon=7&zoom=5&level=surface&overlay=rain&product=ecmwf&menu=&message=&marker=&calendar=24&pressure=&type=map&location=coordinates&detail=&metricWind=km%2Fh&metricTemp=%C2%B0C&radarRange=-1
          aspect_ratio: 99%
          card_mod:
            style: "ha-card {\n  filter: invert(0%);\n  background: none !important;\n  box-shadow: none !important;\n  border: none !important;\n  overflow: hidden;\n  pointer-events: none;\n}\n"
        - type: iframe
          url: https://embed.windy.com/embed2.html?lat=43&lon=7&detailLat=43&detailLon=7&zoom=5&level=surface&overlay=temp&product=ecmwf&menu=&message=&marker=&calendar=24&pressure=&type=map&location=coordinates&detail=&metricWind=km%2Fh&metricTemp=%C2%B0C&radarRange=-1
          aspect_ratio: 99%
          card_mod:
            style: "ha-card {\n  filter: invert(0%);\n  background: none !important;\n  box-shadow: none !important;\n  border: none !important;\n  overflow: hidden;\n  pointer-events: none;\n}\n"
        - type: iframe
          url: https://embed.windy.com/embed2.html?lat=43&lon=7&detailLat=43&detailLon=7&zoom=5&level=surface&overlay=wind&product=ecmwf&menu=&message=&marker=&calendar=24&pressure=&type=map&location=coordinates&detail=&metricWind=km%2Fh&metricTemp=%C2%B0C&radarRange=-1
          aspect_ratio: 99%
          card_mod:
            style: "ha-card {\n  filter: invert(0%);\n  background: none !important;\n  box-shadow: none !important;\n  border: none !important;\n  overflow: hidden;\n  pointer-events: none;\n}\n"
      - type: weather-forecast
        show_current: false
        show_forecast: true
        entity: weather.vence
        forecast_type: daily
        card_mod:
          style: "ha-card {\n  background: none !important;\n  box-shadow: none !important;\n  border: none !important;\n}\n"
      card_mod:
        style: "ha-card {\n  background: none !important;\n  box-shadow: none !important;\n  border: none !important;\n}\n"
