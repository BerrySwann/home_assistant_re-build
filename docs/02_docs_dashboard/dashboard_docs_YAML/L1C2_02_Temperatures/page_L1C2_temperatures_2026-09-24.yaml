              #ADD8E6
            {% else %}
              #00CED1
            {% endif %}
      primary: ''
      secondary: '{{ states(''sensor.th_balcon_nord_humidity'') }}%'
      layout: horizontal
      tap_action:
        action: navigate
        navigation_path: '#hcourbe'
      hold_action:
        action: none
      card_mod:
        style: |
          ha-card {
            background: none !important;
            box-shadow: none !important;
            border: none !important;
          }
          mushroom-state-info$: |
            .primary {
              font-size: 12px !important;
              color: lightgrey !important;
              position: relative;
              bottom: 5px;
              left: 5px;
              overflow: visible !important;
              white-space: normal !important;
            }
            .secondary {
              font-size: 19px !important;
              position: relative;
              overflow: visible !important;
              top: 0px;
              left: 5px;
            }
          mushroom-shape-icon$: |
            .shape {
              position: relative;
              left: 0px;
              top: 0px;
            }
          .: |
            :host {
              --mush-icon-size: 50px;
            }
    - type: custom:mini-graph-card
      entities:
      - entity: sensor.th_balcon_nord_humidity
        name: Humidité
        color: '#00CED1'
      height: 200
      hours_to_show: 24
      decimals: 0
      points_per_hour: 1
      line_width: 2
      font_size: 20
      animate: true
      show:
        labels: true
        name: false
        icon: false
        state: false
        legend: false
        fill: fade
        points: false
      card_mod:
        style: |
          ha-card {
           background: none !important;
            box-shadow: none !important;
            border: none !important;
          }
    card_mod:
      style: |
        ha-card {
          background: none !important;
          box-shadow: none !important;
          border: none !important;
        }
  card_mod:
    style: |
      ha-card {
        background: none !important;
        box-shadow: none !important;
        border: none !important;
        height: 228px;
        margin-left: auto;
        margin-right: auto;
      }
- type: heading
  icon: mdi:lightning-bolt-outline
  heading_style: title
  badges: []
  layout_options:
    grid_columns: full
    grid_rows: 1
  heading: Consomation
- type: custom:mushroom-chips-card
  chips:
  - type: conditional
    conditions:
    - entity: sensor.salon_power_status
      state_not: 'off'
    chip:
      type: template
      icon: mdi:air-conditioner
      icon_color: |-
        {% if is_state('sensor.clim_salon_etat', 'Cool') %} #87CEEB
        {% elif is_state('sensor.clim_salon_etat', 'Heat') %} #ff6100
        {% elif is_state('sensor.clim_salon_etat', 'Fan') %} #40E0D0
        {% else %} #FF0000 {% endif %}
      content: 'Salon: {{ states(''sensor.clim_salon_etat'') }}'
      tap_action:
        action: none
  - type: conditional
    conditions:
    - entity: sensor.cuisine_power_status
      state_not: 'off'
    chip:
      type: template
      icon: mdi:heating-coil
      icon_color: |-
        {% if is_state('sensor.radiateur_cuisine_etat', 'Heat') %} #ff6100
        {% else %} #FF0000 {% endif %}
      content: 'Cuisine: {{ states(''sensor.radiateur_cuisine_etat'') }}'
      tap_action:
        action: none
  - type: conditional
    conditions:
    - entity: sensor.bureau_power_status
      state_not: 'off'
    chip:
      type: template
      icon: mdi:air-conditioner
      icon_color: |-
        {% if is_state('sensor.clim_bureau_etat', 'Cool') %} #87CEEB
        {% elif is_state('sensor.clim_bureau_etat', 'Heat') %} #ff6100
        {% elif is_state('sensor.clim_bureau_etat', 'Fan') %} #40E0D0
        {% else %} #FF0000 {% endif %}
      content: 'Bureau: {{ states(''sensor.clim_bureau_etat'') }}'
      tap_action:
        action: none
  - type: conditional
    conditions:
    - entity: sensor.sdb_soufflant_power_status
      state_not: 'off'
    chip:
      type: template
      icon: mdi:heat-wave
      icon_color: |-
        {% if is_state('sensor.sdb_soufflant_etat', 'Heat') %} #ff6100
        {% else %} #FF0000 {% endif %}
      content: 'SdB Soufflant: {{ states(''sensor.sdb_soufflant_etat'') }}'
      tap_action:
        action: none
  - type: conditional
    conditions:
    - entity: sensor.sdb_seche_serviette_power_status
      state_not: 'off'
    chip:
      type: template
      icon: mdi:heating-coil
      icon_color: |-
        {% if is_state('sensor.sdb_seche_serviette_etat', 'Heat') %} #ff6100
        {% else %} #FF0000 {% endif %}
      content: 'SdB Serviette: {{ states(''sensor.sdb_seche_serviette_etat'') }}'
      tap_action:
        action: none
  - type: conditional
    conditions:
    - entity: sensor.chambre_power_status
      state_not: 'off'
    chip:
      type: template
      icon: mdi:air-conditioner
      icon_color: |-
        {% if is_state('sensor.clim_chambre_etat', 'Cool') %} #87CEEB
        {% elif is_state('sensor.clim_chambre_etat', 'Heat') %} #ff6100
        {% elif is_state('sensor.clim_chambre_etat', 'Fan') %} #40E0D0
        {% else %} #FF0000 {% endif %}
      content: 'Chambre: {{ states(''sensor.clim_chambre_etat'') }}'
      tap_action:
        action: none
  alignment: center
- type: custom:apexcharts-card
  graph_span: 24h
  cache: true
  span:
    start: day
    offset: -0h
  apex_config:
    chart:
      height: 400px
  now:
    show: true
    color: darkred
    label: Now
  header:
    show: true
    title: ' '
