# Page L1C2 - Températures / Humidités
# Navigation: /dashboard-tablette/temperatures
# Sauvegardé: 2026-09-24 - état live (42 cartes : carte Congélateur appliance en fin de page + contact porte, seuils 26/48/235)

type: grid
cards:
- type: heading
  icon: mdi:thermometer
  heading: TEMPERATURE - HUMIDITEES
  heading_style: title
  badges:
  - type: entity
    show_state: true
    show_icon: true
    entity: sensor.th_balcon_nord_battery
    color: state
  tap_action:
    action: navigate
    navigation_path: /dashboard-tablette/0
  layout_options:
    grid_columns: full
    grid_rows: 1
- type: custom:apexcharts-card
  graph_span: 24h
  apex_config:
    chart:
      height: 250px
  header:
    show: true
    title: Extèrieur
    show_states: true
    colorize_states: true
  yaxis:
  - id: humidity
    min: ~30
    max: ~70
    decimals: 0
    apex_config:
      tickAmount: 10
  - id: temperature
    min: ~10
    max: ~32
    opposite: true
    decimals: 1
    apex_config:
      tickAmount: 10
  all_series_config:
    group_by:
      func: last
      duration: 30m
    show:
      legend_value: false
      extremas: true
  series:
  - entity: sensor.th_balcon_nord_humidity
    name: Humi.Bal.Nrd
    yaxis_id: humidity
    type: column
    color: rgb(19,160,255)
  - entity: sensor.vence_temperature
    name: Météo VENCE
    extend_to: now
    fill_raw: last
    yaxis_id: temperature
    stroke_width: 2
    color: orange
  - entity: sensor.th_balcon_nord_temperature
    name: T° Bal.Nrd
    extend_to: now
    fill_raw: last
    yaxis_id: temperature
    stroke_width: 2
    color: green
  card_mod:
    style: |
      ha-card {
        background: none !important;
        box-shadow: none !important;
        border: none !important;
      }
- type: heading
  icon: mdi:water-thermometer-outline
  heading_style: title
  badges:
  - type: entity
    show_state: true
    show_icon: false
    entity: sensor.temperature_delta_affichage
    icon: mdi:delta
    color: primary
    tap_action:
      action: navigate
      navigation_path: '#tendances'
  layout_options:
    grid_columns: full
    grid_rows: 1
  heading: 'Tendances '
  tap_action:
    action: navigate
    navigation_path: '#exterieur'
- type: horizontal-stack
  cards:
  - type: custom:vertical-stack-in-card
    cards:
    - type: custom:mushroom-template-card
      entity: sensor.th_balcon_nord_temperature
      icon: |
        {% if is_state('sensor.th_balcon_nord_temperature_trend', 'increasing') %}
          mdi:arrow-top-right-thick
        {% elif is_state('sensor.th_balcon_nord_temperature_trend', 'decreasing') %}
          mdi:arrow-bottom-right-thick
        {% else %}
          mdi:arrow-right-thick
        {% endif %}
      primary: ''
      secondary: '{{ states(''sensor.th_balcon_nord_temperature'') }}°C'
      tap_action:
        action: navigate
        navigation_path: '#tcourbe'
      hold_action:
        action: none
      color: |
        {% if is_state('sensor.th_balcon_nord_temperature_trend', 'increasing') %}
          red
        {% elif is_state('sensor.th_balcon_nord_temperature_trend', 'decreasing') %}
          blue
        {% else %}
          #df6366
        {% endif %}
      features_position: bottom
      card_mod:
        style: |
          ha-card {
            background-color: transparent !important;
            border: none !important;
          }
          mushroom-state-info$: |
            .primary {
              font-size: 12px !important;
              color: lightgrey !important;
              position: relative;
              bottom: 5px;
              left: 5px;
              overflow: visible !important;
              white-space: normal !important;
            }
            .secondary {
              font-size: 19px !important;
              position: relative;
              overflow: visible !important;
              top: 0px;
              left: 5px;
            }
          mushroom-shape-icon$: |
            .shape {
              position: relative;
              left: 0px;
              top: 0px;
            }
          .: |
            :host {
              --mush-icon-size: 50px;
            }
    - type: custom:mini-graph-card
      entities:
      - entity: sensor.th_balcon_nord_temperature
        name: Température
        color: '#df6366'
      height: 200
      hours_to_show: 24
      decimals: 0
      points_per_hour: 1
      line_width: 2
      font_size: 20
      animate: true
      show:
        labels: true
        name: false
        icon: false
        state: false
        legend: false
        fill: fade
        points: false
      card_mod:
        style: |
          ha-card {
            background: none !important;
            box-shadow: none !important;
            border: none !important;
          }
    card_mod:
      style: |
        ha-card {
          background: none !important;
          box-shadow: none !important;
          border: none !important;
        }
