  all_series_config:
    group_by:
      func: last
      duration: 60m
    show:
      legend_value: false
  series:
  - entity: sensor.temperature_moyenne_interieure
    name: T̄ Appart.
    yaxis_id: temperature
    stroke_width: 4
    fill_raw: last
    color: orange
    show:
      extremas: true
  - entity: sensor.th_balcon_nord_temperature
    name: T° Bal.Nrd
    yaxis_id: temperature
    stroke_width: 4
    fill_raw: last
    color: green
    show:
      extremas: true
  - entity: sensor.conso_clim_rad_total
    name: Conso. Instan.
    yaxis_id: conso_clim
    type: column
    opacity: 0.6
    fill_raw: last
    color: rgb(68,115,158)
    unit: W
    group_by:
      func: max
      duration: 1h
      start_with_last: true
  - entity: sensor.conso_clim_rad_total_quotidien
    name: Conso. Total
    color: rgb(68,115,158)
    unit: kWh
    show:
      in_brush: false
      in_chart: false
  - entity: sensor.clim_rad_total_avg_watts_quotidien
    name: Moy.depuis Minuit
    yaxis_id: conso_clim
    type: line
    stroke_width: 2
    color: red
    unit: W
    show:
      in_brush: false
      in_chart: true
  - entity: sensor.conso_clim_rad_total_mensuel
    name: Mois en cours
    color: '#F44336'
    show:
      in_brush: false
      in_chart: false
  card_mod:
    style: |
      ha-card {
        background: none !important;
        box-shadow: none !important;
        border: none !important;
        font-size: 12px;
      }
