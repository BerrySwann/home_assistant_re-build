          [[[ const h = states['sensor.tongel_humidity']?.state ?? '-'; return `<ha-icon icon="mdi:water" style="width:15px;height:15px;margin-right:5px;"></ha-icon><span style="font-size:12px;font-weight:bold;">${h}%</span>`; ]]]
      card_mod:
        style: |
          ha-card { margin-top: -170px; background: none; border: none; box-shadow: none; }
    - type: custom:apexcharts-card
