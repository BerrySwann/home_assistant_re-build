    cards:
    - type: custom:mushroom-template-card
      entity: sensor.th_balcon_nord_humidity
      icon: |
        {% if is_state('sensor.th_balcon_nord_humidity_trend', 'increasing') %}
          mdi:arrow-top-right-thick
        {% elif is_state('sensor.th_balcon_nord_humidity_trend', 'decreasing') %}
          mdi:arrow-bottom-right-thick
