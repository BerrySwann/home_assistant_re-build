- type: custom:button-card
  entity: climate.clim_salon_rm4_mini
  name: Clim Salon
  show_state: false
  show_label: true
  variables:
    sensor_status: climate.clim_salon_rm4_mini
    sensor_temp: sensor.th_salon_temperature
    round_temp: 1
    sensor_hum: sensor.th_salon_humidity
    round_hum: 0
    temp_color_yellow: 24
    temp_color_orange: 28
    temp_color_red: 32
    state_error: unavailable, unknown
    state_idle: idle, off, standby
    state_auto: auto
    state_heat: heat, heating
    state_cool: cool, cooling
    state_heat_cool: heat_cool
    state_dry: dry, drying, dehumidify
    state_fan: fan, fan_only, ventilation
    sensor_presence: ''
    sensor_power: sensor.clim_salon_nous_power
    sensor_cost: ''
    show_cost: false
    bar_mode: temp
    max_cost: 10
    max_power_w: 1500
  tap_action:
    action: more-info
  label: |
    [[[
      if (!entity || !entity.state) return 'Entity Setup Required';
      let st = entity.state;
      let err = (variables.state_error || 'unavailable, unknown').split(',').map(s => s.trim().toLowerCase());
      if (err.includes(st.toLowerCase())) return 'Check Configuration';
      return st.replace(/_/g, ' ').replace(/-/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
    ]]]
  icon: "[[[\n  if (!entity || !entity.state) return 'mdi:alert-circle-outline';\n  let st = entity.state.toLowerCase();\n  let err = variables.state_error.split(',').map(s => s.trim().toLowerCase());\n  let cool = variables.state_cool.split(',').map(s => s.trim().toLowerCase());\n  let heat = variables.state_heat.split(',').map(s => s.trim().toLowerCase());\n  let dry = variables.state_dry.split(',').map(s => s.trim().toLowerCase());\n  let fan = variables.state_fan.split(',').map(s => s.trim().toLowerCase());\n  let auto = variables.state_auto.split(',').map(s => s.trim().toLowerCase());\n  let hc = variables.state_heat_cool.split(',').map(s => s.trim().toLowerCase());\n  \n  if (err.includes(st)) return 'mdi:alert-circle-outline';\n  if (cool.includes(st)) return 'mdi:snowflake';\n  if (heat.includes(st)) return 'mdi:fire';\n  if (dry.includes(st)) return 'mdi:water-percent';\n  if (fan.includes(st)) return 'mdi:fan';\n  if (auto.includes(st) || hc.includes(st)) return 'mdi:thermostat-auto';\n  return 'mdi:thermostat';\n]]]\n"
  custom_fields:
    badge1: ' '
    badge2: ' '
    t1: ' '
    t2: ' '
    bar: ' '
    presence_dot: ' '
  styles:
    card:
    - height: 95px !important
    - padding: 0px !important
    - overflow: hidden
    - position: relative
    - background: none !important
    - box-shadow: none !important
    - border: none !important
    - backdrop-filter: none !important
    - --ha-card-background: none
    - --ha-card-box-shadow: none
    grid:
    - padding: 12px 16px
    - height: 100%
    - box-sizing: border-box
    - grid-template-areas: '"i n" "i l"'
    - grid-template-columns: 65px 1fr
    - grid-template-rows: auto auto
    - align-content: center
    - gap: 0px 12px
    - position: relative
    - z-index: 2
    icon:
    - width: 45px
    - height: 45px
    - color: rgb(var(--appliance-color))
    - transform-origin: center center
    - animation: var(--appliance-icon-anim) !important
    - z-index: 3
    img_cell:
    - width: 65px
    - height: 65px
    - border-radius: 50%
    - background: rgba(var(--appliance-color), 0.05) !important
    - border: 1px solid rgba(var(--appliance-color), 0.15)
    - position: relative
    - overflow: visible !important
    - justify-self: start
    - z-index: 1
    name:
    - justify-self: start
    - font-size: 15px
    - font-weight: 500
    - align-self: end
    - margin-bottom: 2px
    - position: relative
    - z-index: 2
    label:
    - justify-self: start
    - font-size: 12px
    - opacity: 0.7
    - align-self: start
    - margin-top: 2px
    - position: relative
    - z-index: 2
    custom_fields:
      presence_dot:
      - position: absolute
      - top: 12px
      - left: 12px
      - width: 6px
      - height: 6px
      - border-radius: 50%
      - z-index: 5
      - transition: background-color 0.4s ease
      badge1:
      - position: absolute
      - top: 10px
      - right: 10px
      - padding: 3px 8px
      - font-size: 10px
      - letter-spacing: 0.5px
      - white-space: nowrap
      - text-transform: uppercase
      - font-weight: 700
      - z-index: 5
      - transition: all 0.5s ease
      badge2:
      - position: absolute
      - top: 38px
      - right: 10px
      - padding: 4px 8px
      - font-size: 10px
      - letter-spacing: 0.5px
      - white-space: nowrap
      - color: var(--primary-text-color)
      - opacity: 0.9
      - text-transform: uppercase
      - font-weight: 500
      - z-index: 5
      - transition: all 0.5s ease
      t1:
      - position: absolute
      - bottom: 14px
