          text: Consomation Total Journalière
    card_mod:
      style: |
        ha-card {
          border: none !important;
          box-shadow: none !important;
          background: none !important;
        }
- type: custom:apexcharts-card
  chart_type: donut
  cache: true
  span:
    start: day
  apex_config:
    chart:
      height: 600px
  header:
    show: true
    title: Conso. journalière (Start Day)
    show_states: true
    colorize_states: true
  all_series_config:
    show:
      legend_value: false
      extremas: false
  show:
    loading: true
    last_updated: false
  series:
  - entity: sensor.clim_salon_quotidien_um
    name: SALON (C)
    color: rgb(174,68,90)
    float_precision: 2
  - entity: sensor.radiateur_elec_cuisine_quotidien_um
    name: CUISINE (R)
    color: rgb(168, 136, 181)
    float_precision: 2
  - entity: sensor.clim_bureau_quotidien_um
    name: BUREAU (C)
    color: orange
    float_precision: 2
  - entity: sensor.soufflant_sdb_quotidien_um
    name: Souff. SdB (R)
    color: magenta
    float_precision: 2
  - entity: sensor.seche_serviette_sdb_quotidien_um
    name: Sèche-Serv. SdB (R)
    color: purple
    float_precision: 2
  - entity: sensor.clim_chambre_quotidien_um
    name: CHAMBRE (C)
    color: rgb(30,81,40)
    float_precision: 2
  card_mod:
    style: |
      ha-card {
        background: none !important;
        box-shadow: none !important;
        border: none !important;
        font-size: 11px;
      }
