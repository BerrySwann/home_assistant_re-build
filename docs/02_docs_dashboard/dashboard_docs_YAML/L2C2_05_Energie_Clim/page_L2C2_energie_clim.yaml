- type: heading
  icon: mdi:thermometer-lines
  heading_style: title
  badges: []
  layout_options:
    grid_columns: full
    grid_rows: 1
  heading: Tendances
  tap_action:
    action: none
- type: horizontal-stack
  cards:
  - type: custom:vertical-stack-in-card
    cards:
    - type: custom:mushroom-template-card
      entity: sensor.th_balcon_nord_temperature
      icon: |
        {% if is_state('sensor.th_balcon_nord_temperature_trend', 'increasing') %}
          mdi:arrow-top-right-thick
        {% elif is_state('sensor.th_balcon_nord_temperature_trend', 'decreasing') %}
          mdi:arrow-bottom-right-thick
        {% else %}
          mdi:arrow-right-thick
        {% endif %}
      icon_color: |
        {% if is_state('sensor.th_balcon_nord_temperature_trend', 'increasing') %}
          red
        {% elif is_state('sensor.th_balcon_nord_temperature_trend', 'decreasing') %}
          blue
        {% else %}
          #df6366
        {% endif %}
      primary: ''
      secondary: '{{ states(''sensor.th_balcon_nord_temperature'') }}°C'
      layout: horizontal
      tap_action:
        action: none
      hold_action:
        action: none
      card_mod:
        style: |
          ha-card {
            background-color: transparent !important;
            border: none !important;
          }
          mushroom-state-info$: |
            .primary {
              font-size: 12px !important;
              color: lightgrey !important;
              position: relative;
              bottom: 5px;
              left: 5px;
              overflow: visible !important;
              white-space: normal !important;
            }
            .secondary {
              font-size: 19px !important;
              position: relative;
              overflow: visible !important;
              top: 0px;
              left: 5px;
            }
          mushroom-shape-icon$: |
            .shape {
              position: relative;
              left: 0px;
              top: 0px;
            }
          .: |
            :host {
              --mush-icon-size: 50px;
            }
    - type: custom:mini-graph-card
      entities:
      - entity: sensor.th_balcon_nord_temperature
        name: Température
        color: '#df6366'
      height: 200
      hours_to_show: 24
      decimals: 1
      points_per_hour: 6
      line_width: 2
      font_size: 80
      hour24: true
      animate: true
      show:
        labels: true
        name: false
        icon: false
        state: false
        legend: false
        extrema: true
        fill: fade
        points: false
      card_mod:
        style: |
          ha-card {
            background: none !important;
            box-shadow: none !important;
            border: none !important;
          }
    card_mod:
      style: |
        ha-card {
          background: none !important;
          box-shadow: none !important;
          border: none !important;
        }
  card_mod:
    style: |
      ha-card {
        background: none !important;
        box-shadow: none !important;
        border: none !important;
        height: 228px;
        margin-left: auto;
        margin-right: auto;
      }
- type: custom:apexcharts-card
  graph_span: 24h
  cache: true
  span:
    start: day
    offset: -0h
  apex_config:
    chart:
      height: 400px
  now:
    show: true
    color: darkred
    label: Now
  header:
    show: true
    title: ' '
    show_states: true
    colorize_states: true
  yaxis:
  - id: temperature
    min: ~5
    max: ~32
    decimals: 2
    apex_config:
      tickAmount: 10
  - id: conso_clim
    min: ~150
    max: auto
    opposite: true
    decimals: 2
    apex_config:
      tickAmount: 10
  all_series_config:
    group_by:
      func: last
      duration: 60m
    show:
      legend_value: false
  series:
  - entity: sensor.temperature_moyenne_interieure
    name: T̄ Appart.
    yaxis_id: temperature
    stroke_width: 4
    fill_raw: last
    color: orange
    show:
      extremas: true
  - entity: sensor.th_balcon_nord_temperature
    name: T° Bal.Nrd
    yaxis_id: temperature
    stroke_width: 4
    fill_raw: last
    color: green
    show:
      extremas: true
  - entity: sensor.conso_clim_rad_total
    name: Conso. Instan.
    yaxis_id: conso_clim
    type: column
    opacity: 0.6
    fill_raw: last
    color: rgb(68,115,158)
    unit: W
    group_by:
      func: max
      duration: 1h
      start_with_last: true
  - entity: sensor.conso_clim_rad_total_quotidien
    name: Conso. Total
    color: rgb(68,115,158)
    unit: kWh
    show:
      in_brush: false
      in_chart: false
  - entity: sensor.clim_rad_total_avg_watts_quotidien
    name: Moy.depuis Minuit
    yaxis_id: conso_clim
    type: line
    stroke_width: 2
    color: '#F44336'
    unit: W
    show:
      in_brush: false
      in_chart: true
      extremas: true
  - entity: sensor.conso_clim_rad_total_mensuel
    name: Mois en cours
    color: red
    show:
      in_brush: false
      in_chart: false
  card_mod:
    style: |
      ha-card {
        background: none !important;
        box-shadow: none !important;
        border: none !important;
        font-size: 12px;
      }
