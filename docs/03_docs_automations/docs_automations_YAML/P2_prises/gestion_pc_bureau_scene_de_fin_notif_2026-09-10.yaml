id: '1775245732227'
alias: 'Gestion PC Bureau : Scène de Fin + Notif'
description: 'Éteint la lumière et notifie lorsqu''une veille est détectée sur le
  PC.

  '
triggers:
- id: bouton_mqtt
  trigger: mqtt
  topic: zigbee2mqtt2/Poussoir PC (IKEA TRADFRI)/action
- id: extinction_conso
  trigger: numeric_state
  entity_id: sensor.prise_bureau_pc_ikea_power
  below: 40
  for:
    minutes: 2
actions:
- choose:
  - alias: 'ALLUMAGE : Bouton ON'
    conditions:
    - condition: trigger
      id: bouton_mqtt
    - condition: template
      value_template: '{{ trigger.payload == ''on'' }}'
    sequence:
    - action: light.turn_on
      target:
        entity_id: light.hue_smart_eco_pc_bureau
    - action: notify.mobile_app_eric
      data:
        title: Allumage PC
        message: PC Bureau [ON]
        data:
          icon: mdi:monitor-dashboard
          tag: notif_pc_bureau
  - alias: 'EXTINCTION AMBIANCE : Veille (< 40W)'
    conditions:
    - condition: trigger
      id: extinction_conso
    sequence:
    - wait_template: '{{ states(''sensor.prise_bureau_pc_ikea_power'') | float >
        40 }}'
      timeout: 00:10:00
      continue_on_timeout: true
    - condition: template
      value_template: '{{ not wait.completed }}'
    - action: light.turn_off
      target:
        entity_id: light.hue_smart_eco_pc_bureau
    - action: notify.mobile_app_eric
      data:
        title: Veille détectée
        message: PC Bureau [OFF]
        data:
          icon: mdi:monitor-dashboard
          tag: notif_pc_bureau
mode: single
