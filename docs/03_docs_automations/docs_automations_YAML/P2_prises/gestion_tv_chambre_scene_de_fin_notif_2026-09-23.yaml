id: '1775330762844'
alias: 'Gestion TV Chambre : Scène de Fin + Notif'
description: 'Éteint la prise éco et notifie quand une veille confirmée est détectée
  sur la TV chambre (laisse la prise de mesure allumée). Détection : capteur binaire
  veille_tv_chambre (puissance < 40 W) pendant 12 min + filet de rattrapage toutes
  les 15 min. MAJ 2026-09-23 : seuil 25 -> 40 W (au-dessus de la veille ~20 W, sous
  l''actif ~70 W+), suppression de l''attente annulable.'
triggers:
- id: bouton_mqtt
  topic: zigbee2mqtt2/Poussoir TV (IKEA TRADFRI)/action
  trigger: mqtt
- entity_id: binary_sensor.veille_tv_chambre
  for:
    minutes: 12
  id: veille
  to: 'on'
  trigger: state
- id: rattrapage
  minutes: /15
  trigger: time_pattern
conditions: []
actions:
- choose:
  - alias: 'ALLUMAGE : Bouton ON'
    conditions:
    - condition: trigger
      id: bouton_mqtt
    - condition: template
      value_template: '{{ trigger.payload == ''on'' }}'
    sequence:
    - action: light.turn_on
      target:
        entity_id: light.hue_smart_eco_tv_chambre
    - action: switch.turn_on
      target:
        entity_id: switch.prise_tv_chambre_nous
    - action: notify.mobile_app_eric
      data:
        data:
          icon: mdi:television-off
          tag: notif_tv_chambre
        message: Prise TV [ON]
        title: Allumage TV
  - alias: 'EXTINCTION : veille confirmée (12 min)'
    conditions:
    - condition: trigger
      id:
      - veille
      - rattrapage
    - condition: state
      entity_id: light.hue_smart_eco_tv_chambre
      state: 'on'
    - condition: state
      entity_id: binary_sensor.veille_tv_chambre
      state: 'on'
    - condition: template
      value_template: '{{ (now() - states[''binary_sensor.veille_tv_chambre''].last_changed)
        >= timedelta(minutes=12) }}'
    sequence:
    - action: light.turn_off
      target:
        entity_id: light.hue_smart_eco_tv_chambre
    - action: notify.mobile_app_eric
      data:
        data:
          icon: mdi:television
          tag: notif_tv_chambre
        message: Prise TV [OFF]
        title: Veille détectée
mode: single
