id: '1775330762844'
alias: 'Gestion TV Chambre : Scène de Fin + Notif'
description: 'Éteint les lumières et notifie, mais laisse la prise ON pour le suivi
  conso lorsqu''une veille est détectée.

  '
triggers:
- id: bouton_mqtt
  trigger: mqtt
  topic: zigbee2mqtt2/Poussoir TV (IKEA TRADFRI)/action
- id: extinction_conso
  trigger: numeric_state
  entity_id: sensor.prise_tv_chambre_nous_power
  below: 25
  for:
    minutes: 2
actions:
- choose:
  - alias: 'ALLUMAGE : Bouton ON'
    conditions:
    - condition: trigger
      id: bouton_mqtt
    - condition: template
      value_template: '{{ trigger.payload == ''on'' }}'
    sequence:
    - action: light.turn_on
      target:
        entity_id: light.hue_smart_eco_tv_chambre
    - action: switch.turn_on
      target:
        entity_id: switch.prise_tv_chambre_nous
    - action: notify.mobile_app_eric
      data:
        title: Allumage TV
        message: Prise TV [ON]
        data:
          icon: mdi:television-off
          tag: notif_tv_chambre
  - alias: 'EXTINCTION AMBIANCE : Veille (< 25W)'
    conditions:
    - condition: trigger
      id: extinction_conso
    sequence:
    - wait_template: '{{ states(''sensor.prise_tv_chambre_nous_power'') | float
        > 25 }}'
      timeout: 00:10:00
      continue_on_timeout: true
    - condition: template
      value_template: '{{ not wait.completed }}'
    - action: light.turn_off
      target:
        entity_id: light.hue_smart_eco_tv_chambre
    - action: notify.mobile_app_eric
      data:
        title: Veille détectée
        message: Prise TV [OFF]
        data:
          icon: mdi:television
          tag: notif_tv_chambre
mode: single
