alias: "P2 - ALARME Congélateur : Perte de supervision capteur Tongel"
description: >
  Le capteur de température Tongel ne remonte plus rien (unavailable ou
  unknown) depuis 2h -> perte de supervision, indépendant de l'état réel
  du congélateur (peut aussi être une pile morte ou une perte Zigbee).
triggers:
  - trigger: state
    entity_id: sensor.tongel_temperature
    to: "unavailable"
    for:
      hours: 2
  - trigger: state
    entity_id: sensor.tongel_temperature
    to: "unknown"
    for:
      hours: 2
actions:
  - action: notify.mobile_app_eric
    data:
      title: "Congélateur : capteur muet"
      message: >
        sensor.tongel_temperature ne remonte plus rien depuis au moins 2h.
        Plus de supervision du congélateur (pile ? Zigbee ?).
  - action: notify.mobile_app_mamour
    data:
      title: "Congélateur : capteur muet"
      message: >
        sensor.tongel_temperature ne remonte plus rien depuis au moins 2h.
        Plus de supervision du congélateur (pile ? Zigbee ?).
  - action: persistent_notification.create
    data:
      notification_id: congelateur_alarme_capteur
      title: "Congélateur : capteur muet"
      message: >
        sensor.tongel_temperature unavailable/unknown depuis au moins 2h.
mode: single
