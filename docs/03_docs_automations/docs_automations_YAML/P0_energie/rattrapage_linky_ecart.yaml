id: 'rattrapage_linky_ecart'
alias: "[P0] Rattrapage Linky MANQUANT + Ecart"
description: >
  A 23h59:30, construit un JSON avec day_1 a day_7 (valeur > 0 uniquement, avec date JJ/MM)
  et appelle le script Python correct_linky.py.
  Le script corrige TOUTES les lignes "(MANQUANT)" de linky_histo.txt correspondantes,
  lit nodon_histo.txt pour chaque date corrigee et calcule l'ecart dans ecart_histo.txt.
  Si aucune ligne MANQUANT dans le fichier, le script ne fait rien.
  Prerequis : shell_command.correct_linky_log configure dans HA (P0_correct_linky.yaml)
  et script /config/.scripts/correct_linky.py present sur le serveur HA.
triggers:
  - trigger: time
    at: '23:59:30'
conditions: []
actions:
  - variables:
      dw: >
        {{ state_attr('sensor.linky_25481620821301_consumption', 'dailyweek') }}
  - variables:
      data_json: >
        {% set data = [] %}
        {% for i in range(1, 8) %}
          {% if dw is not none and i <= dw | length %}
            {% set day_val = state_attr('sensor.linky_25481620821301_consumption', 'day_' ~ i) | float(0) %}
            {% if day_val > 0 %}
              {% set parts = dw[i-1].split('-') %}
              {% set _ = data.append({'date': parts[2] ~ '/' ~ parts[1], 'val': day_val}) %}
            {% endif %}
          {% endif %}
        {% endfor %}
        {{ data | to_json }}
  - action: shell_command.correct_linky_log
    data:
      data_json: "{{ data_json }}"
mode: single
