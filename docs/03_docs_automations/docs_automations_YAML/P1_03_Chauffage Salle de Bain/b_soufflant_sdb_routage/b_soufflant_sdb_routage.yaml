id: '1790623332289'
alias: B - SDB - SOUFFLANT - ROUTAGE (interrupteur vers sequences)
description: 'Entree unique du soufflant de la salle de bain : l''interrupteur virtuel
  (bouton du tableau de bord) declenche le demarrage ou l''arret. Le verrou de deux
  minutes est tenu par les scripts. Aucun automatisme de temperature.'
triggers:
- alias: Interrupteur SDB sur ON
  trigger: state
  entity_id: switch.inter_soufflant_salle_de_bain
  to: 'on'
  id: marche
- alias: Interrupteur SDB sur OFF
  trigger: state
  entity_id: switch.inter_soufflant_salle_de_bain
  to: 'off'
  id: arret
conditions: []
actions:
- choose:
  - conditions:
    - condition: trigger
      id: marche
    sequence:
    - action: script.turn_on
      target:
        entity_id: script.sdb_soufflant_demarrer
  - conditions:
    - condition: trigger
      id: arret
    sequence:
    - action: script.turn_on
      target:
        entity_id: script.sdb_soufflant_arreter
mode: single
