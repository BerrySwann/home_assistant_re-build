id: '1776969396633'
alias: Log Écart Linky vs Nodon
description: Enregistre l'écart à 23:59 pile
triggers:
- trigger: time
  at: '23:59:00'
conditions: []
actions:
- action: notify.send_message
  target:
    entity_id: notify.log_ecart_energie
  data:
    message: '{% set l   = states(''sensor.linky_25481620821301_consumption_history'')
      | float(0) %} {% set um  = state_attr(''sensor.genelec_appart_quotidien_um'',
      ''last_period'') | float(0) %} {% set d   = (l - um) | round(3) %} {% set
      p   = ((d / l * 100) | round(1)) if l > 0 else 0 %} {% set age = ((now().timestamp()
      - as_timestamp(states[''sensor.linky_25481620821301_consumption_history''].last_changed))
      / 3600) | round(1) %} {% set t   = now().strftime(''%d/%m %H:%M'') %} {{t}}
      | Linky: {{l}} kWh (age: {{age}}h) | UM: {{um}} kWh | Ecart: {{d}} ({{p}}%)

      '
