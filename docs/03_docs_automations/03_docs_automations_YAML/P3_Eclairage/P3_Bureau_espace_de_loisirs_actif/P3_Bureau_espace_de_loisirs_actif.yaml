id: '1793131130516'
alias: P3 BUREAU - Espace de loisirs actif, garder les indicateurs allumes
description: Hue Sync demarre seul au boot du PC. Tant que l'espace de loisirs tourne, les lampes eclairent et HA doit les voir allumees.
triggers:
- trigger: state
  entity_id:
  - light.hue_play_1_pc_bureau
  - light.hue_play_2_pc_bureau
  - light.hue_play_3_pc_bureau
  to: 'off'
- trigger: state
  entity_id:
  - light.hue_play_1_pc_bureau
  - light.hue_play_2_pc_bureau
  - light.hue_play_3_pc_bureau
  attribute: mode
  to: streaming
- trigger: state
  entity_id: binary_sensor.moniteur_pc
  to: 'on'
- trigger: homeassistant
  event: start
conditions:
- condition: template
  value_template: "{{ state_attr('light.hue_play_1_pc_bureau','mode') == 'streaming' or state_attr('light.hue_play_2_pc_bureau','mode') == 'streaming' or state_attr('light.hue_play_3_pc_bureau','mode') == 'streaming' }}"
actions:
- action: light.turn_on
  target:
    entity_id:
    - light.hue_play_1_pc_bureau
    - light.hue_play_2_pc_bureau
    - light.hue_play_3_pc_bureau
mode: restart
