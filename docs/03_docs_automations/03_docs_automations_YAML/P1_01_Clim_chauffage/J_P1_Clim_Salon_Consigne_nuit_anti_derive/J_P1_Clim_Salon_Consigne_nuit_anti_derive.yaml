- id: '1794417183983'
  alias: (J) (CLIM) Consigne nuit anti-derive Salon
  description: Passe la consigne de nuit de salon a 18 pendant 10 minutes quand la
    temperature depasse la consigne plus son offset, puis la ramene a 19.
  triggers:
  - trigger: state
    entity_id: sensor.th_salon_temperature
    id: mesure
  - trigger: event
    event_type: timer.finished
    event_data:
      entity_id: timer.clim_consigne_nuit_salon_10mn
    id: fin_timer
  conditions: []
  actions:
  - choose:
    - conditions:
      - condition: trigger
        id: mesure
      - condition: time
        after: '21:00:00'
        before: 07:30:00
      - condition: template
        value_template: "{% set thst = states('sensor.th_salon_temperature') | float(none)
          %} {% set tcns = states('sensor.temperature_consigne_nuit_salon') | float(none)
          %} {% set ons = states('sensor.offset_salon') | float(none) %} {{ thst
          is not none and tcns is not none and ons is not none\n   and (thst | round(1,
          'floor')) > (tcns + ons) }}"
      - condition: template
        value_template: '{{ not is_state(''sensor.groupe'', ''groupe_1'') }}'
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.clim_consigne_nuit_salon
        data:
          value: -1
      - action: timer.start
        target:
          entity_id: timer.clim_consigne_nuit_salon_10mn
    - conditions:
      - condition: trigger
        id: fin_timer
      sequence:
      - action: input_number.set_value
        target:
          entity_id: input_number.clim_consigne_nuit_salon
        data:
          value: 0
  mode: single

# annotations_log:
# [2026-11-22] condition template not groupe_1 ajoutee dans conditions[0] du premier choose : anti-derive inactive en groupe_1, comme M, N et O ; prod mise a jour par API le meme jour
