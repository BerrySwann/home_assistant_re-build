id: '1775244989013'
alias: Gestion Optimisée du Store Salon
description: 'Priorité Sommeil et Anti-Reflet. Sécurité : Bloque tout mouvement
  si la fenêtre est ouverte.'
triggers:
- id: reveil
  trigger: time
  at: '07:00:00'
- trigger: state
  entity_id: sensor.th_balcon_nord_temperature
- trigger: sun
  event: sunset
- id: fenetre
  trigger: state
  entity_id: binary_sensor.contact_fenetre_salon_sonoff_contact
  to: 'off'
conditions:
- alias: 'SÉCURITÉ : La fenêtre doit être FERMÉE pour bouger le store'
  condition: state
  entity_id: binary_sensor.contact_fenetre_salon_sonoff_contact
  state: 'off'
actions:
- choose:
  - alias: 'SCÉNARIO A : Ouverture Travail (Printemps/Automne)'
    conditions:
    - condition: time
      after: '07:00:00'
    - condition: sun
      before: sunset
    - condition: numeric_state
      entity_id: sensor.th_balcon_nord_temperature
      above: 12
      below: 32
    - condition: numeric_state
      entity_id: cover.store_salon
      attribute: current_position
      below: 1
    sequence:
    - action: cover.open_cover
      target:
        entity_id: cover.store_salon
  - alias: 'SCÉNARIO B : Fermeture Chaleur (Été)'
    conditions:
    - condition: numeric_state
      entity_id: sensor.th_balcon_nord_temperature
      above: 32
    - condition: sun
      before: sunset
    sequence:
    - action: cover.close_cover
      target:
        entity_id: cover.store_salon
  - alias: 'SCÉNARIO C : Fermeture Nuit'
    conditions:
    - condition: sun
      after: sunset
    sequence:
    - action: cover.close_cover
      target:
        entity_id: cover.store_salon
mode: single
