id: '1775244989013'
alias: Gestion Simple du Store Salon (Matin/Soir)
description: 'Ouvre le store à partir de 6h30 et le ferme au coucher du soleil. Sécurité : bloque tout mouvement si la fenêtre est ouverte.'
triggers:
- id: reveil
  trigger: time
  at: '06:30:00'
- trigger: sun
  event: sunset
- id: fenetre
  trigger: state
  entity_id: binary_sensor.contact_fenetre_salon_sonoff_contact
  to: 'off'
conditions:
- alias: 'SÉCURITÉ : La fenêtre doit être FERMÉE pour bouger le store'
  condition: state
  entity_id: binary_sensor.contact_fenetre_salon_sonoff_contact
  state: 'off'
actions:
- choose:
  - alias: 'MATIN : Ouverture'
    conditions:
    - condition: time
      after: '06:30:00'
    - condition: sun
      before: sunset
    - condition: numeric_state
      entity_id: cover.store_salon
      attribute: current_position
      below: 1
    sequence:
    - action: cover.open_cover
      target:
        entity_id: cover.store_salon
  - alias: 'SOIR : Fermeture'
    conditions:
    - condition: sun
      after: sunset
    sequence:
    - action: cover.close_cover
      target:
        entity_id: cover.store_salon
mode: single
