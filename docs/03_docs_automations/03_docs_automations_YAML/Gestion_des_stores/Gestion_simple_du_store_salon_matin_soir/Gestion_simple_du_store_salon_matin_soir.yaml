id: '1775244989013'
alias: Gestion Optimisée du Store Salon
description: 'Priorité Sommeil et Anti-Reflet. Groupe 1 (personne) : fermeture
  immédiate, sans aucune autre condition. Groupe 2 ou 4 : ouverture selon lever/coucher
  du soleil et températures. Sécurité : fenêtre ouverte = aucun mouvement (sauf
  groupe 1).'
triggers:
- id: reveil
  trigger: time
  at: '07:00:00'
- id: lever
  trigger: sun
  event: sunrise
- trigger: state
  entity_id: sensor.th_balcon_nord_temperature
- trigger: sun
  event: sunset
- id: fenetre
  trigger: state
  entity_id: binary_sensor.contact_fenetre_salon_sonoff_contact
  to: 'off'
- id: groupe_1
  trigger: state
  entity_id: sensor.groupe
  to: groupe_1
  for: '00:05:00'
- id: groupe_2_4
  trigger: state
  entity_id: sensor.groupe
  to:
  - groupe_2
  - groupe_4
conditions: []
actions:
- choose:
  - alias: 'GROUPE 1 : Personne, fermeture (priorité absolue, aucune autre condition)'
    conditions:
    - condition: state
      entity_id: sensor.groupe
      state: groupe_1
    sequence:
    - action: cover.close_cover
      target:
        entity_id: cover.store_salon
  - alias: 'SCÉNARIO A : Ouverture Travail (Groupe 2 ou 4, Printemps/Automne)'
    conditions:
    - alias: 'SÉCURITÉ : La fenêtre doit être FERMÉE pour bouger le store'
      condition: state
      entity_id: binary_sensor.contact_fenetre_salon_sonoff_contact
      state: 'off'
    - condition: state
      entity_id: sensor.groupe
      state:
      - groupe_2
      - groupe_4
    - condition: time
      after: '07:00:00'
    - condition: sun
      after: sunrise
    - condition: sun
      before: sunset
    - condition: numeric_state
      entity_id: sensor.th_balcon_nord_temperature
      above: 12
      below: 32
    - condition: numeric_state
      entity_id: cover.store_salon
      attribute: current_position
      below: 1
    sequence:
    - action: cover.open_cover
      target:
        entity_id: cover.store_salon
  - alias: 'SCÉNARIO B : Fermeture Chaleur (Été)'
    conditions:
    - alias: 'SÉCURITÉ : La fenêtre doit être FERMÉE pour bouger le store'
      condition: state
      entity_id: binary_sensor.contact_fenetre_salon_sonoff_contact
      state: 'off'
    - condition: numeric_state
      entity_id: sensor.th_balcon_nord_temperature
      above: 32
    - condition: sun
      before: sunset
    sequence:
    - action: cover.close_cover
      target:
        entity_id: cover.store_salon
  - alias: 'SCÉNARIO C : Fermeture Nuit'
    conditions:
    - alias: 'SÉCURITÉ : La fenêtre doit être FERMÉE pour bouger le store'
      condition: state
      entity_id: binary_sensor.contact_fenetre_salon_sonoff_contact
      state: 'off'
    - condition: sun
      after: sunset
    sequence:
    - action: cover.close_cover
      target:
        entity_id: cover.store_salon
mode: single
