# [2026-10-29] L3C3 - at: et after: entre guillemets (HA lisait 06:29:00 en base 60, erreur 23340) ; condition sun.sun du matin remplacee par un template (declencheur sun OU sun.sun above_horizon) ; bak : Gestion_simple_du_store_salon_matin_soir.bak_2026_10_29_07h28m54s.yaml
