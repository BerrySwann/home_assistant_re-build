id: '1775245732227'
alias: 'Gestion PC Bureau : Scène de Fin + Notif'
description: 'Éteint la prise éco des périphériques et notifie quand une veille
  confirmée est détectée sur le PC. Détection : capter binaire veille_pc_bureau
  (puissance < 70 W) pendant 12 min + filet de rattrapage toutes les 15 min si la
  prise est restée allumée. MAJ 2026-09-23 : seuil 40 -> 70 W (au-dessus des pics
  de veille ~45 W, sous la conso active ~100 W), suppression de l''attente annulable
  par micro-pics.'
triggers:
- id: bouton_mqtt
  topic: zigbee2mqtt2/Poussoir PC (IKEA TRADFRI)/action
  trigger: mqtt
- entity_id: binary_sensor.veille_pc_bureau
  for:
    minutes: 12
  id: veille
  to: 'on'
  trigger: state
- id: rattrapage
  minutes: /15
  trigger: time_pattern
conditions: []
actions:
- choose:
  - alias: 'ALLUMAGE : Bouton ON'
    conditions:
    - condition: trigger
      id: bouton_mqtt
    - condition: template
      value_template: '{{ trigger.payload == ''on'' }}'
    sequence:
    - action: light.turn_on
      target:
        entity_id: light.hue_smart_eco_pc_bureau
    - action: notify.mobile_app_eric
      data:
        data:
          icon: mdi:monitor-dashboard
          tag: notif_pc_bureau
        message: PC Bureau [ON]
        title: Allumage PC
  - alias: 'EXTINCTION : veille confirmée (12 min)'
    conditions:
    - condition: trigger
      id:
      - veille
      - rattrapage
    - condition: state
      entity_id: light.hue_smart_eco_pc_bureau
      state: 'on'
    - condition: state
      entity_id: binary_sensor.veille_pc_bureau
      state: 'on'
    - condition: template
      value_template: '{{ (now() - states[''binary_sensor.veille_pc_bureau''].last_changed)
        >= timedelta(minutes=12) }}'
    sequence:
    - action: light.turn_off
      target:
        entity_id: light.hue_smart_eco_pc_bureau
    - action: notify.mobile_app_eric
      data:
        data:
          icon: mdi:monitor-dashboard
          tag: notif_pc_bureau
        message: PC Bureau [OFF]
        title: Veille détectée
mode: single
