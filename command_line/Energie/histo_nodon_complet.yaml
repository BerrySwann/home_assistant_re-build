# ╭──────────────────────────────────────────────────────────────────────────╮
# │ COMMAND_LINE : HISTORIQUE NODON COMPLET — TOTAL, HP, HC, COUT (fichier)  │
# ╰──────────────────────────────────────────────────────────────────────────╯
#
# ## DESCRIPTION :
# Lit le fichier /config/notifs/nodon_complet_histo.txt et expose les 14 dernieres
# lignes valides dans l attribut "data" : un dictionnaire indexe par date "JJ/MM"
# avec total (kWh), hp (kWh), hc (kWh) et cout (EUR).
# Sert de source de remplacement aux capteurs linky_jour_1 a linky_jour_7 quand le
# releve Linky vaut 0 (Enedis n a pas publie) : voir P0_MyElectricalData.yaml.
# Inclus via : command_line: !include_dir_merge_list command_line/ (configuration.yaml)
#
# ## FORMAT DU FICHIER SOURCE :
# "JJ/MM | Total: 5.0 kWh | HP: 3.7 | HC: 1.3 | Cout: 1.0"
# Les lignes "(MANQUANT)" et les lignes illisibles sont ignorees.
# Fichier ecrit par l automation E (id 1792780906393, 23h59m10s, notify.nodon_complet_histo).
#
# ## ATTRIBUTS EXPOSES :
# data  : {"22/10": {"total": 5.0, "hp": 3.7, "hc": 1.3, "cout": 1.0}, ...}
# count : nombre de dates extraites
#
# ## CHAINE DE DEPENDANCES :
#
# | SOURCE                                   | SENSOR (unique_id)           | AVAL                                          |
# |:-----------------------------------------|:-----------------------------|:----------------------------------------------|
# | /config/notifs/nodon_complet_histo.txt   | histo_energie_nodon_complet  | templates linky_jour_1 a 7 (P0_MyElectricalData) |
#
# ## AVERTISSEMENTS :
# - scan_interval 900 : le fichier est ecrit 1x/jour (23h59m10s).
# - Si le fichier n existe pas (avant la premiere ecriture) : l attribut "data" est
#   absent, les templates utilisent leur repli suivant (nodon_histo.txt).
# - Python3 doit etre disponible dans le container HA (toujours vrai).

# --- histo_energie_nodon_complet ---
- sensor:
    name: "Histo Energie Nodon Complet"
    unique_id: histo_energie_nodon_complet
    scan_interval: 900
    command_timeout: 10
    command: |-
      python3 -c "
      import json
      result = {}
      data = {}
      try:
          with open('/config/notifs/nodon_complet_histo.txt') as f:
              lines = [l.strip() for l in f if l.strip() and '| Total:' in l and 'MANQUANT' not in l]
          for line in lines[-14:]:
              try:
                  parts = [p.strip() for p in line.split('|')]
                  vals = {}
                  for p in parts[1:]:
                      k, _, v = p.partition(':')
                      vals[k.strip().lower()] = round(float(v.strip().split()[0]), 2)
                  data[parts[0]] = {'total': vals['total'], 'hp': vals.get('hp', 0), 'hc': vals.get('hc', 0), 'cout': vals.get('cout', 0)}
              except Exception:
                  pass
          result['data'] = data
          result['count'] = str(len(data))
      except Exception as e:
          result['error'] = str(e)
      print(json.dumps(result))
      "
    value_template: "OK"
    json_attributes:
      - data
      - count