          for i, line in enumerate(reversed(lines[-7:])):
              parts = line.split('|')
              if len(parts) >= 2:
                  result['j'+str(i)+'_date'] = parts[0].strip()
                  val = parts[1]
                  try:
                      tokens = val.split(':')[-1].strip().split()
                      num = tokens[0] if tokens else ''
                      result['j'+str(i)+'_val'] = str(round(float(num),2))
