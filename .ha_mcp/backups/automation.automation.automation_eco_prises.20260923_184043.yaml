# ha_mcp_backup
schema_version: 1
domain: automation
entity_id: automation.automation_eco_prises
captured: '2026-09-23T18:40:43.826624+00:00'
tool: ha_config_set_automation
config:
  id: '1775245530054'
  alias: "ECO. PRISES DYNAMIQUE -> By-Pr\xE9sence/Groupe"
  description: "Pilotage des prises selon le groupe de pr\xE9sence (G1 \xE0 G4). La\
    \ liste des prises et leurs groupes est externalis\xE9e dans : templates/P2_prise/P2_eco_prises_config.yaml\
    \ Ajouter une prise = 1 entr\xE9e dans ce fichier + recharger templates.\n"
  triggers:
  - trigger: state
    entity_id: sensor.groupe
    id: groupe_change
    alias: "D\xC9CLENCHEUR \u2014 Changement de groupe"
  conditions:
  - alias: "FILTRE \u2014 Ignorer transitions depuis unavailable (boot HA)"
    condition: template
    value_template: '{{ trigger.from_state is not none and trigger.from_state.state
      not in [''unavailable'', ''unknown'', ''''] }}'
  actions:
  - alias: "VARIABLES \u2014 Groupe actif + liste des prises (source externe)"
    variables:
      g: '{{ states(''sensor.groupe'') }}'
      prises: '{{ state_attr(''sensor.eco_prises_config'', ''prises'') }}'
  - alias: "ACTION \u2014 ON/OFF chaque prise selon groupe"
    repeat:
      for_each: '{{ prises }}'
      sequence:
      - choose:
        - conditions:
          - condition: template
            value_template: '{{ g in repeat.item.groupes }}'
          sequence:
          - action: homeassistant.turn_on
            target:
              entity_id: '{{ repeat.item.entity }}'
        - conditions:
          - condition: template
            value_template: '{{ not repeat.item.get("absent_only", false) or g ==
              "groupe_1" }}'
          sequence:
          - action: homeassistant.turn_off
            target:
              entity_id: '{{ repeat.item.entity }}'
  - alias: "D\xC9LAI \u2014 Attente mise \xE0 jour \xE9tats avant notification"
    delay: 00:00:05
  - alias: "ACTION \u2014 Notification r\xE9sum\xE9 prises"
    action: notify.mobile_app_eric
    data:
      title: 'ECO PRISES: {{ g | upper }}'
      message: "{% set count_on = namespace(value=0) %} {% for p in prises %}\n  {%\
        \ if states(p.entity) == 'on' %}\n    {% set count_on.value = count_on.value\
        \ + 1 %}\n  {% endif %}\n{% endfor %} [{{ count_on.value }}/{{ prises | count\
        \ }}] prises ON\n"
  mode: queued
