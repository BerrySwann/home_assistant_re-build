# ha_mcp_backup
schema_version: 1
domain: script
entity_id: p1_master_gestion_clim
captured: '2026-11-22T19:24:26.014850+00:00'
tool: ha_config_set_script
config:
  alias: "P1 - MASTER : Gestion centralis\xE9e climatisation"
  description: "Pilotage des 3 clims jour/nuit selon le param\xE8tre periode. Appel\xE9\
    \ par P1_A_01 et P1_B_01."
  mode: queued
  max: 10
  fields:
    periode:
      name: "P\xE9riode"
      description: jour ou nuit
      required: true
      selector:
        select:
          options:
          - jour
          - nuit
    trigger_id:
      name: Trigger ID
      description: "ID du trigger ayant d\xE9clench\xE9 l'appel (pass\xE9 par l'automation)"
      required: false
      default: ''
      selector:
        text: null
    trigger_entity_id:
      name: Trigger Entity ID
      description: "Entity ID du trigger (pour message fen\xEAtre)"
      required: false
      default: ''
      selector:
        text: null
  sequence:
  - alias: "INIT : 1. PREFIX SELON P\xC9RIODE"
    variables:
      prefix: '{{ ''[AJ]'' if periode == ''jour'' else ''[AN]'' }}'
  - alias: "LOGIQUE : 2. D\xC9LAI DE S\xC9CURIT\xC9 AU RED\xC9MARRAGE"
    choose:
    - alias: "CAS : RED\xC9MARRAGE SYST\xC8ME D\xC9TECT\xC9"
      conditions:
      - condition: template
        value_template: '{{ trigger_id == ''ha_restart'' }}'
      sequence:
      - alias: 'ATTENTE : 1 MINUTE POUR STABILISATION'
        delay: 60
  - alias: "S\xC9CURIT\xC9 : 3. BOUCLE D ATTENTE DES CAPTEURS"
    repeat:
      until:
      - alias: "V\xC9RIFICATION : TOUS LES CAPTEURS SONT PR\xCATS OU LIMITE ATTEINTE"
        condition: or
        conditions:
        - alias: "\xC9TAT : TOUS OK"
          condition: template
          value_template: "{% set base_ok =\n  states('sensor.mode_ete_hiver') not\
            \ in ['unknown', 'unavailable'] and\n  states('sensor.groupe') not in\
            \ ['unknown', 'unavailable'] and\n  states('sensor.temperature_eco_hiver_corrige')\
            \ not in ['unknown', 'unavailable', '0'] and\n  states('sensor.temperature_eco_ete_corrige')\
            \ not in ['unknown', 'unavailable', '0'] and\n  states('sensor.temperature_corrige_salon')\
            \ not in ['unknown', 'unavailable', '0'] and\n  states('sensor.temperature_corrige_bureau')\
            \ not in ['unknown', 'unavailable', '0'] and\n  states('sensor.temperature_corrige_chambre')\
            \ not in ['unknown', 'unavailable', '0']\n%} {% if periode == 'jour' %}\n\
            \  {{ base_ok and\n     states('sensor.temperature_confort_jour') not\
            \ in ['unknown', 'unavailable', '0']\n  }}\n{% else %}\n  {{ base_ok and\n\
            \     states('sensor.temperature_confort_nuit') not in ['unknown', 'unavailable',\
            \ '0']\n  }}\n{% endif %}\n"
        - alias: 'LIMITE : 10 TENTATIVES (5 MIN)'
          condition: template
          value_template: '{{ repeat.index >= 10 }}'
      sequence:
      - alias: 'PAUSE : AVANT NOUVEL ESSAI'
        delay: 30
  - alias: 'DIAGNOSTIC : CAPTEURS ENCORE HS APRES LES 10 ESSAIS'
    variables:
      mode_saison_brut: '{{ states(''sensor.mode_ete_hiver'') }}'
      mode_ete_ok: '{{ ''true'' if states(''sensor.mode_ete_hiver'') not in [''unknown'',
        ''unavailable''] else ''false'' }}'
      eco_saison_ok: '{% if mode_ete_ok == ''true'' and mode_saison_brut == ''heat''
        %} {{ ''true'' if states(''sensor.temperature_eco_hiver_corrige'') not in
        [''unknown'', ''unavailable'', ''0''] else ''false'' }} {% elif mode_ete_ok
        == ''true'' and mode_saison_brut == ''cool'' %} {{ ''true'' if states(''sensor.temperature_eco_ete_corrige'')
        not in [''unknown'', ''unavailable'', ''0''] else ''false'' }} {% elif mode_ete_ok
        == ''true'' %} true {% else %}false{% endif %}'
      groupe_ok: '{{ ''true'' if states(''sensor.groupe'') not in [''unknown'', ''unavailable'']
        else ''false'' }}'
      temps_normales_ok: "{% set base =\n  states('sensor.temperature_corrige_salon')\
        \ not in ['unknown', 'unavailable', '0'] and\n  states('sensor.temperature_corrige_bureau')\
        \ not in ['unknown', 'unavailable', '0'] and\n  states('sensor.temperature_corrige_chambre')\
        \ not in ['unknown', 'unavailable', '0']\n%} {% if periode == 'jour' %} {{\
        \ 'true' if (base and states('sensor.temperature_confort_jour') not in ['unknown',\
        \ 'unavailable', '0']) else 'false' }} {% else %} {{ 'true' if (base and states('sensor.temperature_confort_nuit')\
        \ not in ['unknown', 'unavailable', '0']) else 'false' }} {% endif %}"
      hs_list: '{% set ns = namespace(hs=[]) %} {% if mode_ete_ok == ''false'' %}{%
        set ns.hs = ns.hs + [''mode_ete_hiver''] %}{% endif %} {% if groupe_ok ==
        ''false'' %}{% set ns.hs = ns.hs + [''groupe''] %}{% endif %} {% if states(''sensor.temperature_eco_hiver_corrige'')
        in [''unknown'', ''unavailable'', ''0''] %}{% set ns.hs = ns.hs + [''eco_hiver_corrige'']
        %}{% endif %} {% if states(''sensor.temperature_eco_ete_corrige'') in [''unknown'',
        ''unavailable'', ''0''] %}{% set ns.hs = ns.hs + [''eco_ete_corrige''] %}{%
        endif %} {% if states(''sensor.temperature_corrige_salon'') in [''unknown'',
        ''unavailable'', ''0''] %}{% set ns.hs = ns.hs + [''corrige_salon''] %}{%
        endif %} {% if states(''sensor.temperature_corrige_bureau'') in [''unknown'',
        ''unavailable'', ''0''] %}{% set ns.hs = ns.hs + [''corrige_bureau''] %}{%
        endif %} {% if states(''sensor.temperature_corrige_chambre'') in [''unknown'',
        ''unavailable'', ''0''] %}{% set ns.hs = ns.hs + [''corrige_chambre''] %}{%
        endif %} {% if periode == ''jour'' and states(''sensor.temperature_confort_jour'')
        in [''unknown'', ''unavailable'', ''0''] %}{% set ns.hs = ns.hs + [''temperature_confort_jour'']
        %}{% endif %} {% if periode == ''nuit'' and states(''sensor.temperature_confort_nuit'')
        in [''unknown'', ''unavailable'', ''0''] %}{% set ns.hs = ns.hs + [''temperature_confort_nuit'']
        %}{% endif %} {{ ns.hs | join('', '') }}'
      besoin_eco: '{{ ''true'' if (groupe_ok == ''false'' or temps_normales_ok ==
        ''false'' or (groupe_ok == ''true'' and states(''sensor.groupe'') == ''groupe_1''))
        else ''false'' }}'
      mode_degrade_eco: '{{ ''true'' if (mode_ete_ok == ''true'' and eco_saison_ok
        == ''true'' and (groupe_ok == ''false'' or temps_normales_ok == ''false''))
        else ''false'' }}'
      off_securite: '{{ ''true'' if (mode_ete_ok == ''false'' or (eco_saison_ok ==
        ''false'' and besoin_eco == ''true'')) else ''false'' }}'
  - alias: 'DIAGNOSTIC : APPLICATION SORTIE'
    choose:
    - alias: 'SORTIE 1 : OFF - CAPTEUR CRITIQUE HS'
      conditions:
      - condition: template
        value_template: '{{ off_securite == ''true'' }}'
      sequence:
      - alias: "NOTIF : ARR\xCAT S\xC9CURIT\xC9 CAPTEUR HS"
        action: notify.mobile_app_eric
        data:
          title: "{{ prefix }} S\xC9CURIT\xC9 CLIM"
          message: "Capteur(s) HS : {{ hs_list }}. Arr\xEAt s\xE9curit\xE9 - les climatiseurs\
            \ sont coup\xE9s (mode \xE9co impossible \xE0 calculer)."
      - alias: "ACTION : OFF S\xC9CURIT\xC9"
        action: climate.set_hvac_mode
        target:
          entity_id:
          - climate.clim_salon_rm4_mini
          - climate.clim_bureau_rm4_mini
          - climate.clim_chambre_rm4_mini
        data:
          hvac_mode: 'off'
      - alias: "FIN : ARR\xCAT APR\xC8S OFF S\xC9CURIT\xC9"
        stop: "Arr\xEAt s\xE9curit\xE9 capteur HS"
    - alias: "SORTIE 2 : MODE D\xC9GRAD\xC9 \xC9CO"
      conditions:
      - condition: template
        value_template: '{{ mode_degrade_eco == ''true'' }}'
      sequence:
      - alias: "NOTIF : MODE D\xC9GRAD\xC9"
        action: notify.mobile_app_eric
        data:
          title: "{{ prefix }} MODE D\xC9GRAD\xC9"
          message: "Capteur(s) HS : {{ hs_list }}. Mode d\xE9grad\xE9 - r\xE9glage\
            \ sur {{ 'eco heat' if mode_saison_brut == 'heat' else 'eco cool' }} ({{\
            \ 'temp\xE9rature \xE9co hiver' if mode_saison_brut == 'heat' else 'temp\xE9\
            rature \xE9co \xE9t\xE9' }})."
  - alias: 'INIT : CALCUL GLOBAL DES VARIABLES'
    variables:
      mode_saison: '{% set m = states(''sensor.mode_ete_hiver'') %} {% if m in [''heat'',
        ''cool'', ''off''] %} {{ m | trim }} {% else %} off {% endif %}'
      groupe_presence: '{{ states(''sensor.groupe'') | default(''groupe_1'') }}'
      fenetres_ouvertes: '{{ expand(''binary_sensor.contact_fenetre_salon_sonoff_contact'',
        ''binary_sensor.contact_fenetre_cuisine_sonoff_contact'', ''binary_sensor.contact_fenetre_bureau_sonoff_contact'',
        ''binary_sensor.contact_fenetre_chambre_sonoff_contact'') | selectattr(''state'',
        ''eq'', ''on'') | list | count > 0 }}'
      temp_eco_hc: '{{ states(''sensor.temperature_eco_hiver_corrige'') | float(states(''sensor.temperature_eco_hiver'')
        | float) }}'
      temp_eco_ec: '{{ states(''sensor.temperature_eco_ete_corrige'') | float(states(''sensor.temperature_eco_ete'')
        | float) }}'
      temp_cible: '{{ states(''sensor.temperature_confort_jour'') | float(states(''sensor.consigne'')
        | float) }}'
      tccj_s: '{{ (states(''sensor.temperature_corrige_salon'') | float(states(''sensor.temperature_confort_jour'')
        | float)) - (states(''sensor.correction_temperature_salon'') | float(0)) }}'
      tccj_b: '{{ (states(''sensor.temperature_corrige_bureau'') | float(states(''sensor.temperature_confort_jour'')
        | float)) - (states(''sensor.correction_temperature_bureau'') | float(0))
        }}'
      tccj_c: '{{ (states(''sensor.temperature_corrige_chambre'') | float(states(''sensor.temperature_confort_jour'')
        | float)) - (states(''sensor.correction_temperature_chambre'') | float(0))
        }}'
      tccn_s: '{{ (states(''sensor.temperature_consigne_nuit_salon'') | float(states(''sensor.seuil_chauffage'')
        | float(19))) - (states(''sensor.correction_temperature_salon'') | float(0))
        }}'
      tccn_b: '{{ (states(''sensor.temperature_consigne_nuit_bureau'') | float(states(''sensor.seuil_chauffage'')
        | float(19))) - (states(''sensor.correction_temperature_bureau'') | float(0))
        }}'
      tccn_c: '{{ (states(''sensor.temperature_consigne_nuit_chambre'') | float(states(''sensor.seuil_chauffage'')
        | float(19))) - (states(''sensor.correction_temperature_chambre'') | float(0))
        }}'
      tg3_s: '{{ ([(states(''sensor.temperature_confort_jour'') | float(states(''sensor.consigne'')
        | float(19))) + (states(''input_number.clim_decalage_groupe_3'') | float(0)),
        states(''sensor.max_chaud_hiver'') | float(22)] | min) - (states(''sensor.correction_temperature_salon'')
        | float(0)) }}'
      tg3_b: '{{ ([(states(''sensor.temperature_confort_jour'') | float(states(''sensor.consigne'')
        | float(19))) + (states(''input_number.clim_decalage_groupe_3'') | float(0)),
        states(''sensor.max_chaud_hiver'') | float(22)] | min) - (states(''sensor.correction_temperature_bureau'')
        | float(0)) }}'
      tg3_c: '{{ ([(states(''sensor.temperature_confort_jour'') | float(states(''sensor.consigne'')
        | float(19))) + (states(''input_number.clim_decalage_groupe_3'') | float(0)),
        states(''sensor.max_chaud_hiver'') | float(22)] | min) - (states(''sensor.correction_temperature_chambre'')
        | float(0)) }}'
  - alias: "INIT : 5. CALCUL DES CIBLES PAR PI\xC8CE (SELON P\xC9RIODE)"
    variables:
      eco_saison_val: '{% if mode_ete_ok == ''true'' and mode_saison_brut == ''heat''
        %} {{ states(''sensor.temperature_eco_hiver_corrige'') | float }} {% elif
        mode_ete_ok == ''true'' and mode_saison_brut == ''cool'' %} {{ states(''sensor.temperature_eco_ete_corrige'')
        | float }} {% else %}{{ states(''sensor.temperature_confort_jour'') | float
        }}{% endif %}'
      eco_hc_salon: '{{ [temp_eco_hc - (states(''sensor.correction_temperature_salon'')
        | float(0)), state_attr(''climate.clim_salon_rm4_mini'', ''min_temp'') | float(0)]
        | max }}'
      eco_hc_bureau: '{{ [temp_eco_hc - (states(''sensor.correction_temperature_bureau'')
        | float(0)), state_attr(''climate.clim_bureau_rm4_mini'', ''min_temp'') |
        float(0)] | max }}'
      eco_hc_chambre: '{{ [temp_eco_hc - (states(''sensor.correction_temperature_chambre'')
        | float(0)), state_attr(''climate.clim_chambre_rm4_mini'', ''min_temp'') |
        float(0)] | max }}'
      t_salon_target: "{% if mode_degrade_eco == 'true' %} {{ eco_saison_val }} {%\
        \ elif 'groupe_1' in groupe_presence %} {{ eco_hc_salon if mode_saison ==\
        \ 'heat' else temp_eco_ec }} {% elif periode == 'jour' and 'groupe_3' in groupe_presence\
        \ %} {{ tg3_s if mode_saison == 'heat' else tccj_b + (states('sensor.correction_temperature_bureau')\
        \ | float(0)\n   - states('sensor.correction_temperature_salon') | float(0))\
        \ }}\n{% elif periode == 'jour' and ('groupe_2' in groupe_presence or 'groupe_4'\
        \ in groupe_presence) %} {{ tccj_s }} {% elif periode == 'jour' %} {{ temp_eco_hc\
        \ if mode_saison == 'heat' else temp_eco_ec }} {% else %} {{ tccn_s }} {%\
        \ endif %}"
      t_bureau_target: '{% if mode_degrade_eco == ''true'' %} {{ eco_saison_val }}
        {% elif ''groupe_1'' in groupe_presence %} {{ eco_hc_bureau if mode_saison
        == ''heat'' else temp_eco_ec }} {% elif periode == ''jour'' and ''groupe_3''
        in groupe_presence %} {{ tg3_b if mode_saison == ''heat'' else tccj_b }} {%
        elif periode == ''jour'' and ''groupe_4'' in groupe_presence %} {{ tccj_b
        }} {% elif periode == ''jour'' and ''groupe_2'' in groupe_presence %} {{ temp_eco_hc
        if mode_saison == ''heat'' else tccj_b }} {% elif periode == ''jour'' %} {{
        temp_eco_hc if mode_saison == ''heat'' else temp_eco_ec }} {% else %} {{ tccn_b
        }} {% endif %}'
      t_chambre_target: '{% if mode_degrade_eco == ''true'' %} {{ eco_saison_val }}
        {% elif ''groupe_1'' in groupe_presence %} {{ eco_hc_chambre if mode_saison
        == ''heat'' else temp_eco_ec }} {% elif periode == ''jour'' and ''groupe_3''
        in groupe_presence %} {{ tg3_c if mode_saison == ''heat'' else tccj_c }} {%
        elif periode == ''jour'' and (''groupe_2'' in groupe_presence or ''groupe_4''
        in groupe_presence) %} {{ tccj_c }} {% elif periode == ''jour'' %} {{ temp_eco_hc
        if mode_saison == ''heat'' else temp_eco_ec }} {% else %} {{ tccn_c }} {%
        endif %}'
  - alias: "LOGIQUE : S\xC9CURIT\xC9 FEN\xCATRES VS GESTION STANDARD"
    choose:
    - alias: "CAS URGENCE : FEN\xCATRE OUVERTE D\xC9TECT\xC9E"
      conditions:
      - condition: template
        value_template: '{{ fenetres_ouvertes }}'
      sequence:
      - alias: "ACTION : ARR\xCAT FORC\xC9 DES UNIT\xC9S CLIM"
        action: climate.set_hvac_mode
        target:
          entity_id:
          - climate.clim_salon_rm4_mini
          - climate.clim_bureau_rm4_mini
          - climate.clim_chambre_rm4_mini
        data:
          hvac_mode: 'off'
      - alias: "NOTIF : ALERTE CIBL\xC9E SUR D\xC9CLENCHEUR"
        action: notify.mobile_app_eric
        data:
          title: "{{ prefix }} CLIM {{ periode | upper }} COUP\xC9E"
          message: "{% if trigger_entity_id == 'binary_sensor.contact_fenetre_salon_sonoff_contact'\n\
            \   and is_state('binary_sensor.contact_fenetre_salon_sonoff_contact',\
            \ 'on') %}\nLa fen\xEAtre du Salon a \xE9t\xE9 ouverte. {% elif trigger_entity_id\
            \ == 'binary_sensor.contact_fenetre_cuisine_sonoff_contact'\n   and is_state('binary_sensor.contact_fenetre_cuisine_sonoff_contact',\
            \ 'on') %}\nLa fen\xEAtre de la Cuisine a \xE9t\xE9 ouverte. {% elif trigger_entity_id\
            \ == 'binary_sensor.contact_fenetre_bureau_sonoff_contact'\n   and is_state('binary_sensor.contact_fenetre_bureau_sonoff_contact',\
            \ 'on') %}\nLa fen\xEAtre du Bureau a \xE9t\xE9 ouverte. {% elif trigger_entity_id\
            \ == 'binary_sensor.contact_fenetre_chambre_sonoff_contact'\n   and is_state('binary_sensor.contact_fenetre_chambre_sonoff_contact',\
            \ 'on') %}\nLa fen\xEAtre de la Chambre a \xE9t\xE9 ouverte. {% else %}\
            \ Une fen\xEAtre est ouverte (Mise \xE0 jour globale). {% endif %} {%\
            \ if states('sensor.nombre_de_fenetres_ouvertes') | int == 4 %} Toutes\
            \ les fen\xEAtres sont ouvertes. {% endif %}\n"
      - alias: "S\xC9CURIT\xC9 : ARR\xCAT IMM\xC9DIAT POUR \xC9VITER DOUBLON"
        stop: "Coupure fen\xEAtre effectu\xE9e"
    default:
    - alias: "ACTION : ENVOI DES COMMANDES AUX PI\xC8CES EN PARALL\xC8LE"
      parallel:
      - alias: LOGIQUE SALON
        choose:
        - alias: "V\xC9RIFICATION : S\xC9CURIT\xC9 SALON (PRISE + ARRET)"
          conditions:
          - condition: state
            entity_id: switch.clim_salon_nous
            state: 'on'
          - condition: state
            entity_id: input_boolean.clim_salon_arret_securise_en_cours
            state: 'off'
          sequence:
          - alias: "COMMANDE : R\xC9GLAGE TEMP\xC9RATURE ET MODE SALON"
            action: climate.set_temperature
            target:
              entity_id: climate.clim_salon_rm4_mini
            data:
              hvac_mode: "{% if trigger_id == 'sensor_update' and is_state('climate.clim_salon_rm4_mini',\
                \ 'off') %}\n  off\n{% else %}\n  {{ mode_saison }}\n{% endif %}"
              temperature: '{{ t_salon_target }}'
      - alias: LOGIQUE BUREAU
        choose:
        - alias: "V\xC9RIFICATION : S\xC9CURIT\xC9 BUREAU (PRISE + ARRET)"
          conditions:
          - condition: state
            entity_id: switch.clim_bureau_nous
            state: 'on'
          - condition: state
            entity_id: input_boolean.clim_bureau_arret_securise_en_cours
            state: 'off'
          sequence:
          - alias: "COMMANDE : R\xC9GLAGE TEMP\xC9RATURE ET MODE BUREAU"
            action: climate.set_temperature
            target:
              entity_id: climate.clim_bureau_rm4_mini
            data:
              hvac_mode: "{% if trigger_id == 'sensor_update' and is_state('climate.clim_bureau_rm4_mini',\
                \ 'off') %}\n  off\n{% else %}\n  {{ mode_saison }}\n{% endif %}"
              temperature: '{{ t_bureau_target }}'
      - alias: LOGIQUE CHAMBRE
        choose:
        - alias: "V\xC9RIFICATION : S\xC9CURIT\xC9 CHAMBRE (PRISE + ARRET)"
          conditions:
          - condition: state
            entity_id: switch.clim_chambre_nous
            state: 'on'
          - condition: state
            entity_id: input_boolean.clim_chambre_arret_securise_en_cours
            state: 'off'
          sequence:
          - alias: 'COMMANDE : MODE CHAMBRE'
            action: climate.set_hvac_mode
            target:
              entity_id: climate.clim_chambre_rm4_mini
            data:
              hvac_mode: '{% if trigger_id == ''sensor_update'' and is_state(''climate.clim_chambre_rm4_mini'',
                ''off'') %}off{% else %}{{ mode_saison }}{% endif %}'
          - alias: 'COMMANDE : CONSIGNES CHAMBRE (SmartIR Daikin - temperature simple)'
            action: climate.set_temperature
            target:
              entity_id: climate.clim_chambre_rm4_mini
            data:
              temperature: '{{ t_chambre_target }}'
    - alias: "PAUSE : S\xC9CURIT\xC9 R\xC9CEPTION"
      delay: 2
    - alias: "NOTIF : R\xC9SUM\xC9 DE L'\xC9TAT DES CLIMATISATIONS"
      action: notify.mobile_app_eric
      data:
        title: '{{ prefix }} {{ states(''sensor.presence'') }}'
        message: "{%- set prise_salon   = is_state('switch.clim_salon_nous', 'on')\
          \ -%}\n{%- set prise_bureau  = is_state('switch.clim_bureau_nous', 'on')\
          \ -%}\n{%- set prise_chambre = is_state('switch.clim_chambre_nous', 'on')\
          \ -%}\n{%- if not (prise_salon or prise_bureau or prise_chambre) -%}\n[UNITS\
          \ OFF] Aucune clim alimentee.\n{%- else -%}\n  {%- if 'groupe_1' in groupe_presence\
          \ and mode_saison in ['heat', 'cool'] -%}\n    {%- set entete = '[ECO HEAT]'\
          \ if mode_saison == 'heat' else '[ECO COOL]' -%}\n    {%- set t_s = (t_salon_target\
          \ | float(0)) + (states('sensor.correction_temperature_salon') | float(0))\
          \ -%}\n    {%- set t_b = (t_bureau_target | float(0)) + (states('sensor.correction_temperature_bureau')\
          \ | float(0)) -%}\n    {%- set t_c = (t_chambre_target | float(0)) + (states('sensor.correction_temperature_chambre')\
          \ | float(0)) -%}\n  {%- else -%}\n    {%- set entete = 'Mode : ' ~ (mode_saison\
          \ | upper) ~ (' (NUIT)' if periode == 'nuit' else '') -%}\n    {%- set t_s\
          \ = (t_salon_target | float(0)) + (states('sensor.correction_temperature_salon')\
          \ | float(0)) -%}\n    {%- set t_b = (t_bureau_target | float(0)) + (states('sensor.correction_temperature_bureau')\
          \ | float(0)) -%}\n    {%- set t_c = (t_chambre_target | float(0)) + (states('sensor.correction_temperature_chambre')\
          \ | float(0)) -%}\n  {%- endif -%}\n{{ entete }}\nSalon  : {{ (t_s | round(1)\
          \ | string ~ '\xB0') if prise_salon else '[OFF]' }}\nBureau : {{ (t_b |\
          \ round(1) | string ~ '\xB0') if prise_bureau else '[OFF]' }}\nChambre:\
          \ {{ (t_c | round(1) | string ~ '\xB0') if prise_chambre else '[OFF]' }}\n\
          {%- endif -%}"
