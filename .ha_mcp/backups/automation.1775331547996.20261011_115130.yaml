      - condition: trigger
        id: off_hue_play_1_pc_bureau
      sequence:
      - action: light.turn_on
        data:
          brightness_pct: 25
        target:
          entity_id: light.hue_play_1_pc_bureau
    - alias: PLAY 2
      conditions:
      - condition: trigger
        id: off_hue_play_2_pc_bureau
      sequence:
      - action: light.turn_on
        data:
          brightness_pct: 25
        target:
          entity_id: light.hue_play_2_pc_bureau
    - alias: PLAY 3
      conditions:
      - condition: trigger
        id: off_hue_play_3_pc_bureau
      sequence:
      - action: light.turn_on
        data:
          brightness_pct: 25
        target:
          entity_id: light.hue_play_3_pc_bureau
