    to: 'off'
    trigger: state
  - entity_id: switch.ecran_p_c_3_play_hue
    for: 00:07:00
    id: off_prise_ecran
    to: 'off'
    trigger: state
  conditions:
  - condition: state
    entity_id: binary_sensor.moniteur_pc
    state: 'on'
  actions:
  - choose:
    - alias: "PRISE ECRAN coup\xE9e : rallumer la prise puis les 3 Play"
      conditions:
      - condition: trigger
        id: off_prise_ecran
      sequence:
      - action: switch.turn_on
        data: {}
        target:
          entity_id: switch.ecran_p_c_3_play_hue
      - delay: 00:00:05
      - action: light.turn_on
        data:
          brightness_pct: 25
        target:
          entity_id:
          - light.hue_play_1_pc_bureau
          - light.hue_play_2_pc_bureau
          - light.hue_play_3_pc_bureau
    - alias: PLAY 1
