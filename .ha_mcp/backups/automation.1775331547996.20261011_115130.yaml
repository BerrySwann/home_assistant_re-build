config:
  id: '1775331547996'
  alias: P3_BUREAU - Forcer Play ON si PC tourne
  description: "Rallume les Hue Play \xE0 25 % si elles sont \xE9teintes manuellement\
    \ alors que la synchro PC est active. Rallume aussi la prise \xE9cran (switch.ecran_p_c_3_play_hue)\
