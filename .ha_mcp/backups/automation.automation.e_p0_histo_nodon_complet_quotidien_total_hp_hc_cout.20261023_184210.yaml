# ha_mcp_backup
schema_version: 1
domain: automation
entity_id: automation.e_p0_histo_nodon_complet_quotidien_total_hp_hc_cout
captured: '2026-10-23T18:42:10.022140+00:00'
tool: ha_config_set_automation
config:
  id: '1792780906393'
  alias: E - [P0] Histo Nodon complet quotidien (Total HP HC Cout)
  description: 'A 23h59m10s, logue la conso Nodon complete de la veille (last_period
    du compteur UM quotidien : Total, HP, HC) et le cout (tarifs EDF Tempo bleu) dans
    nodon_complet_histo.txt. Sert de source de remplacement des 0 Linky dans le tableau
    hebdomadaire L2C1 (templates linky_jour_1 a 7). Si le total vaut 0 : ecrit "(MANQUANT)".
    Prerequis : integration File "nodon_complet_histo" (notify.nodon_complet_histo)
    -> /config/notifs/nodon_complet_histo.txt

    '
  triggers:
  - alias: 'HORAIRE : EXECUTION 23H59M10S'
    at: '23:59:10'
    trigger: time
  conditions: []
  actions:
  - variables:
      cout: '{{ ((hp | float(0) * states(''sensor.edf_tempo_price_blue_hp'') | float(0))
        + (hc | float(0) * states(''sensor.edf_tempo_price_blue_hc'') | float(0)))
        | round(2) }}'
      date_j1: '{{ (now() - timedelta(days=1)).strftime(''%d/%m'') }}'
      hc: '{{ state_attr(''sensor.genelec_appart_hphc_quotidien_um_hc'', ''last_period'')
        | float(0) | round(1) }}'
      hp: '{{ state_attr(''sensor.genelec_appart_hphc_quotidien_um_hp'', ''last_period'')
        | float(0) | round(1) }}'
      total: '{{ state_attr(''sensor.genelec_appart_quotidien_um'', ''last_period'')
        | float(0) | round(1) }}'
  - else:
    - action: notify.send_message
      data:
        message: '{{ date_j1 }} | Total: 0.0 kWh | HP: 0.0 | HC: 0.0 | Cout: 0.0 (MANQUANT)

          '
      target:
        entity_id: notify.nodon_complet_histo
    if:
    - condition: template
      value_template: '{{ total | float(0) > 0 }}'
    then:
    - action: notify.send_message
      data:
        message: '{{ date_j1 }} | Total: {{ total }} kWh | HP: {{ hp }} | HC: {{ hc
          }} | Cout: {{ cout }}

          '
      target:
        entity_id: notify.nodon_complet_histo
  mode: single
