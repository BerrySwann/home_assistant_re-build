# ha_mcp_backup
schema_version: 1
domain: automation
entity_id: '1775244989013'
captured: '2026-11-05T06:35:16.928274+00:00'
tool: ha_config_set_automation
config:
  id: '1775244989013'
  alias: "Gestion Optimis\xE9e du Store Salon"
  description: "Priorit\xE9 Sommeil et Anti-Reflet. Groupe 1 (personne) : fermeture\
    \ imm\xE9diate, sans aucune autre condition. Groupe 2 ou 4 : ouverture selon lever/coucher\
    \ du soleil et temp\xE9ratures. S\xE9curit\xE9 : fen\xEAtre ouverte = aucun mouvement\
    \ (sauf groupe 1)."
  triggers:
  - at: 07:00:00
    id: reveil
    trigger: time
  - event: sunrise
    id: lever
    trigger: sun
  - entity_id: sensor.th_balcon_nord_temperature
    trigger: state
  - event: sunset
    trigger: sun
  - entity_id: binary_sensor.contact_fenetre_salon_sonoff_contact
    id: fenetre
    to: 'off'
    trigger: state
  - entity_id: sensor.groupe
    for: 00:05:00
    id: groupe_1
    to: groupe_1
    trigger: state
  - entity_id: sensor.groupe
    for: 00:05:00
    id: groupe_2_4
    to:
    - groupe_2
    - groupe_4
    trigger: state
  conditions: []
  actions:
  - choose:
    - alias: "GROUPE 1 : Personne, fermeture (priorit\xE9 absolue, aucune autre condition)"
      conditions:
      - condition: state
        entity_id: sensor.groupe
        state: groupe_1
      sequence:
      - action: cover.close_cover
        target:
          entity_id: cover.store_salon
    - alias: "SC\xC9NARIO A : Ouverture Travail (Groupe 2 ou 4, Printemps/Automne)"
      conditions:
      - alias: "S\xC9CURIT\xC9 : La fen\xEAtre doit \xEAtre FERM\xC9E pour bouger\
          \ le store"
        condition: state
        entity_id: binary_sensor.contact_fenetre_salon_sonoff_contact
        state: 'off'
      - condition: state
        entity_id: sensor.groupe
        state:
        - groupe_2
        - groupe_4
      - after: 07:00:00
        condition: time
      - after: sunrise
        condition: sun
      - before: sunset
        condition: sun
      - above: 12
        below: 32
        condition: numeric_state
        entity_id: sensor.th_balcon_nord_temperature
      - attribute: current_position
        below: 1
        condition: numeric_state
        entity_id: cover.store_salon
      sequence:
      - action: cover.open_cover
        target:
          entity_id: cover.store_salon
    - alias: "SC\xC9NARIO B : Fermeture Chaleur (\xC9t\xE9)"
      conditions:
      - alias: "S\xC9CURIT\xC9 : La fen\xEAtre doit \xEAtre FERM\xC9E pour bouger\
          \ le store"
        condition: state
        entity_id: binary_sensor.contact_fenetre_salon_sonoff_contact
        state: 'off'
      - above: 32
        condition: numeric_state
        entity_id: sensor.th_balcon_nord_temperature
      - before: sunset
        condition: sun
      sequence:
      - action: cover.close_cover
        target:
          entity_id: cover.store_salon
    - alias: "SC\xC9NARIO C : Fermeture Nuit"
      conditions:
      - alias: "S\xC9CURIT\xC9 : La fen\xEAtre doit \xEAtre FERM\xC9E pour bouger\
          \ le store"
        condition: state
        entity_id: binary_sensor.contact_fenetre_salon_sonoff_contact
        state: 'off'
      - after: sunset
        condition: sun
      sequence:
      - action: cover.close_cover
        target:
          entity_id: cover.store_salon
  mode: single
