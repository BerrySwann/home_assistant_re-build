# ha_mcp_backup
schema_version: 1
domain: script
entity_id: sdb_soufflant_demarrer
captured: '2026-10-07T18:20:29.230438+00:00'
tool: ha_config_set_script
config:
  alias: 'SDB - Soufflant : DEMARRAGE (2000 W, verrou 2 min)'
  description: '[EXECUTANT] Prise ON, mise en route IR, 2 impulsions 1000 W, verrou
    2 min.'
  mode: single
  sequence:
  - alias: 'SECURITE : refus de demarrer en mode cool (ete). Remplace le garde-fou
      25 degres, qui bloquait en hiver.'
    condition: not
    conditions:
    - condition: state
      entity_id: sensor.mode_ete_hiver
      state: cool
  - alias: Attendre la fin d'une sequence d'arret en cours
    timeout: 00:02:00
    wait_template: '{{ is_state(''script.sdb_soufflant_arreter'', ''off'') }}'
  - action: input_boolean.turn_on
    alias: POSER LE VERROU (2 minutes)
    target:
      entity_id: input_boolean.verrou_soufflant_salle_de_bain
  - action: switch.turn_on
    alias: Alimenter la prise
    target:
      entity_id: switch.prise_soufflant_salle_de_bain_nous
  - delay: 00:00:01
  - action: remote.send_command
    alias: Mise en route de l'appareil (IR)
    data:
      command: on_off
      device: radiateur_sdb
    target:
      entity_id: remote.soufflant_sdb
  - delay: '00:00:00.8'
  - action: remote.send_command
    alias: Deux impulsions 1000 W, soit 2000 W
    data:
      command: 1000w
      delay_secs: 0.8
      device: radiateur_sdb
      num_repeats: 2
    target:
      entity_id: remote.soufflant_sdb
  - action: input_select.select_option
    alias: Compteur d'etat logiciel
    data:
      option: 2000W
    target:
      entity_id: input_select.etat_resistance_soufflant_sdb
  - action: climate.set_hvac_mode
    alias: 'Affichage du climate : heat (comme l''automation de fevrier)'
    data:
      hvac_mode: heat
    target:
      entity_id: climate.soufflant_salle_de_bain
  - alias: 'VERROU : deux minutes de marche protegee'
    delay: 00:02:00
  - action: input_boolean.turn_off
    alias: LEVER LE VERROU
    target:
      entity_id: input_boolean.verrou_soufflant_salle_de_bain
  - alias: Si l'interrupteur a ete remis sur OFF pendant le verrou, arreter
    choose:
    - conditions:
      - condition: state
        entity_id: input_boolean.inter_soufflant_salle_de_bain
        state: 'off'
      sequence:
      - action: script.turn_on
        target:
          entity_id: script.sdb_soufflant_arreter
  - alias: 'SECURITE : arret force apres 60 minutes de marche'
    continue_on_timeout: true
    timeout: 01:00:00
    wait_template: '{{ is_state(''switch.inter_soufflant_salle_de_bain'', ''off'')
      }}'
  - alias: 'SECURITE : si l''appareil tourne encore, l''eteindre (la sequence d''arret
      enchaine)'
    if:
    - condition: state
      entity_id: switch.inter_soufflant_salle_de_bain
      state: 'on'
    then:
    - action: switch.turn_off
      target:
        entity_id: switch.inter_soufflant_salle_de_bain
